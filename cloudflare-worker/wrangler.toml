name = "leadvyne-api-proxy"
main = "worker-entry.js"
compatibility_date = "2026-01-01"

# Enabled via the dashboard (Observability tab) to debug the voice-to-voice transcription issue —
# committed here so a future `wrangler deploy` from this config doesn't silently turn it back off.
[observability.logs]
enabled = true
invocation_logs = true

# Four schedules, dispatched by event.cron in `scheduled()`:
#  - "0 2 * * *"     Integrations tab health check, once daily for every client
#                    (runDailyHealthCheckForAllClients in worker.js) — AND the Advanced Pipeline
#                    module's follow-up cadence advance (runPipelineFollowupsForAllClients) — AND
#                    the Calendar Events module's due-today sends (runCalendarEventsForAllClients)
#                    — AND the SaaS Ops module's health-score/reminder/support-pull sweeps
#                    (runSaasHealthScoresForAllClients etc.), all piggybacked on the same tick
#                    since none of them need finer-than-daily granularity.
#  - "*/15 * * * *"  Automations module — advances every client's active flows
#                    (runAutomationFlowsForAllClients in worker.js) — AND the Review Request
#                    module's own sweep (sweepReviewRequests in worker.js), piggybacked on the
#                    same tick since a multi-hour/day review-request delay doesn't need its own
#                    finer-grained schedule.
#  - "*/20 * * * *"  Shopify module — abandoned-cart nudge sweep
#                    (sweepAbandonedShopifyCheckouts in worker.js). Also the `scheduled()`
#                    dispatcher's trailing `else` — any cron string not explicitly matched lands
#                    here, so a 5th schedule added later MUST get its own explicit `else if`
#                    branch before this one, not just a new string in the array below.
#  - "0 9 * * 1"     SaaS Ops module — weekly owner digest + weekly customer value update
#                    (runWeeklyOwnerDigest/runWeeklyCustomerValueUpdate in worker.js), Mondays
#                    09:00 UTC.
[triggers]
crons = ["0 2 * * *", "*/15 * * * *", "*/20 * * * *", "0 9 * * 1"]

# D1 — sidecar storage for the Review Request and Referral tracking modules only (see
# migrations/0001_reviews_referrals.sql and SETUP.md). Everything else in this app still lives in
# NocoDB; these two modules invented data with no other reader in the app, so it didn't need to go
# through NocoDB's per-field-by-hand schema process.
# One-time setup:
#   1. wrangler d1 create leadvyne-d1
#   2. Paste the returned database_id below over the placeholder.
#   3. wrangler d1 migrations apply leadvyne-d1 --remote
[[d1_databases]]
binding = "DB"
database_name = "leadvyne-d1"
database_id = "eeb0ce10-dd0d-4e5a-92c1-d9ebe485ea52"

# KV — per-client matrimonial profile read cache; reduces D1 load for the WhatsApp chat menu's
# paginated profile delivery. Keys are `matri_profiles:{clientId}` (TTL 7200 s); invalidated on
# every profile create/update/delete and webhook import. Falls back to D1 silently if the binding
# is absent or the namespace ID has not been filled in. One-time setup:
#   1. wrangler kv:namespace create leadvyne-matri-cache
#   2. Paste the returned id below over the placeholder.
[[kv_namespaces]]
binding = "MATRI_CACHE"
id = "d0b6a1710e024964a0938bdb7c58a053"

# R2 — object storage for the Hospitality module's unit photos/video (SETUP.md "Hospitality
# module"). Everything else this app stores is either NocoDB rows or small D1 text/JSON — this is
# the first real binary media this Worker holds, hence a bucket rather than a database column
# (D1/NocoDB rows have no sane way to hold a 9 MB video). One-time setup:
#   1. wrangler r2 bucket create leadvyne-hospitality-media
#   2. No id/paste-in needed — R2 buckets are addressed by name, unlike D1's UUID.
[[r2_buckets]]
binding = "HOSPITALITY_MEDIA"
bucket_name = "leadvyne-hospitality-media"

# R2 — object storage for the Ecommerce module's category photos (SETUP.md "Ecommerce
# categories"), same rationale as HOSPITALITY_MEDIA above (a dedicated bucket per media domain,
# rather than one shared bucket, matches that existing precedent). One-time setup:
#   1. wrangler r2 bucket create leadvyne-ecom-category-media
#   2. No id/paste-in needed — R2 buckets are addressed by name, unlike D1's UUID.
[[r2_buckets]]
binding = "ECOM_CATEGORY_MEDIA"
bucket_name = "leadvyne-ecom-category-media"

# R2 — object storage for the Marketing Studio module's source videos and rendered clips
# (SETUP.md "Marketing Studio module"), same per-domain-bucket rationale as HOSPITALITY_MEDIA/
# ECOM_CATEGORY_MEDIA above. Holds much larger objects than either of those (source video, not
# a handful of photos) but the binding pattern is identical. One-time setup:
#   1. wrangler r2 bucket create leadvyne-marketing-media
#   2. No id/paste-in needed — R2 buckets are addressed by name, unlike D1's UUID.
[[r2_buckets]]
binding = "MARKETING_MEDIA"
bucket_name = "leadvyne-marketing-media"

# Vectorize — semantic memory (SETUP.md "Semantic memory"). One shared index across all clients
# (metadata-filtered by client_id/kind per query, not a physical per-client index, since Vectorize
# indexes are a paid-per-index resource). Holds embeddings of past conversation exchanges plus
# Ecommerce product/category text; the actual chunk text lives in D1 (migrations/0056_memory_chunks.sql),
# keyed by the same id as the Vectorize vector. text-embedding-004 (768 dimensions, via the shared
# GEMINI_API_KEY secret — no separate embeddings credential needed). One-time setup:
#   1. wrangler vectorize create leadvyne-memory --dimensions=768 --metric=cosine
#   2. wrangler vectorize create-metadata-index leadvyne-memory --property-name=client_id --type=number
#   3. wrangler vectorize create-metadata-index leadvyne-memory --property-name=kind --type=string
#   4. wrangler d1 migrations apply leadvyne-d1 --remote   (creates the memory_chunks table)
# Every call site checks this binding exists and fails open if it's missing/misconfigured — a
# deployment that skips this setup just runs without semantic memory (Tier 1 customer-facts memory
# and everything else keep working normally), not a broken deploy.
[[vectorize]]
binding = "MEMORY_INDEX"
index_name = "leadvyne-memory"

# Durable Object — one instance per client (idFromName(clientId) in worker.js), holding that
# client's currently-connected dashboard WebSockets so a new inbound message can push straight to
# an open tab instead of waiting for the next 60s poll (SETUP.md "Real-time dashboard updates").
# See ClientUpdatesHub/handleEngineLiveSocket/engineBroadcastUpdate in worker.js. One-time setup:
# just `wrangler deploy` — Durable Object migrations (below) apply automatically, no separate
# `wrangler d1`-style create/paste-id step like the bindings above.
[[durable_objects.bindings]]
name = "CLIENT_UPDATES"
class_name = "ClientUpdatesHub"

# Smart Follow-ups — one Durable Object per lead for opted-in clients; self-schedules alarms
# instead of being swept by the */15 cron, so each step fires at exactly the right time and the
# ladder correctly resets when the customer replies. Only active for clients who enable
# "Smart Follow-ups (Beta)" in Campaigns → Follow-up Engine; all others still use the cron sweep.
# One-time setup: just `wrangler deploy` — the v2 migration below creates the namespace.
[[durable_objects.bindings]]
name = "LEAD_AGENT"
class_name = "LeadFollowupAgent"

[[migrations]]
tag = "v1"
# SQLite-backed storage (not the classic `new_classes`) — required to create a Durable Object
# namespace at all on a Workers free/paid-non-Enterprise plan (confirmed live: `wrangler deploy`
# fails with error code 10097, "you must create a namespace using a `new_sqlite_classes`
# migration", otherwise). ClientUpdatesHub never actually touches `this.state.storage` itself
# (webSocketMessage/webSocketClose are no-ops, see worker.js) — the Hibernatable WebSockets API
# still needs SOME storage backend attached to the namespace, so this is required regardless.
new_sqlite_classes = ["ClientUpdatesHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LeadFollowupAgent"]

# Healthcare appointment reliability. API requests publish small ID-only jobs to the primary
# queue; the consumer retries transient Calendar/WhatsApp failures with exponential delay. After
# five failed deliveries Cloudflare moves the job to the DLQ, which this Worker consumes and
# records in healthcare_queue_failures for dashboard visibility.
[[queues.producers]]
binding = "HEALTHCARE_JOBS"
queue = "leadvyne-healthcare-jobs"

[[queues.consumers]]
queue = "leadvyne-healthcare-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "leadvyne-healthcare-jobs-dlq"

[[queues.consumers]]
queue = "leadvyne-healthcare-jobs-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# One durable instance per saved appointment version. It queues the confirmation immediately,
# then sleeps until the configured 24-hour and 2-hour reminder points. Rescheduling terminates the
# previous instance and creates a fresh version so stale reminders cannot reach a patient.
[[workflows]]
name = "leadvyne-healthcare-appointment"
binding = "HEALTHCARE_APPOINTMENT_WORKFLOW"
class_name = "HealthcareAppointmentWorkflow"

# Project task reliability. Task CRUD publishes ID-only events; transient automation/email errors
# retry on the primary queue and exhausted messages are recorded from the DLQ in pm_queue_failures.
[[queues.producers]]
binding = "PROJECT_JOBS"
queue = "leadvyne-project-jobs"

[[queues.consumers]]
queue = "leadvyne-project-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "leadvyne-project-jobs-dlq"

[[queues.consumers]]
queue = "leadvyne-project-jobs-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# One durable, versioned instance per active task with a due date. It sleeps until the 48-hour,
# due-day and next-day escalation points. Editing/completing/deleting a task terminates the old
# instance; every delivery also verifies the saved task version before sending.
[[workflows]]
name = "leadvyne-project-task-lifecycle"
binding = "PROJECT_TASK_WORKFLOW"
class_name = "ProjectTaskWorkflow"

# Non-secret config (safe to commit) — override per-environment with `wrangler.toml` vars
