// Reads a CSS custom property off the live page (so the PDF picks up whichever industry theme
// — theme-travel, theme-insurance, etc. — is actually applied) and converts it to a jsPDF RGB
// triple, falling back to the base theme's value if the property isn't set for some reason.
function sqAccentRgb(varName,fallbackHex){
  let hex=fallbackHex;
  try{
    const v=getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    if(v) hex=v;
  }catch(e){}
  return sqHexToRgb(hex);
}

function sqHexToRgb(hex){
  hex=(hex||'').replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16)||0;
  return[(n>>16)&255,(n>>8)&255,n&255];
}

// Shifts an RGB triple toward black (negative percent) or white (positive percent) — used to
// derive an ink/soft-tint pair from a single custom accent color, the same way the CSS theme
// already provides --accent-ink/--accent-soft alongside --accent.
function sqShade(rgb,percent){
  return rgb.map(c=>{
    const v=percent<0?c*(1+percent):c+(255-c)*percent;
    return Math.max(0,Math.min(255,Math.round(v)));
  });
}

// Builds the itemized rows for the quotation table (Description / No. of Persons / Price /
// Total), one row per unit the client's charging for plus zero-priced context rows (inclusions,
// itinerary days, notes) — mirrors a standard line-item quote layout regardless of format.
function sqBuildLineItems(src,format,price,currency,pax){
  const rows=[];
  const unitPrice=parseFloat(price)||0;
  if(format==='package'){
    if(src.type==='package'){
      const p=src.rec;
      safeJson(p.inclusions,[]).forEach(inc=>rows.push({desc:'Included: '+inc,persons:'',price:0,total:0}));
      rows.push({desc:p.name||'Package',persons:pax,price:unitPrice,total:unitPrice*pax});
      if((p.notes||'').trim()) rows.push({desc:'Note: '+p.notes.trim(),persons:'',price:0,total:0});
    }else{
      const it=src.rec;
      (it.days||[]).forEach(d=>{
        const items=(d.items||[]).map(i=>i.description).filter(Boolean).join(', ');
        rows.push({desc:`Day ${d.day_no}: ${d.title||''}${items?' — '+items:''}`,persons:'',price:0,total:0});
      });
      rows.push({desc:it.title||'Itinerary',persons:pax,price:unitPrice,total:unitPrice*pax});
      if((it.notes||'').trim()) rows.push({desc:'Note: '+it.notes.trim(),persons:'',price:0,total:0});
    }
  }else if(format==='group_fare'){
    rows.push({desc:src.rec.destination?`Group Fare — ${src.rec.destination}`:'Group Fare',persons:pax,price:unitPrice,total:unitPrice*pax});
    if((src.rec.notes||'').trim()) rows.push({desc:'Note: '+src.rec.notes.trim(),persons:'',price:0,total:0});
  }else{ // travel_service
    const label=src.type==='package'?(src.rec.name||'Travel Service'):(src.rec.title||'Travel Service');
    rows.push({desc:label,persons:pax,price:unitPrice,total:unitPrice*pax});
    if((src.rec.notes||'').trim()) rows.push({desc:'Note: '+src.rec.notes.trim(),persons:'',price:0,total:0});
  }
  const subtotal=rows.reduce((s,r)=>s+(r.total||0),0);
  return{rows,subtotal};
}

// Stamps a footer (rule + optional business address + "Page X of N") on every page of the
// document — called once at the end, after all content/pagination has happened, since the
// final page count isn't known until then.
function stampQuoteFooter(doc,marginX){
  const address=(clientRecord.quote_footer_address||'').trim();
  const pageW=doc.internal.pageSize.getWidth();
  const pageH=doc.internal.pageSize.getHeight();
  const totalPages=doc.internal.getNumberOfPages();
  for(let p=1;p<=totalPages;p++){
    doc.setPage(p);
    const fy=pageH-38;
    doc.setDrawColor(220);doc.setLineWidth(0.6);
    doc.line(marginX,fy,pageW-marginX,fy);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120);
    if(address){
      const lines=doc.splitTextToSize(address,pageW-marginX*2-90);
      doc.text(lines,marginX,fy+13);
    }
    doc.text(`Page ${p} of ${totalPages}`,pageW-marginX,fy+13,{align:'right'});
    doc.setTextColor(0);
  }
}

// Renders the itinerary's own day-by-day content (with per-item photos) rather than converting
// it into a priced line-item table — used when SQ_FORMATS' 'itinerary_full' format is selected.
// Shares the same branding (logo/accent/footer) as sqBuildPdfDoc's quote layout so a PDF sent
// from either format looks like it came from the same business, just with no pricing section.
function itinBuildFullPdfDoc(lead,it,quoteNumber){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'a4'});
  const marginX=40;
  const pageW=doc.internal.pageSize.getWidth();
  const pageH=doc.internal.pageSize.getHeight();
  const contentW=pageW-marginX*2;

  const customHex=(clientRecord.quote_accent_color||'').trim();
  const accent=customHex?sqHexToRgb(customHex):sqAccentRgb('--accent','#0D9C93');
  const accentInk=customHex?sqShade(accent,-0.35):sqAccentRgb('--accent-ink','#1E3A6E');
  const accentSoft=customHex?sqShade(accent,0.85):sqAccentRgb('--accent-soft','#DFF6F3');

  let y=44;
  let logoBottomY=y;
  // An itinerary's own logo_url (Logo field on the itinerary modal) overrides the account-wide
  // quote_logo_url for its own PDF only — e.g. a co-branded trip with a partner operator. Its
  // dimensions come from _itinSendLogoDims (measured once for the whole batch in sqSend, not
  // per-lead) rather than _itinLogoDims, since the itinerary modal that set the latter usually
  // isn't open anymore by the time a bulk send actually runs.
  const logoUrl=it.logo_url||clientRecord.quote_logo_url;
  const logoDims=it.logo_url?_itinSendLogoDims:_quoteLogoDims;
  if(logoUrl){
    try{
      const mime=/data:image\/(png|jpe?g|webp)/.exec(logoUrl);
      const fmt=mime?({png:'PNG',jpg:'JPEG',jpeg:'JPEG',webp:'WEBP'}[mime[1]]):'PNG';
      const maxLogoW=110,maxLogoH=50;
      let w=maxLogoW,h=maxLogoH;
      if(logoDims&&logoDims.w&&logoDims.h){
        const ratio=Math.min(maxLogoW/logoDims.w,maxLogoH/logoDims.h);
        w=logoDims.w*ratio; h=logoDims.h*ratio;
      }
      doc.addImage(logoUrl,fmt,marginX,y,w,h,undefined,'FAST');
      logoBottomY=y+h;
    }catch(e){}
  }
  const headerTitle=(clientRecord.quote_header_title||clientRecord.client_name||'Itinerary').trim();
  doc.setFont('times','bold');doc.setFontSize(24);doc.setTextColor(...accentInk);
  doc.text(headerTitle,pageW/2,y+22,{align:'center'});
  doc.setTextColor(0);
  y=Math.max(logoBottomY,y+30)+12;

  doc.setDrawColor(...accent);doc.setLineWidth(1.2);
  doc.line(marginX,y,pageW-marginX,y);
  y+=20;

  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(20);
  doc.text(it.title||'Itinerary',marginX,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(60);
  doc.text(quoteNumber||'',pageW-marginX,y,{align:'right'});
  doc.setTextColor(0);
  y+=22;

  // Meta grid — trip basics on the left, document identity on the right. Same layout/type sizes
  // as the Quotation PDF's own meta grid (sqBuildPdfDoc), just itinerary-specific fields, so a
  // customer receiving both document types from this business sees one consistent format.
  const dateRange=it.from_date&&it.to_date?`${it.from_date} to ${it.to_date}`:(it.from_date||it.to_date||'');
  const metaLeft=[['Destination:',it.destination||'—'],['Trip Dates:',dateRange||'—'],['Duration:',`${(it.days||[]).length} day(s)`]];
  const metaRight=[['Itinerary No.:',quoteNumber||'—'],['Issued On:',new Date().toLocaleDateString()],['Prepared By:',clientRecord.client_name||'—']];
  doc.setFontSize(9);
  let my=y;
  metaLeft.forEach(([lab,val])=>{
    doc.setFont('helvetica','bold');doc.setTextColor(60);doc.text(lab,marginX,my);
    doc.setFont('helvetica','normal');doc.setTextColor(20);doc.text(String(val),marginX+120,my);
    my+=15;
  });
  let my2=y;
  metaRight.forEach(([lab,val])=>{
    doc.setFont('helvetica','bold');doc.setTextColor(60);doc.text(lab,marginX+contentW/2,my2);
    doc.setFont('helvetica','normal');doc.setTextColor(20);doc.text(String(val),marginX+contentW/2+80,my2);
    my2+=15;
  });
  doc.setTextColor(0);
  y=Math.max(my,my2)+8;

  doc.setDrawColor(220);doc.setLineWidth(0.6);
  doc.line(marginX,y,pageW-marginX,y);
  y+=20;

  // From (this business) / To (the lead) block — identical layout and colors to the Quotation
  // PDF's own FROM/TO block.
  const fromAddr=(clientRecord.quote_footer_address||'').trim();
  const fromLines=fromAddr?doc.splitTextToSize(fromAddr,contentW/2-30):[];
  const toLines=[];
  if(lead.Phone) toLines.push(String(lead.Phone));
  if(lead.Email) toLines.push(String(lead.Email));

  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(20);
  doc.text(clientRecord.client_name||'—',marginX,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(80);
  let fy=y+13;
  fromLines.forEach(line=>{doc.text(line,marginX,fy);fy+=12;});

  const toX=marginX+contentW/2+10;
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...accentInk);
  doc.text('TO',toX,y-11);
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(20);
  doc.text(lead.Name||lead.Phone||'Customer',toX,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(80);
  let ty=y+13;
  toLines.forEach(line=>{doc.text(line,toX,ty);ty+=12;});

  doc.setTextColor(0);
  y=Math.max(fy,ty)+18;

  const ensureSpace=(needed)=>{ if(y+needed>pageH-70){ doc.addPage(); y=50; } };

  (it.days||[]).forEach(d=>{
    ensureSpace(40);
    doc.setFillColor(...accent);
    doc.roundedRect(marginX,y,contentW,22,4,4,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(255,255,255);
    doc.text(`Day ${d.day_no}${d.title?' — '+d.title:''}`,marginX+10,y+15);
    doc.setTextColor(0);
    y+=32;

    (d.items||[]).forEach(item=>{
      const meta=itinTypeMeta(item.type);
      const typeRgb=sqHexToRgb(meta.hex);
      const hasImg=!!item.image;
      const imgSize=70;
      // innerLeft clears the 4pt color bar + padding; text starts under the type pill, not
      // beside it, so long descriptions wrap under the label rather than fighting it for width.
      const innerLeft=16,innerRight=8;
      const textW=contentW-innerLeft-innerRight-(hasImg?imgSize+12:0);
      const descLines=doc.splitTextToSize(item.description||'—',textW);
      // 26 clears the pill row + top/bottom padding; 12 per line matches the line height used
      // for every other multi-line text block in this document (terms, notes, etc).
      const blockH=Math.max(26+12*descLines.length, hasImg?imgSize+16:0);
      ensureSpace(blockH+8);

      // Timeline card: a solid left bar + a colored pill, both keyed to the item's type
      // (flight/hotel/activity/transfer/meal/note — see ITIN_TYPE_META), on the same accentSoft
      // background every other section of this PDF uses. Makes a day's mix of logistics vs.
      // experiences scannable at a glance instead of reading as one undifferentiated list.
      doc.setFillColor(...typeRgb);
      doc.rect(marginX,y,4,blockH,'F');
      doc.setFillColor(...accentSoft);
      doc.rect(marginX+4,y,contentW-4,blockH,'F');

      doc.setFont('helvetica','bold');doc.setFontSize(7.5);
      const pillLabel=meta.label.toUpperCase();
      const pillW=doc.getTextWidth(pillLabel)+14;
      doc.setFillColor(...typeRgb);
      doc.roundedRect(marginX+innerLeft,y+6,pillW,13,3,3,'F');
      doc.setTextColor(255,255,255);
      doc.text(pillLabel,marginX+innerLeft+7,y+15);
      doc.setTextColor(0);

      doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(30);
      doc.text(descLines,marginX+innerLeft,y+31);

      if(hasImg){
        try{
          const mime=/data:image\/(png|jpe?g|webp)/.exec(item.image);
          const fmt=mime?({png:'PNG',jpg:'JPEG',jpeg:'JPEG',webp:'WEBP'}[mime[1]]):'PNG';
          doc.addImage(item.image,fmt,marginX+contentW-imgSize-10,y+Math.max(6,(blockH-imgSize)/2),imgSize,imgSize-10,undefined,'FAST');
        }catch(e){}
      }
      doc.setTextColor(0);
      y+=blockH+8;
    });
  });

  if((it.notes||'').trim()){
    const noteLines=doc.splitTextToSize(it.notes.trim(),contentW-20);
    const boxH=24+noteLines.length*11;
    ensureSpace(boxH+16);
    doc.setFillColor(...accentSoft);
    doc.roundedRect(marginX,y,contentW,boxH,4,4,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...accentInk);
    doc.text('Notes',marginX+10,y+15);
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(70);
    doc.text(noteLines,marginX+10,y+28);
    doc.setTextColor(0);
    y+=boxH+16;
  }

  // Same accentSoft-fill/accentInk-heading styling as the Quotation PDF's own Terms & Conditions
  // box (sqBuildPdfDoc), not a fixed gray — so both document types read as the same brand.
  const terms=(clientRecord.quote_terms||QUOTE_DEFAULT_TERMS).trim();
  if(terms){
    const termsLines=doc.splitTextToSize(terms,contentW-20);
    const boxH=24+termsLines.length*10.5;
    ensureSpace(boxH+16);
    doc.setFillColor(...accentSoft);
    doc.roundedRect(marginX,y,contentW,boxH,4,4,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...accentInk);
    doc.text('Terms & Conditions',marginX+10,y+15);
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(70);
    doc.text(termsLines,marginX+10,y+28);
    doc.setTextColor(0);
    y+=boxH+16;
  }

  ensureSpace(30);
  doc.setFont('times','bold');doc.setFontSize(14);doc.setTextColor(...accentInk);
  doc.text('We look forward to hosting you!',pageW/2,y+10,{align:'center'});
  doc.setTextColor(0);

  stampQuoteFooter(doc,marginX);
  return doc;
}

function sqBuildPdfDoc(lead,src,format,price,currency,pax,validity,quoteNumber){
  if(format==='itinerary_full') return itinBuildFullPdfDoc(lead,src.rec,quoteNumber);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'a4'});
  const marginX=40;
  const pageW=doc.internal.pageSize.getWidth();
  const pageH=doc.internal.pageSize.getHeight();
  const contentW=pageW-marginX*2;

  // Colors: a custom quote_accent_color (if set) drives everything — ink/soft tints are shaded
  // from it programmatically — otherwise falls back to the account's own theme accent.
  const customHex=(clientRecord.quote_accent_color||'').trim();
  const accent=customHex?sqHexToRgb(customHex):sqAccentRgb('--accent','#0D9C93');
  const accentInk=customHex?sqShade(accent,-0.35):sqAccentRgb('--accent-ink','#1E3A6E');
  const accentSoft=customHex?sqShade(accent,0.85):sqAccentRgb('--accent-soft','#DFF6F3');

  let y=44;

  // ── Header: logo top-left (if set) alongside a centered, brandable document title — both the
  // title text and the accent color are client-configurable (quote_header_title / quote_accent_color).
  let logoBottomY=y;
  if(clientRecord.quote_logo_url){
    try{
      const mime=/data:image\/(png|jpe?g|webp)/.exec(clientRecord.quote_logo_url);
      const fmt=mime?({png:'PNG',jpg:'JPEG',jpeg:'JPEG',webp:'WEBP'}[mime[1]]):'PNG';
      const maxLogoW=110,maxLogoH=50;
      let w=maxLogoW,h=maxLogoH;
      if(_quoteLogoDims&&_quoteLogoDims.w&&_quoteLogoDims.h){
        const ratio=Math.min(maxLogoW/_quoteLogoDims.w,maxLogoH/_quoteLogoDims.h);
        w=_quoteLogoDims.w*ratio; h=_quoteLogoDims.h*ratio;
      }
      doc.addImage(clientRecord.quote_logo_url,fmt,marginX,y,w,h,undefined,'FAST');
      logoBottomY=y+h;
    }catch(e){}
  }
  const headerTitle=(clientRecord.quote_header_title||clientRecord.client_name||'Quotation').trim();
  doc.setFont('times','bold');doc.setFontSize(24);doc.setTextColor(...accentInk);
  doc.text(headerTitle,pageW/2,y+22,{align:'center'});
  doc.setTextColor(0);
  y=Math.max(logoBottomY,y+30)+12;

  doc.setDrawColor(...accent);doc.setLineWidth(1.2);
  doc.line(marginX,y,pageW-marginX,y);
  y+=20;

  // Meta grid — trip basics on the left, document identity on the right
  const departure=src.type==='itinerary'?(src.rec.from_date||'—'):'—';
  const metaLeft=[['Departure:',departure],['Operator:',clientRecord.client_name||'—'],['No. of Passengers:',String(pax)]];
  const metaRight=[['Quote No.:',quoteNumber||'—'],['Quote Date:',new Date().toLocaleDateString()],['Valid Until:',new Date(Date.now()+validity*86400000).toLocaleDateString()]];
  doc.setFontSize(9);
  let my=y;
  metaLeft.forEach(([lab,val])=>{
    doc.setFont('helvetica','bold');doc.setTextColor(60);doc.text(lab,marginX,my);
    doc.setFont('helvetica','normal');doc.setTextColor(20);doc.text(String(val),marginX+120,my);
    my+=15;
  });
  let my2=y;
  metaRight.forEach(([lab,val])=>{
    doc.setFont('helvetica','bold');doc.setTextColor(60);doc.text(lab,marginX+contentW/2,my2);
    doc.setFont('helvetica','normal');doc.setTextColor(20);doc.text(String(val),marginX+contentW/2+80,my2);
    my2+=15;
  });
  doc.setTextColor(0);
  y=Math.max(my,my2)+8;

  doc.setDrawColor(220);doc.setLineWidth(0.6);
  doc.line(marginX,y,pageW-marginX,y);
  y+=20;

  // From (this business) / To (the lead) block
  const fromAddr=(clientRecord.quote_footer_address||'').trim();
  const fromLines=fromAddr?doc.splitTextToSize(fromAddr,contentW/2-30):[];
  const toLines=[];
  if(lead.Phone) toLines.push(String(lead.Phone));
  if(lead.Email) toLines.push(String(lead.Email));

  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(20);
  doc.text(clientRecord.client_name||'—',marginX,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(80);
  let fy=y+13;
  fromLines.forEach(line=>{doc.text(line,marginX,fy);fy+=12;});

  const toX=marginX+contentW/2+10;
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...accentInk);
  doc.text('TO',toX,y-11);
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(20);
  doc.text(lead.Name||lead.Phone||'Customer',toX,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(80);
  let ty=y+13;
  toLines.forEach(line=>{doc.text(line,toX,ty);ty+=12;});

  doc.setTextColor(0);
  y=Math.max(fy,ty)+18;

  // Line-items table (Description / No. of Persons / Price / Total)
  const {rows,subtotal}=sqBuildLineItems(src,format,price,currency,pax);
  const taxPct=parseFloat(clientRecord.quote_tax_percent)||0;
  const tax=subtotal*taxPct/100;
  const grandTotal=subtotal+tax;
  const colPersons=marginX+contentW-175, colPrice=marginX+contentW-105, colTotal=marginX+contentW-12;

  const drawTableHeader=()=>{
    doc.setFillColor(...accent);
    doc.rect(marginX,y,contentW,22,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(255,255,255);
    doc.text('DESCRIPTION',marginX+12,y+14);
    doc.text('NO. OF PERSONS',colPersons,y+14,{align:'right'});
    doc.text('PRICE',colPrice,y+14,{align:'right'});
    doc.text('TOTAL',colTotal,y+14,{align:'right'});
    doc.setTextColor(0);
    y+=22;
  };
  drawTableHeader();
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  rows.forEach((r,i)=>{
    if(y>pageH-170){doc.addPage();y=50;drawTableHeader();doc.setFont('helvetica','normal');doc.setFontSize(9);}
    if(i%2===1){doc.setFillColor(...accentSoft);doc.rect(marginX,y,contentW,18,'F');}
    const descLines=doc.splitTextToSize(r.desc,colPersons-marginX-24);
    doc.text(descLines[0]||'',marginX+12,y+13);
    doc.text(r.persons===''?'—':String(r.persons),colPersons,y+13,{align:'right'});
    doc.text(r.price?`${currency} ${r.price.toLocaleString()}`:'—',colPrice,y+13,{align:'right'});
    doc.text(r.total?`${currency} ${r.total.toLocaleString()}`:'—',colTotal,y+13,{align:'right'});
    y+=18;
  });
  doc.setDrawColor(...accent);doc.setLineWidth(1);
  doc.line(marginX,y,pageW-marginX,y);
  y+=16;

  // Terms & Payment Method (left) alongside Subtotal/Tax/Grand Total (right)
  if(y>pageH-160){doc.addPage();y=50;}
  const leftColW=contentW*0.55,rightColX=marginX+leftColW+18,rightColW=contentW-leftColW-18;
  let leftY=y;

  const terms=clientRecord.quote_terms||QUOTE_DEFAULT_TERMS;
  const termsLines=doc.splitTextToSize(terms,leftColW-20);
  const termsBoxH=24+termsLines.length*10.5;
  doc.setFillColor(...accentSoft);
  doc.roundedRect(marginX,leftY,leftColW,termsBoxH,4,4,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...accentInk);
  doc.text('Terms & Conditions',marginX+10,leftY+15);
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(70);
  doc.text(termsLines,marginX+10,leftY+28);
  doc.setTextColor(0);
  leftY+=termsBoxH+10;

  const paymentMethods=(clientRecord.quote_payment_methods||'').trim();
  if(paymentMethods){
    const pmLines=doc.splitTextToSize(paymentMethods,leftColW-20);
    const pmBoxH=24+pmLines.length*10.5;
    doc.setFillColor(...accentSoft);
    doc.roundedRect(marginX,leftY,leftColW,pmBoxH,4,4,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...accentInk);
    doc.text('Payment Method',marginX+10,leftY+15);
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(70);
    doc.text(pmLines,marginX+10,leftY+28);
    doc.setTextColor(0);
    leftY+=pmBoxH+10;
  }

  let rightY=y+12;
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(60);
  doc.text('Subtotal',rightColX,rightY);
  doc.text(`${currency} ${subtotal.toLocaleString()}`,rightColX+rightColW,rightY,{align:'right'});
  rightY+=15;
  if(taxPct){
    doc.text(`Tax @ ${taxPct}%`,rightColX,rightY);
    doc.text(`${currency} ${tax.toLocaleString()}`,rightColX+rightColW,rightY,{align:'right'});
    rightY+=15;
  }
  doc.setTextColor(0);
  rightY+=6;
  doc.setFillColor(...accentInk);
  doc.roundedRect(rightColX-8,rightY-14,rightColW+8,28,3,3,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(255,255,255);
  doc.text('Grand Total',rightColX,rightY+3);
  doc.text(`${currency} ${grandTotal.toLocaleString()}`,rightColX+rightColW,rightY+3,{align:'right'});
  doc.setTextColor(0);
  rightY+=28;

  y=Math.max(leftY,rightY)+22;

  // Signature line + thank-you close
  if(y>pageH-90){doc.addPage();y=50;}
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(60);
  doc.text('To accept this Quote please sign and return here:',marginX,y);
  doc.setDrawColor(150);doc.setLineWidth(0.7);
  doc.line(marginX+235,y-3,pageW-marginX,y-3);
  doc.setTextColor(0);
  y+=36;

  doc.setFont('times','bold');doc.setFontSize(15);doc.setTextColor(...accentInk);
  doc.text('Thank You for Your Business!',pageW/2,y,{align:'center'});
  doc.setTextColor(0);

  stampQuoteFooter(doc,marginX);
  return doc;
}

function sqBuildCaption(lead,format,total,currency,validity,extra){
  const tpl=SQ_CAPTION_TEMPLATES[format]||SQ_CAPTION_TEMPLATES.package;
  let out=tpl
    .replace(/\{\{lead_name\}\}/g,lead.Name||lead.Phone||'there')
    .replace(/\{\{business_name\}\}/g,clientRecord.client_name||'us')
    .replace(/\{\{total\}\}/g,`${currency} ${(parseFloat(total)||0).toLocaleString()}`)
    .replace(/\{\{validity_days\}\}/g,String(validity));
  if(extra) Object.entries(extra).forEach(([k,v])=>{ out=out.replace(new RegExp(`\\{\\{${k}\\}\\}`,'g'),v||''); });
  return out;
}

// Opens the exact PDF a real send would produce, without touching quote_number_seq/
// itin_number_seq (those only advance on a real send) or requiring a lead's WhatsApp conversation
// to be linked — the single-lead Quotation page already has this via quotePreviewPdf(), this is
// the same idea for the bulk source-based flow (Package/Group Fare/Special Fare/Full Itinerary).
async function sqPreviewPdf(){
  const msg=$id('sqSendMsg');
  const src=sqResolveSource(_sqSourceKey);
  if(!src){msg.textContent='Pick a package or itinerary first.';msg.className='save-msg err';return;}
  const format=_sqFormat;
  const isItinFull=format==='itinerary_full';
  if(isItinFull&&src.type!=='itinerary'){msg.textContent='Full Itinerary needs an itinerary source.';msg.className='save-msg err';return;}
  const price=isItinFull?0:(parseFloat($id('sqPrice').value)||0);
  if(!isItinFull&&!price){msg.textContent='Enter a price first.';msg.className='save-msg err';return;}
  const currency=$id('sqCurrency').value||'AED';
  const pax=parseInt($id('sqPax').value)||1;
  const validity=parseInt($id('sqValidity').value)||7;

  // Same batch-wide logo dims measurement sqSend does before its loop — a preview is just a
  // one-off "batch" of one.
  _itinSendLogoDims=isItinFull&&src.rec.logo_url
    ? await new Promise(resolve=>{ const img=new Image(); img.onload=()=>resolve({w:img.naturalWidth,h:img.naturalHeight}); img.onerror=()=>resolve(null); img.src=src.rec.logo_url; })
    : null;

  // Prefers the first selected lead so the preview shows real customer details; falls back to a
  // placeholder when none are picked yet, since previewing shouldn't require selecting leads first.
  const leads=allLeads.filter(l=>_sqSelectedIds.has(String(l.Id)));
  const lead=leads[0]||{Name:'Sample Customer',Phone:'971500000000'};
  const previewNum=(isItinFull?'ITN-':'QUO-')+'0000 (preview)';
  msg.textContent='';msg.className='save-msg';
  const doc=sqBuildPdfDoc(lead,src,format,price,currency,pax,validity,previewNum);
  window.open(doc.output('bloburl'),'_blank');
}

async function sqSend(){
  const btn=$id('sqSendBtn'),msg=$id('sqSendMsg');
  if(!_sqSelectedIds.size){msg.textContent='Select at least one lead.';msg.className='save-msg err';return;}
  const src=sqResolveSource(_sqSourceKey);
  if(!src){msg.textContent='Pick a package or itinerary first.';msg.className='save-msg err';return;}
  const format=_sqFormat;
  // Full-itinerary sends have no pricing table, so the price field isn't required for them.
  const isItinFull=format==='itinerary_full';
  if(isItinFull&&src.type!=='itinerary'){msg.textContent='Full Itinerary needs an itinerary source.';msg.className='save-msg err';return;}
  const price=isItinFull?0:(parseFloat($id('sqPrice').value)||0);
  if(!isItinFull&&!price){msg.textContent='Enter a price first.';msg.className='save-msg err';return;}
  const currency=$id('sqCurrency').value||'AED';
  const pax=parseInt($id('sqPax').value)||1;
  const validity=parseInt($id('sqValidity').value)||7;

  // Measured once for the whole batch (not per lead) — itinBuildFullPdfDoc reads this instead of
  // _itinLogoDims, since the itinerary modal that measured the latter usually isn't open anymore
  // by the time a bulk send runs.
  _itinSendLogoDims=isItinFull&&src.rec.logo_url
    ? await new Promise(resolve=>{ const img=new Image(); img.onload=()=>resolve({w:img.naturalWidth,h:img.naturalHeight}); img.onerror=()=>resolve(null); img.src=src.rec.logo_url; })
    : null;

  const leads=allLeads.filter(l=>_sqSelectedIds.has(String(l.Id)));
  btn.disabled=true;msg.textContent='';msg.className='save-msg';
  $id('sqProgressWrap').style.display='block';
  $id('sqLogBox').innerHTML='';
  const bar=$id('sqProgressBar'),label=$id('sqProgLabel');
  bar.style.width='0%'; label.textContent=`0 / ${leads.length}`;

  const logRow=(text,color)=>{ $id('sqLogBox').insertAdjacentHTML('beforeend',`<div style="padding:4px 0;${color?'color:'+color:''}">${esc(text)}</div>`); };

  // Each PDF gets its own sequential number (QUO-0001.. for quotes, ITN-0001.. for full
  // itineraries — kept separate so one doesn't eat into the other's sequence), mirroring how the
  // single-lead flow numbers invoices — advanced locally as we go and persisted once at the end
  // (best-effort) so a batch of N leads doesn't need N separate writes to the client record.
  let quoteSeq=parseInt(clientRecord.quote_number_seq)||0;
  let itinSeq=parseInt(clientRecord.itin_number_seq)||0;

  let sent=0,failed=0,skipped=0;
  for(let i=0;i<leads.length;i++){
    const lead=leads[i];
    const convId=leadConvId(lead);
    if(!convId){
      skipped++;
      logRow(`⚠️ ${lead.Name||lead.Phone||'Lead'} — skipped, no WhatsApp conversation linked`,'var(--muted)');
      bar.style.width=Math.round(((i+1)/leads.length)*100)+'%'; label.textContent=`${i+1} / ${leads.length}`;
      continue;
    }
    try{
      let quoteNumber;
      if(isItinFull){ itinSeq++; quoteNumber='ITN-'+String(itinSeq).padStart(4,'0'); }
      else { quoteSeq++; quoteNumber='QUO-'+String(quoteSeq).padStart(4,'0'); }
      const doc=sqBuildPdfDoc(lead,src,format,price,currency,pax,validity,quoteNumber);
      const pdfBlob=doc.output('blob');
      const caption=sqBuildCaption(lead,format,price,currency,validity,isItinFull?{trip_title:src.rec.title||'your trip'}:null);
      const fd=new FormData();
      fd.append('conv_id',convId);
      fd.append('caption',caption);
      fd.append('file',pdfBlob,`${isItinFull?'Itinerary':'Quotation'}-${(lead.Name||lead.Phone||'lead').replace(/[^a-z0-9]+/gi,'-')}.pdf`);
      const r=await fetch(`${CONFIG.WORKER_BASE}/quote/send`,{method:'POST',headers:ncAuthHeaders(),body:fd});
      const data=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(data.error||'HTTP '+r.status);

      const tagName=isItinFull?'Itinerary Sent':'Quotation Sent';
      const tags=parseTags(lead.Tags);
      if(!tags.includes(tagName)) tags.push(tagName);
      lead.Tags=tags.join(',');
      const sentAt=new Date().toISOString();
      const totalLabel=isItinFull?'':`${currency} ${price.toLocaleString()}`;
      try{
        const hist=await freshConvHistory(lead);
        hist.push({role:'assistant',content:caption+(isItinFull?`\n[Itinerary PDF — ${src.rec.title||'Itinerary'}]`:`\n[Quotation PDF — ${SQ_FORMAT_TITLES[format]}, ${totalLabel}]`),ts:sentAt});
        const patchBody={Id:lead.Id,ConvHistory:JSON.stringify(hist),Tags:tags.join(',')};
        if(!isItinFull){ patchBody.QuoteSentAt=sentAt; patchBody.QuoteSentTotal=totalLabel; }
        await ncPatch(`${CONFIG.NOCODB_BASE}/api/v2/tables/${CONFIG.LEADS_TABLE_ID}/records`,patchBody);
        lead.ConvHistory=JSON.stringify(hist);
        if(!isItinFull){ lead.QuoteSentAt=sentAt; lead.QuoteSentTotal=totalLabel; }
      }catch(e){}
      sent++;
      logRow(`✅ ${lead.Name||lead.Phone||'Lead'} — sent`,'#166534');
    }catch(e){
      failed++;
      logRow(`❌ ${lead.Name||lead.Phone||'Lead'} — ${e.message}`,'#991B1B');
    }
    bar.style.width=Math.round(((i+1)/leads.length)*100)+'%'; label.textContent=`${i+1} / ${leads.length}`;
    await new Promise(res=>setTimeout(res,600));
  }

  const clientPatch={};
  if(quoteSeq!==(parseInt(clientRecord.quote_number_seq)||0)) clientPatch.quote_number_seq=quoteSeq;
  if(itinSeq!==(parseInt(clientRecord.itin_number_seq)||0)) clientPatch.itin_number_seq=itinSeq;
  if(Object.keys(clientPatch).length){
    try{ await patchClient(clientPatch); Object.assign(clientRecord,clientPatch); }catch(e){}
  }

  label.textContent=`Done — ${sent} sent, ${failed} failed, ${skipped} skipped (no chat linked)`;
  msg.textContent=`${sent} sent · ${failed} failed · ${skipped} skipped`;
  btn.disabled=false;
  _sqSelectedIds.clear();
  sqFilterLeads();
}

function renderCarCalendar(){
  const yr=_carCalYear,mo=_carCalMonth;
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const monthName=new Date(yr,mo,1).toLocaleString('en',{month:'long',year:'numeric'});
  setTimeout(()=>{const lbl=$id('carCalLabel');if(lbl)lbl.textContent=monthName;renderCarCalGrid();},0);
  return '';
}

function renderCarCalGrid(){
  const wrap=$id('carCalWrap');if(!wrap)return;
  const yr=_carCalYear,mo=_carCalMonth;
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const todayStr=TODAY;
  const pad=n=>String(n).padStart(2,'0');
  const days=Array.from({length:daysInMonth},(_,i)=>`${yr}-${pad(mo+1)}-${pad(i+1)}`);

  // Header row
  let html=`<div style="display:grid;grid-template-columns:140px repeat(${daysInMonth},minmax(26px,1fr));gap:2px;min-width:${140+daysInMonth*28}px">`;
  html+=`<div style="font-size:10px;font-weight:700;color:var(--muted);padding:4px 6px">Car</div>`;
  days.forEach(d=>{
    const dn=parseInt(d.slice(8));
    const isToday=d===todayStr;
    html+=`<div style="text-align:center;font-size:9px;font-weight:${isToday?'700':'400'};color:${isToday?'var(--accent-ink)':'var(--muted)'}; padding:2px 0">${dn}</div>`;
  });

  if(!_taCars.length){html+=`<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--muted);font-size:12px">No cars</div>`;}

  _taCars.forEach(car=>{
    // Get bookings for this car in this month
    const carBks=_taCarBookings.filter(b=>b.car_id===String(car.Id)&&b.status!=='cancelled');
    html+=`<div style="font-size:11px;font-weight:600;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(car.name)}">${carIcon(car.category)} ${esc(car.name)}</div>`;
    days.forEach(d=>{
      const bk=carBks.find(b=>b.pickup_date<=d&&b.dropoff_date>=d);
      const isToday=d===todayStr;
      if(bk){
        const isStart=bk.pickup_date===d,isEnd=bk.dropoff_date===d;
        html+=`<div class="cal-cell cal-booked${isToday?' cal-today':''}" style="border-radius:${isStart?'6px 0 0 6px':isEnd?'0 6px 6px 0':'0'}" title="${esc(bk.customer_name||'')} (${esc(bk.pickup_date)}→${esc(bk.dropoff_date)})">${isStart?'▶':isEnd?'◀':''}</div>`;
      } else {
        html+=`<div class="cal-cell${isToday?' cal-today':''}" style="background:var(--bg)"></div>`;
      }
    });
  });
  html+='</div>';
  wrap.innerHTML=html;
}

function shiftCarCal(dir){
  _carCalMonth+=dir;
  if(_carCalMonth>11){_carCalMonth=0;_carCalYear++;}
  if(_carCalMonth<0){_carCalMonth=11;_carCalYear--;}
  const yr=_carCalYear,mo=_carCalMonth;
  const lbl=$id('carCalLabel');
  if(lbl)lbl.textContent=new Date(yr,mo,1).toLocaleString('en',{month:'long',year:'numeric'});
  renderCarCalGrid();
}

  const sel=$id('carBkCarId');if(!sel)return;

  calcCarBkTotal();
}

function calcCarBkTotal(){
  const pickup=$id('carBkPickup').value,dropoff=$id('carBkDropoff').value;
  const rate=parseFloat($id('carBkRate').value)||0;
  if(pickup&&dropoff&&dropoff>pickup){
    const days=Math.ceil((new Date(dropoff)-new Date(pickup))/(1000*60*60*24));
    $id('carBkDays').value=days;
    $id('carBkTotal').value=(days*rate).toFixed(2);
  } else {$id('carBkDays').value='';$id('carBkTotal').value='';}
}

function renderTaFinance(){
  const allTxns=[
    ..._taBookings.filter(b=>b.status!=='cancelled').map(b=>({date:b.created_at,desc:`Booking: ${b.client_name} – ${b.package_name||'Custom'}`,amount:parseFloat(b.sell_price)||0,cost:parseFloat(b.cost_price)||0,type:'booking'})),
    ..._taCases.filter(c=>c.fee>0).map(c=>({date:c.created_at,desc:`${cap(c.type||'case')}: ${c.client_name}`,amount:parseFloat(c.fee)||0,cost:0,type:'case'})),
  ].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const totalRev=allTxns.reduce((s,t)=>s+t.amount,0);
  const totalCost=allTxns.reduce((s,t)=>s+t.cost,0);
  const totalMargin=totalRev-totalCost;
  const marginPct=totalRev?Math.round(totalMargin/totalRev*100):0;
  const byType={};
  allTxns.forEach(t=>{byType[t.type]=(byType[t.type]||0)+t.amount;});
  const pendingPay=_taBookings.filter(b=>b.status!=='cancelled'&&b.status!=='completed'&&parseFloat(b.sell_price)>parseFloat(b.deposit||0));
  return `
  <div style="font-family:var(--disp);font-size:16px;font-weight:700;margin-bottom:14px">💰 Finance</div>

    <div class="stat accent"><div class="stat-lbl">Total Revenue</div><div class="stat-val">${(totalRev/1000).toFixed(1)}k</div><div class="stat-sub">bookings + cases</div></div>
    <div class="stat"><div class="stat-lbl">Total Cost</div><div class="stat-val">${(totalCost/1000).toFixed(1)}k</div><div class="stat-sub">cost of services</div></div>
    <div class="stat"><div class="stat-lbl">Gross Margin</div><div class="stat-val">${(totalMargin/1000).toFixed(1)}k</div><div class="stat-sub">${marginPct}% margin</div></div>
    <div class="stat"><div class="stat-lbl">Transactions</div><div class="stat-val">${allTxns.length}</div><div class="stat-sub">total records</div></div>
  </div>
  <div style="display:grid;gap:14px;grid-template-columns:1fr 1fr">
    <div class="ta-card">
      <div class="ta-card-title">📊 Revenue by Category</div>
      ${Object.entries(byType).map(([t,v])=>`
        <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px">
          <span style="min-width:100px">${caseIcon(t)} ${cap(t)}</span>
          <div style="flex:1;height:6px;background:var(--bg);border-radius:4px;overflow:hidden"><div style="height:100%;background:var(--accent);border-radius:4px;width:${totalRev?Math.round((v/totalRev)*100):0}%"></div></div>
          <span style="font-family:var(--mono);font-size:12px;font-weight:700;min-width:60px;text-align:right">${v.toLocaleString()}</span>
        </div>`).join('')||'<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">No data yet</div>'}
    </div>
    <div class="ta-card">
      <div class="ta-card-title">💳 Pending Payments</div>
      ${pendingPay.slice(0,6).map(b=>{
        const bal=(parseFloat(b.sell_price)||0)-(parseFloat(b.deposit)||0);
        return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px">
          <div style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.client_name||'—')}</div>

      }).join('')||'<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">All clear</div>'}

  </div>

              <td style="font-family:var(--mono);color:var(--muted)">${t.cost?t.cost.toLocaleString():'—'}</td>
              <td style="font-family:var(--mono);font-weight:700;color:${(t.amount-t.cost)>=0?'#166534':'#991B1B'}">${(t.amount-t.cost).toLocaleString()}</td>
            </tr>`).join('')}
          ${!allTxns.length?'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px">No transactions</td></tr>':''}
        </tbody>
      </table>
    </div>
  </div>`;
}

function printItinerary(id){
  const it=_taItineraries.find(x=>String(x.Id)===String(id));
  if(!it)return;
  const days=it.days||[];
  const w=window.open('','_blank');
  if(!w)return;
  let body=`<h1>${esc(it.title||'Itinerary')}</h1><p>${esc(it.destination||'')} &middot; ${days.length} days</p>`;
  days.forEach(d=>{
    body+=`<h2>Day ${d.day_no}: ${esc(d.title||'')}</h2><ul>`;
    (d.items||[]).forEach(i=>{body+=`<li>${esc(i.description||'')}</li>`;});
    body+='</ul>';
  });
  if(it.notes)body+=`<p><em>${esc(it.notes)}</em></p>`;
  w.document.write(`<!DOCTYPE html><html><head><title>${esc(it.title||'Itinerary')}</title><style>body{font-family:sans-serif;max-width:700px;margin:40px auto;color:#111}h1{font-size:22px}h2{font-size:16px;margin-top:20px;color:#0D9C93}ul{margin:8px 0 0 18px}li{margin-bottom:4px}</style></head><body>${body}</body></html>`);
  w.document.close();
  w.print();
}

async function sendItinViaWa(id){
  const it=_taItineraries.find(x=>String(x.Id)===String(id));
  if(!it)return;
  const phone=prompt('Send to phone (with country code, e.g. 971501234567):');
  if(!phone)return;
  const days=it.days||[];
  let body=`*${it.title}*\n${it.destination||''} · ${days.length} days\n\n`;
  days.forEach(d=>{
    body+=`*Day ${d.day_no}: ${d.title||''}*\n`;
    (d.items||[]).forEach(i=>{body+=`• ${i.description||''}\n`;});
    body+='\n';
  });
  if(it.notes)body+=`_${it.notes}_`;
  try{
    const resp=await fetch(`${CONFIG.WORKER_BASE}/wa/send`,{
      method:'POST',
      headers:ncAuthHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({phone:phone.replace(/[^0-9]/g,''),text:body})
    });
    const respData=await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(respData.error||'HTTP '+resp.status);
    alert('✓ Itinerary sent via WhatsApp');
  }catch(e){alert('Error: '+e.message);}
}

  const heroStats=`
    <div class="travel-stat"><div class="travel-stat-val">${leads.length}</div><div class="travel-stat-lbl">Inquiries</div></div>
    <div class="travel-stat"><div class="travel-stat-val">${booked.length}</div><div class="travel-stat-lbl">Booked</div></div>
    <div class="travel-stat"><div class="travel-stat-val">${upcoming.length}</div><div class="travel-stat-lbl">Upcoming</div></div>
    <div class="travel-stat"><div class="travel-stat-val">${totalPax||'—'}</div><div class="travel-stat-lbl">Total Pax</div></div>`;

  // Trip types
  const types={FIT:0,Group:0,Honeymoon:0,Corporate:0,Family:0,Adventure:0,Other:0};
  leads.forEach(l=>{const t=l.TripType||'Other';types[t]=(types[t]||0)+1;});
  const typeIcons={FIT:'🧍',Group:'👥',Honeymoon:'💑',Corporate:'💼',Family:'👨‍👩‍👧',Adventure:'🏔️',Other:'✈️'};
  const tripTypesHtml=Object.entries(types).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`
    <div class="tt-pill">
      <div class="tt-pill-icon">${typeIcons[t]||'✈️'}</div>
      <div class="tt-pill-body"><div class="tt-pill-label">${t}</div><div class="tt-pill-val">${n}</div></div>
    </div>`).join('')||'<div style="color:var(--muted);font-size:13px">No trip type data. Add TripType field to leads.</div>';

  // Upcoming trip inquiries (next 90 days) — from the lead pipeline, distinct from the TA
  // module's own "Upcoming Departures" card above (which tracks confirmed ta_bookings rows).
  const dep90=leads.filter(l=>{
    const raw=l.TravelDates||l.BookingTime||'';
    if(!raw)return false;
    const d=new Date(raw.split('→')[0].trim()||raw);
    return d>now&&d<new Date(now.getTime()+90*86400000);
  }).sort((a,b)=>{
    const da=new Date((a.TravelDates||a.BookingTime||'').split('→')[0].trim());
    const db=new Date((b.TravelDates||b.BookingTime||'').split('→')[0].trim());
    return da-db;
  });
  const upcomingCount=dep90.length?dep90.length+' in next 90 days':'';
  const upcomingHtml=dep90.slice(0,8).map(l=>{
    const raw=(l.TravelDates||l.BookingTime||'').split('→')[0].trim();
    const d=new Date(raw);
    const day=d.getDate();
    const mon=d.toLocaleDateString('en-GB',{month:'short'});
    return`<div class="trip-card" onclick="openLeadInParent(${l.Id})">
      <div class="trip-date-box"><div class="trip-date-day">${day}</div><div class="trip-date-mon">${mon}</div></div>
      <div class="trip-info">
        <div class="trip-name">${esc(l.Name||'—')}</div>
        <div class="trip-meta">${esc(l.Destination||'Destination TBD')} · ${esc(l.PaxCount||'?')} pax · ${esc(l.Owner||'Unassigned')}</div>
      </div>
      ${l.TripType?`<div class="trip-type-badge">${esc(l.TripType)}</div>`:''}
    </div>`;
  }).join('')||'<div style="color:var(--muted);font-size:13px">No upcoming departures in next 90 days</div>';

  // Top destinations
  const destCount={};
  leads.forEach(l=>{if(l.Destination){const d=(l.Destination||'').trim();if(d)destCount[d]=(destCount[d]||0)+1;}});
  const dests=Object.entries(destCount).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxD=dests[0]?.[1]||1;
  const destHtml=dests.length?dests.map(([d,n])=>`
    <div class="dest-row">
      <div class="dest-name">${esc(d)}</div>
      <div class="dest-bar-bg"><div class="dest-bar-fill" style="width:${Math.round(n/maxD*100)}%"></div></div>
      <div class="dest-count">${n}</div>
    </div>`).join('')
    :'<div style="color:var(--muted);font-size:13px">No destination data. Add Destination field to leads.</div>';

  // Hot inquiries
  const hotLeads=leads.filter(l=>!TERMINAL.has(l.Stage)&&(l.Score==='Hot'||l.HotMoment==='Yes')).slice(0,10);
  const hotHtml=hotLeads.length?hotLeads.map(l=>`
    <div class="predict-row" style="cursor:pointer" onclick="openLeadInParent(${l.Id})">
      <div style="font-size:16px">🔥</div>
      <div class="predict-name">
        <b>${esc(l.Name||'—')}</b>
        <div style="font-size:11px;color:var(--muted)">${esc(l.Destination||'No destination')} · ${esc(l.TripType||'?')} · ${esc(l.Stage||'new')}</div>
      </div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted)">${fmtDateShort(l.LastMsgAt||l.Date)}</div>
    </div>`).join('')
    :'<div style="color:var(--muted);font-size:13px">No hot inquiries right now 🎉</div>';

  return `
  <div class="travel-hero" style="margin-bottom:14px">
    <div class="travel-hero-title">✈️ Travel Pipeline (from Leads)</div>
    <div class="travel-hero-sub">${leads.length} inquiries · ${booked.length} confirmed bookings</div>
    <div class="travel-stat-row" style="margin-top:14px;margin-bottom:0">${heroStats}</div>
  </div>
  <div class="ta-card">
    <div class="ta-card-title">🧳 Trip Types</div>
    <div class="trip-types">${tripTypesHtml}</div>
  </div>
  <div style="display:grid;gap:14px;grid-template-columns:1fr 1fr">
    <div class="ta-card">
      <div class="ta-card-title">📅 Upcoming Trip Inquiries <span style="margin-left:auto;font-size:11px;color:var(--muted);font-weight:400">${upcomingCount}</span></div>
      ${upcomingHtml}
    </div>
    <div class="ta-card">
      <div class="ta-card-title">🌍 Top Destinations</div>
      ${destHtml}
    </div>
  </div>
  <div class="ta-card">
    <div class="ta-card-title">🔥 Hot Inquiries <span style="font-size:11px;color:var(--muted);font-weight:400;margin-left:auto">Needs follow-up</span></div>
    ${hotHtml}
  </div>`;
}
/* ── Shared helpers duplicated from dashboard.html (also used there for non-Travel-Agency
   features, so they stay defined in both places rather than being a single-owner move) ── */
const TODAY = new Date().toISOString().slice(0,10);
const TERMINAL = new Set(['consultation_booked','human_handover','visit_booked','appt_booked']);
function fmtDateShort(d){if(!d)return'—';try{return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}catch{return String(d).slice(0,10);}}
const LEAD_CATEGORIES = ['Ticket','Package','Hotel','Other Services'];
function serviceCategoryIcon(cat){
  return {Ticket:'✈️',Package:'📦',Hotel:'🏨','Other Services':'🧳'}[cat]||'🗂️';
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function maskPhone(p){if(!p)return'—';const s=String(p);return s.length<=4?s:s.slice(0,2)+'***'+s.slice(-2);}
function parseTags(t){if(!t)return[];return String(t).split(',').map(s=>s.trim()).filter(Boolean);}
function leadConvId(lead){return lead&&(lead.ConversationID||lead.conv_id||lead.ConversationId||lead.chatwoot_conv_id||'');}
function parseCSVLine(line){
  const out=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(c===','&&!inQ){out.push(cur.trim());cur='';}
    else cur+=c;
  }
  out.push(cur.trim());
  return out;
}
function taSaveLocal(key,val){try{const k='lv_ta_'+clientId;const c=JSON.parse(localStorage.getItem(k)||'{}');c[key]=val;localStorage.setItem(k,JSON.stringify(c));}catch(e){}}
async function freshConvHistory(lead){
  try{
    const fresh=await ncGet(`${CONFIG.NOCODB_BASE}/api/v2/tables/${CONFIG.LEADS_TABLE_ID}/records/${lead.Id}?fields=ConvHistory`);
    return JSON.parse(fresh?.ConvHistory||'[]');
  }catch(e){
    try{return JSON.parse(lead.ConvHistory||'[]');}catch(e2){return [];}
  }
}
async function ncPost(url,body){
  const r=await fetch(url,{method:'POST',headers:ncAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
async function ncDelete(url,body){
  const r=await fetch(url,{method:'DELETE',headers:ncAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json().catch(()=>({}));
}
const QUOTE_DEFAULT_TERMS=`• This quotation is valid for the period stated above; prices may change after it expires.
• All prices are exclusive of taxes unless stated otherwise.
• Payment terms and delivery/service timelines will be confirmed upon order confirmation.
• This document does not constitute a binding contract until formally accepted by both parties.`;

/* openModal/closeModal/closeAllModals + the #overlay element (see body) — duplicated from
   dashboard.html because every TA modal (below) uses that bottom-sheet .modal/#overlay
   mechanism verbatim, not real-estate.html's simpler .modal-overlay pattern. */
function openModal(id){
  $id('overlay').classList.add('show');
  $id(id).classList.add('open');
}
function closeModal(id){
  $id(id).classList.remove('open');
  const anyOpen=[...document.querySelectorAll('.modal.open')].length;
  if(!anyOpen)$id('overlay').classList.remove('show');
}
function closeAllModals(){
  document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'));
  $id('overlay').classList.remove('show');
}
init();
</script>
