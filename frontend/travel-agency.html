<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leadvyne · Travel Agency</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0369A1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#F0F9FF;--card:#FFFFFF;--ink:#0B2540;--muted:#5B7C93;
  --accent:#0369A1;--accent-ink:#075985;--accent-soft:#E0F2FE;
  --line:#DBEAFE;--ls:#BAE6FD;--warn:#9A5B12;--red:#DC2626;--yellow:#F59E0B;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.10);
  --r:16px;--r-sm:10px;
  --mono:"JetBrains Mono",monospace;--disp:"Space Grotesk",sans-serif;--body:"Inter",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}

header{background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;height:56px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 1px 0 var(--line)}
.brand{font-family:var(--disp);font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.brand span{color:var(--accent)}
.chip{background:var(--accent-soft);color:var(--accent-ink);font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.hback{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-family:var(--body)}
.hback:hover{background:var(--bg)}

#tabs{background:var(--card);border-bottom:1px solid var(--line);display:flex;padding:0 20px;flex-shrink:0;overflow-x:auto}
.tab{font-family:var(--disp);font-size:13px;font-weight:600;padding:11px 14px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap}
.tab.active{color:var(--accent-ink);border-bottom-color:var(--accent)}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px;min-height:0}
.inner{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page{display:none}
.page.active{display:block}

.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:20px;box-shadow:var(--shadow)}
.card-title{font-family:var(--disp);font-size:14px;font-weight:700;color:var(--muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em}
.card-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-title-row .card-title{margin-bottom:0}
.card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--card);border-radius:var(--r-sm);border:1px solid var(--line);padding:16px 18px}
.stat-val{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--accent-ink)}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:2px}
/* .stat.accent / .stat-sub — shared/generic dashboard.html design-system rules (dashboard.html
   :301-307,887 & :306), copied here rather than moved since they're used dashboard-wide, not
   Travel-Agency-exclusive. */
.stat.accent{background:linear-gradient(135deg,var(--accent),#2DD4BF);border:none}
.stat.accent .stat-lbl{color:rgba(255,255,255,.75)}
.stat.accent .stat-val{color:#fff}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px}
.stat.accent .stat-sub{color:rgba(255,255,255,.65)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.badge.gray{background:#F1F5F9;color:#475569}
.badge.blue{background:#DBEAFE;color:#1E3A8A}
.badge.yellow{background:#FEF3C7;color:#92400E}
.badge.green{background:#D1FAE5;color:#065F46}
.badge.red{background:#FEE2E2;color:#991B1B}
.badge.purple{background:#EDE9FE;color:#5B21B6}

.search-input{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-family:var(--body);font-size:13px;color:var(--ink);background:var(--bg);width:190px}
.search-input:focus{outline:none;border-color:var(--accent);background:#fff}
.save-btn{background:linear-gradient(135deg,#0369A1,#0EA5E9);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-family:var(--disp);font-weight:600;font-size:13px;cursor:pointer;transition:opacity .15s}
.save-btn:hover{opacity:.9}
.save-btn.sec{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent)}
.save-btn.sm{padding:6px 11px;font-size:12px}
.save-btn:disabled{opacity:.5;cursor:default}
.save-msg{font-size:12px;color:var(--accent);align-self:center;margin-left:10px}
.save-msg.err{color:var(--red)}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px;color:var(--muted);line-height:1}
.icon-btn:hover{background:var(--bg)}
.icon-btn.danger:hover{background:#FEE2E2;color:#991B1B;border-color:#FCA5A5}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}

.s-lbl{font-family:var(--disp);font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.04em}
.s-input,select.s-input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-family:var(--body);font-size:14px;color:var(--ink);background:var(--bg)}
.s-input:focus{outline:none;border-color:var(--accent);background:#fff}
.s-hint{font-size:12px;color:var(--muted);margin-top:5px}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(11,37,64,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal-card{background:var(--card);border-radius:var(--r);padding:24px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row td{text-align:center;padding:30px;color:var(--muted)}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px}

/* ══════════════════════════════════════════════
   Supplemental shared classes — copied verbatim from dashboard.html (COPY only, not moved: each
   is used dashboard-wide for non-Travel-Agency features too, e.g. the Leads table/Reports pages
   and every other module's bottom-sheet modal). Needed here because every TA modal/CRUD screen
   moved from dashboard.html below still uses this modal/form/button system, not the
   .modal-overlay/.s-input one above (which real-estate.html's own skeleton uses but nothing
   moved from the TA module does).
   ══════════════════════════════════════════════ */
.leads-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.leads-tbl{width:100%;border-collapse:collapse;font-size:13px}
.leads-tbl th{background:var(--bg);padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid var(--line);white-space:nowrap}
.leads-tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.leads-tbl tr:hover td{background:var(--accent-soft);cursor:pointer}

.btn{padding:10px 18px;border:none;border-radius:var(--r-sm);font-family:var(--disp);font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#2DD4BF);color:#fff}
.btn-primary:hover{background:linear-gradient(135deg,var(--accent-ink),var(--accent))}
.btn-secondary{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.btn-secondary:hover{border-color:var(--accent)}
.btn-sm{padding:7px 13px;font-size:12px}
.btn-ghost{background:none;border:1.5px solid var(--line);color:var(--muted);padding:7px 11px;border-radius:var(--r-sm);font-size:12px;cursor:pointer;font-family:var(--disp);font-weight:600}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* Bottom-sheet modal system (dashboard.html "MODALS" block) */
#overlay{position:fixed;inset:0;background:rgba(11,37,64,.55);z-index:100;display:none}
#overlay.show{display:block}
.modal{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:24px 24px 0 0;z-index:101;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);max-height:92vh;display:flex;flex-direction:column}
@media(min-width:768px){.modal{top:50%;left:50%;right:auto;bottom:auto;width:540px;border-radius:var(--r);transform:translate(-50%,-42%);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;max-height:85vh}}
.modal.open{transform:translateY(0)}
@media(min-width:768px){.modal.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
.modal-hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-drag{width:40px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 14px;display:block}
@media(min-width:768px){.modal-drag{display:none}}
.modal-title{font-family:var(--disp);font-size:16px;font-weight:700;flex:1}
.modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 22px;flex:1}
.modal-footer,.modal-ft{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;flex-shrink:0}

.form-group{margin-bottom:16px}
.form-label{font-size:12px;font-weight:600;display:block;margin-bottom:6px;color:var(--muted);letter-spacing:.02em}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--ls);border-radius:var(--r-sm);font-size:14px;background:var(--bg);color:var(--ink);font-family:var(--body);transition:border-color .15s}
.form-input:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px var(--accent-soft)}
select.form-input{cursor:pointer}
textarea.form-input{resize:vertical;min-height:80px;line-height:1.6}

.sec-hd{font-family:var(--disp);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.s-head{font-family:var(--disp);font-size:15px;font-weight:700;margin-bottom:4px}
.s-note{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.page-pad{padding:16px}

/* ══════════════════════════════════════════════
   TRAVEL AGENCY MODULE — moved verbatim from dashboard.html's "/* ── TRAVEL AGENCY MODULE ── */"
   CSS block (dashboard.html :514-521,524-548,729-790,865-866) plus predict-row/stat.accent
   already handled above. Deleted from dashboard.html except where noted (some rules are shared
   with an unrelated dashboard.html feature under the same class name and are copy-only there).
   ══════════════════════════════════════════════ */
.travel-hero{background:linear-gradient(135deg,#0369A1,#0EA5E9);border-radius:var(--r);padding:22px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
.travel-hero::after{content:'✈️';position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:52px;opacity:.12}
.travel-hero-title{font-family:var(--disp);font-size:20px;font-weight:700;margin-bottom:4px}
.travel-hero-sub{font-size:12.5px;opacity:.8}
.travel-stat-row{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);margin-bottom:14px}
.travel-stat{background:rgba(255,255,255,.18);backdrop-filter:blur(4px);border-radius:12px;padding:12px;text-align:center}
.travel-stat-val{font-size:24px;font-weight:700}
.travel-stat-lbl{font-size:10px;opacity:.75;margin-top:2px}

.dest-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.dest-row:last-child{border-bottom:none}
.dest-name{flex:0 0 120px;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dest-bar-bg{flex:1;height:8px;background:var(--bg);border-radius:6px;overflow:hidden}
.dest-bar-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.dest-count{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:20px;text-align:right}

.trip-card{background:var(--card);border-radius:var(--r-sm);padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:13px;cursor:pointer;transition:box-shadow .15s,border-color .2s;box-shadow:var(--shadow);border:1px solid var(--line)}
.trip-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.09);border-color:var(--accent)}
.trip-date-box{width:46px;height:46px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--disp)}
.trip-date-day{font-size:17px;font-weight:700;line-height:1}
.trip-date-mon{font-size:9px;font-weight:700;text-transform:uppercase}
.trip-info{flex:1;min-width:0}
.trip-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-meta{font-size:11px;color:var(--muted);margin-top:2px}
.trip-type-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.trip-types{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

.tt-pill{display:flex;align-items:center;gap:7px;background:var(--card);border-radius:var(--r-sm);padding:10px 14px;box-shadow:var(--shadow)}
.tt-pill-icon{font-size:16px}
.tt-pill-body{flex:1}
.tt-pill-label{font-size:10px;color:var(--muted);font-family:var(--disp);font-weight:700}
.tt-pill-val{font-size:18px;font-weight:700;font-family:var(--disp)}

.predict-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.predict-row:last-child{border-bottom:none}
.predict-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ta-tab{font-family:var(--disp);font-size:13px;font-weight:600;padding:13px 16px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap;flex-shrink:0}
.ta-tab.active{color:var(--accent-ink);border-bottom-color:var(--accent)}
.ta-subtab{font-family:var(--disp);font-size:12.5px;font-weight:600;padding:9px 14px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:color .15s,border-color .15s}
.ta-subtab.active{color:var(--accent-ink);border-bottom-color:var(--accent)}
.ta-card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.ta-card-title{font-family:var(--disp);font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.pkg-filter-pill{background:none;border:1.5px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-family:var(--disp);font-weight:600;transition:background .15s,border-color .15s,color .15s}
.pkg-filter-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pkg-card{background:var(--card);border-radius:var(--r);padding:20px;padding-left:22px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .15s,transform .15s;border:1px solid var(--line);position:relative;overflow:hidden}
.pkg-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--pkg-accent,var(--accent))}
.pkg-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.pkg-name{font-family:var(--disp);font-size:16px;font-weight:700;margin-bottom:5px}
.pkg-meta{font-size:12px;color:var(--muted);margin-bottom:12px}
.pkg-price{font-family:var(--disp);font-size:21px;font-weight:700;color:var(--accent-ink)}
.pkg-price-sub{font-size:10px;color:var(--muted);margin-left:4px}
.pkg-type-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--pkg-accent-soft,var(--accent-soft));color:var(--pkg-accent,var(--accent-ink));text-transform:capitalize}
.case-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.case-row:hover{background:var(--bg)}
.case-row:last-child{border-bottom:none}
.case-type-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.case-body{flex:1;min-width:0}
.case-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.stage-pill{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;font-family:var(--mono)}
.stage-pending{background:#FEF3C7;color:#92400E}
.stage-active{background:var(--accent-soft);color:var(--accent-ink)}
.stage-done{background:#DCFCE7;color:#166534}
.stage-blocked{background:#FEE2E2;color:#991B1B}
.itin-card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .15s;border:1.5px solid var(--line);margin-bottom:10px}
.itin-card:hover{box-shadow:var(--shadow-md);border-color:var(--accent)}
.itin-day{background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--accent)}
.itin-day-hd{font-family:var(--disp);font-size:12px;font-weight:700;color:var(--accent-ink);margin-bottom:6px}
.itin-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.itin-item:last-child{border-bottom:none}
.itin-item-icon{width:22px;height:22px;border-radius:6px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px}
.pilgrim-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.pilgrim-row:last-child{border-bottom:none}
.doc-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;margin:1px}
.doc-ok{background:#DCFCE7;color:#166534}
.doc-missing{background:#FEE2E2;color:#991B1B}
.booking-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.booking-row:hover{background:var(--bg)}
.booking-row:last-child{border-bottom:none}
.payment-bar-wrap{height:6px;background:var(--bg);border-radius:4px;flex:1;overflow:hidden;margin:0 8px}
.payment-bar-fill{height:100%;background:var(--accent);border-radius:4px}
.ledger-credit{color:#166534;font-family:var(--mono);font-weight:700}
.ledger-debit{color:#991B1B;font-family:var(--mono);font-weight:700}
.car-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:16px;position:relative;transition:box-shadow .15s;cursor:pointer}
.car-card:hover{box-shadow:var(--shadow-md)}
.car-status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.car-status-available{background:#DCFCE7;color:#166534}
.car-status-booked{background:#FEF3C7;color:#92400E}
.car-status-maintenance{background:#FEE2E2;color:#991B1B}
.car-status-inactive{background:var(--bg);color:var(--muted)}
/* cal-cell/cal-booked/cal-today — COPY only: dashboard.html reuses these same class names for an
   unrelated generic Tasks calendar widget (dashboard.html :577-583), so they stay defined there
   too rather than being a single-owner move. */
.cal-cell{height:28px;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:default}
.cal-booked{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.cal-today{outline:2px solid var(--accent)}
.car-bk-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.car-bk-row:hover{background:var(--bg)}
.car-bk-row:last-child{border-bottom:none}

</style>
</head>
<body>

<!-- ══════════════════════════════════════════════
     TRAVEL AGENCY MODULE (embedded in dashboard.html's Agency tab via iframe, same pattern as
     Real Estate/B2B/Accounting). Reads/writes Leads plus its own ta_* NocoDB tables through the
     bearer-token-gated /nocodb/* passthrough. dashboard.html itself keeps a lightweight read-only
     copy of the core TA data (see dashboard.html's own trimmed taLoad()) purely to feed the
     notification bell, reminders panel, and AI Deal Coach — those are core CRM chrome, not part
     of this module's UI.
     ══════════════════════════════════════════════ -->
<div id="app" style="display:none;height:100%;display:flex;flex-direction:column">
  <header>
    <span class="brand">Leadvyne<span>.</span></span>
    <span class="chip">✈️ Travel Agency</span>
    <button class="hback" onclick="window.location.href='https://app.leadvyne.com/dashboard.html?client='+clientId">← Back to CRM</button>
  </header>

  <div id="tabs">
    <button class="ta-tab active" data-ta="dashboard">📊 Dashboard</button>
    <button class="ta-tab" data-ta="packages">📦 Packages</button>
    <button class="ta-tab" data-ta="itineraries">🗺️ Itineraries</button>
    <button class="ta-tab" data-ta="services">🗂️ Services</button>
    <button class="ta-tab" data-ta="visas">🛂 Visa</button>
    <button class="ta-tab" data-ta="groupfares">👥 Group Fare</button>
    <button class="ta-tab" data-ta="specialfares">🎟️ Special Fare</button>
    <button class="ta-tab" data-ta="umrah">🕌 Umrah</button>
    <button class="ta-tab" data-ta="bookings">🎫 Bookings</button>
    <button class="ta-tab" data-ta="cars">🚗 Cars</button>
    <button class="ta-tab" data-ta="finance">💰 Finance</button>
  </div>
  <div id="taMissingTablesBanner" style="display:none"></div>

  <main>
  <div class="inner">
    <div class="page-pad" id="agencyContent" style="flex:1">
      <div style="color:var(--muted);font-size:13px;padding:40px 0;text-align:center"><span class="spinner"></span>Loading…</div>
    </div>
  </div>
  </main>
</div>

<div id="overlay" onclick="closeAllModals()"></div>

<!-- TA: PACKAGE MODAL -->
  <div class="modal" id="modalPkg" style="width:580px">
    <span class="modal-drag"></span>
    <div class="modal-hd"><div class="modal-title" id="pkgModalTitle">New Package</div><button class="icon-btn" onclick="closeModal('modalPkg')">✕</button></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Package Name *</label><input class="form-input" id="pkgName" placeholder="e.g. Dubai 5 Nights City Tour"></div>
        <div class="form-group"><label class="form-label">Type</label><select class="form-input" id="pkgType"><option value="tour">Tour</option><option value="umrah">Umrah</option><option value="hajj">Hajj</option><option value="hotel">Hotel Only</option><option value="visa">Visa Package</option><option value="custom">Custom</option></select></div>
        <div class="form-group"><label class="form-label">Destination</label><input class="form-input" id="pkgDest" placeholder="Dubai, UAE"></div>
        <div class="form-group"><label class="form-label">Nights</label><input class="form-input" type="number" id="pkgNights" placeholder="5" min="0"></div>
        <div class="form-group"><label class="form-label">Min Pax</label><input class="form-input" type="number" id="pkgPaxMin" value="1" min="1"></div>
        <div class="form-group"><label class="form-label">Max Pax</label><input class="form-input" type="number" id="pkgPaxMax" value="99"></div>
        <div class="form-group"><label class="form-label">Currency</label><select class="form-input" id="pkgCurrency"><option>AED</option><option>INR</option><option>SAR</option><option>USD</option><option>EUR</option><option>GBP</option></select></div>
        <div class="form-group"><label class="form-label">Base (Cost) Price / pax</label><input class="form-input" type="number" id="pkgBasePrice" placeholder="0"></div>
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Sell Price / pax (with margin)</label><input class="form-input" type="number" id="pkgSellPrice" placeholder="0"></div>
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Inclusions (one per line)</label><textarea class="form-input" id="pkgInclusions" rows="4" placeholder="Visa&#10;Return flights&#10;4-star hotel&#10;Airport transfers"></textarea></div>
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Exclusions (one per line)</label><textarea class="form-input" id="pkgExclusions" rows="3" placeholder="Travel insurance&#10;Personal expenses"></textarea></div>
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Notes</label><textarea class="form-input" id="pkgNotes" rows="2"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="savePkgBtn" onclick="savePkg()">Save Package</button>
      <span class="save-msg" id="savePkgMsg"></span>
      <button class="btn btn-secondary" onclick="closeModal('modalPkg')">Cancel</button>
    </div>
  </div>

  <!-- TA: ITINERARY MODAL -->
  <div class="modal" id="modalItin" style="width:640px">
    <span class="modal-drag"></span>
    <div class="modal-hd"><div class="modal-title" id="itinModalTitle">New Itinerary</div><button class="icon-btn" onclick="closeModal('modalItin')">✕</button></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Title *</label><input class="form-input" id="itinTitle" placeholder="e.g. Dubai City Tour 5D4N"></div>
        <div class="form-group"><label class="form-label">Destination</label><input class="form-input" id="itinDest" placeholder="Dubai, UAE"></div>
        <div class="form-group"><label class="form-label">From Date</label><input class="form-input" type="date" id="itinFrom"></div>
        <div class="form-group"><label class="form-label">To Date</label><input class="form-input" type="date" id="itinTo"></div>
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Notes</label><textarea class="form-input" id="itinNotes" rows="2"></textarea></div>
        <div class="form-group" style="grid-column:1/-1">
          <label class="form-label">Logo (optional — overrides your account logo on this itinerary's PDF only)</label>
          <div id="itinLogoWrap"></div>
        </div>
      </div>
      <div class="sec-hd">Day-by-Day Plan</div>
      <div id="itinDaysList"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="saveItinBtn" onclick="saveItin()">Save Itinerary</button>
      <span class="save-msg" id="saveItinMsg"></span>
      <button class="btn btn-secondary" onclick="closeModal('modalItin')">Cancel</button>
    </div>
  </div>

  <!-- TA: SERVICE CASE MODAL -->
  <div class="modal" id="modalCase" style="width:540px">
    <span class="modal-drag"></span>
    <div class="modal-hd"><div class="modal-title" id="caseModalTitle">New Service Case</div><button class="icon-btn" onclick="closeModal('modalCase')">✕</button></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group"><label class="form-label">Client Name *</label><input class="form-input" id="caseClientName" placeholder="Full name"></div>
        <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="caseClientPhone" placeholder="971501234567" type="tel"></div>
        <div class="form-group"><label class="form-label">Service Type</label><select class="form-input" id="caseType" onchange="updateCaseStages()"><option value="visa">🛂 Visa</option><option value="attestation">📜 Attestation</option><option value="ticketing">✈️ Ticketing</option><option value="insurance">🛡️ Insurance</option><option value="recruitment">👷 Recruitment</option><option value="forex">💱 Forex</option><option value="passport">📘 Passport</option><option value="emigration">🚢 Emigration</option></select></div>
        <div class="form-group"><label class="form-label">Current Stage</label><select class="form-input" id="caseStage"></select></div>
        <div class="form-group"><label class="form-label">Reference No.</label><input class="form-input" id="caseRefNo" placeholder="Passport no / PNR etc."></div>
        <div class="form-group"><label class="form-label">Due Date</label><input class="form-input" type="date" id="caseDueDate"></div>
        <div class="form-group"><label class="form-label">Fee</label><input class="form-input" type="number" id="caseFee" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Status</label><select class="form-input" id="caseStatus"><option value="open">Open</option><option value="blocked">Blocked</option><option value="closed">Closed</option></select></div>
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Notes</label><textarea class="form-input" id="caseNotes" rows="3"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="saveCaseBtn" onclick="saveCase()">Save Case</button>
      <span class="save-msg" id="saveCaseMsg"></span>
      <button class="btn btn-secondary" onclick="closeModal('modalCase')">Cancel</button>
    </div>
  </div>

  <!-- TA: VISA MODAL -->
  <div class="modal" id="modalVisa" style="width:580px">
    <span class="modal-drag"></span>
    <div class="modal-hd"><div class="modal-title" id="visaModalTitle">New Visa</div><button class="icon-btn" onclick="closeModal('modalVisa')">✕</button></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Visa Country *</label><input class="form-input" id="visaCountry" placeholder="e.g. Thailand"></div>
        <div class="form-group"><label class="form-label">Visa Type</label><select class="form-input" id="visaType"><option value="single_entry">Single Entry</option><option value="multiple_entry">Multiple Entry</option><option value="transit">Transit</option></select></div>
        <div class="form-group"><label class="form-label">Duration</label><select class="form-input" id="visaDuration"><option value="10_days">10 Days</option><option value="14_days">14 Days</option><option value="30_days">30 Days</option><option value="60_days">60 Days</option><option value="90_days">90 Days</option><option value="1_year">1 Year</option></select></div>
        <div class="form-group"><label class="form-label">Adult Price</label><input class="form-input" type="number" id="visaAdultPrice" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Child Price</label><input class="form-input" type="number" id="visaChildPrice" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Currency</label><select class="form-input" id="visaCurrency"><option>AED</option><option>INR</option><option>SAR</option><option>USD</option><option>EUR</option><option>GBP</option></select></div>
        <div class="form-group"><label class="form-label">Processing Time</label><input class="form-input" id="visaProcessingTime" placeholder="e.g. 3-5 working days"></div>
        <div class="form-group"><label class="form-label">Visa Validity</label><input class="form-input" id="visaValidity" placeholder="e.g. 6 months from issue"></div>
        <div class="form-group"><label class="form-label">Entry Type</label><input class="form-input" id="visaEntryType" placeholder="e.g. Tourist, Business"></div>
        <div class="form-group"><label class="form-label">Status</label><select class="form-input" id="visaStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Required Documents</label><textarea class="form-input" id="visaRequiredDocs" rows="3" placeholder="Passport copy&#10;Photo&#10;Bank statement"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="saveVisaBtn" onclick="saveVisa()">Save Visa</button>
      <span class="save-msg" id="saveVisaMsg"></span>
      <button class="btn btn-secondary" onclick="closeModal('modalVisa')">Cancel</button>
    </div>
  </div>

  <!-- TA: GROUP FARE MODAL -->
  <div class="modal" id="modalGroupFare" style="width:600px">
    <span class="modal-drag"></span>
    <div class="modal-hd"><div class="modal-title" id="groupFareModalTitle">New Group Fare</div><button class="icon-btn" onclick="closeModal('modalGroupFare')">✕</button></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Sector (From → To) *</label><input class="form-input" id="gfSector" placeholder="e.g. DXB → COK"></div>
        <div class="form-group"><label class="form-label">Airline</label><input class="form-input" id="gfAirline" placeholder="e.g. Air India Express"></div>
        <div class="form-group"><label class="form-label">Flight Number</label><input class="form-input" id="gfFlightNumber" placeholder="e.g. IX 384"></div>
        <div class="form-group"><label class="form-label">Departure Date</label><input class="form-input" type="date" id="gfDepDate"></div>
        <div class="form-group"><label class="form-label">Departure Time</label><input class="form-input" type="time" id="gfDepTime"></div>
        <div class="form-group"><label class="form-label">Arrival Time</label><input class="form-input" type="time" id="gfArrTime"></div>
        <div class="form-group"><label class="form-label">Group Fare Price</label><input class="form-input" type="number" id="gfPrice" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Currency</label><select class="form-input" id="gfCurrency"><option>AED</option><option>INR</option><option>SAR</option><option>USD</option><option>EUR</option><option>GBP</option></select></div>
        <div class="form-group"><label class="form-label">Available Seats</label><input class="form-input" type="number" id="gfSeats" placeholder="0" min="0"></div>
        <div class="form-group"><label class="form-label">Booking Deadline</label><input class="form-input" type="date" id="gfDeadline"></div>
        <div class="form-group"><label class="form-label">Baggage Allowance</label><input class="form-input" id="gfBaggage" placeholder="e.g. 30kg"></div>
        <div class="form-group"><label class="form-label">Cabin Class</label><select class="form-input" id="gfCabinClass"><option value="economy">Economy</option><option value="business">Business</option></select></div>
        <div class="form-group"><label class="form-label">Fare Type</label><select class="form-input" id="gfFareType"><option value="refundable">Refundable</option><option value="non_refundable">Non-Refundable</option></select></div>
        <div class="form-group"><label class="form-label">Status</label><select class="form-input" id="gfStatus"><option value="available">Available</option><option value="limited">Limited</option><option value="closed">Closed</option></select></div>
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Remarks / Notes</label><textarea class="form-input" id="gfRemarks" rows="2"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="saveGroupFareBtn" onclick="saveGroupFare()">Save Group Fare</button>
      <span class="save-msg" id="saveGroupFareMsg"></span>
      <button class="btn btn-secondary" onclick="closeModal('modalGroupFare')">Cancel</button>
    </div>
  </div>

  <!-- TA: SPECIAL FARE MODAL -->
  <div class="modal" id="modalSpecialFare" style="width:600px">
    <span class="modal-drag"></span>
    <div class="modal-hd"><div class="modal-title" id="specialFareModalTitle">New Special Fare</div><button class="icon-btn" onclick="closeModal('modalSpecialFare')">✕</button></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Sector *</label><input class="form-input" id="sfSector" placeholder="e.g. DXB → COK"></div>
        <div class="form-group"><label class="form-label">From</label><input class="form-input" id="sfFrom" placeholder="e.g. Dubai"></div>
        <div class="form-group"><label class="form-label">To</label><input class="form-input" id="sfTo" placeholder="e.g. Kochi"></div>
        <div class="form-group"><label class="form-label">Airline</label><input class="form-input" id="sfAirline" placeholder="e.g. Air India Express"></div>
        <div class="form-group"><label class="form-label">Flight Number</label><input class="form-input" id="sfFlightNumber" placeholder="e.g. IX 384"></div>
        <div class="form-group"><label class="form-label">Departure Date</label><input class="form-input" type="date" id="sfDepDate"></div>
        <div class="form-group"><label class="form-label">Return Date (Optional)</label><input class="form-input" type="date" id="sfRetDate"></div>
        <div class="form-group"><label class="form-label">Special Fare</label><input class="form-input" type="number" id="sfPrice" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Currency</label><select class="form-input" id="sfCurrency"><option>AED</option><option>INR</option><option>SAR</option><option>USD</option><option>EUR</option><option>GBP</option></select></div>
        <div class="form-group"><label class="form-label">Cabin Class</label><select class="form-input" id="sfCabinClass"><option value="economy">Economy</option><option value="business">Business</option></select></div>
        <div class="form-group"><label class="form-label">Baggage Allowance</label><input class="form-input" id="sfBaggage" placeholder="e.g. 30kg"></div>
        <div class="form-group"><label class="form-label">Fare Type</label><select class="form-input" id="sfFareType"><option value="refundable">Refundable</option><option value="non_refundable">Non-Refundable</option></select></div>
        <div class="form-group"><label class="form-label">Available Seats</label><input class="form-input" type="number" id="sfSeats" placeholder="0" min="0"></div>
        <div class="form-group"><label class="form-label">Booking Deadline</label><input class="form-input" type="date" id="sfDeadline"></div>
        <div class="form-group"><label class="form-label">Fare Valid Until</label><input class="form-input" type="date" id="sfValidUntil"></div>
        <div class="form-group"><label class="form-label">Status</label><select class="form-input" id="sfStatus"><option value="available">Available</option><option value="limited">Limited</option><option value="closed">Closed</option></select></div>
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Remarks / Notes</label><textarea class="form-input" id="sfRemarks" rows="2"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="saveSpecialFareBtn" onclick="saveSpecialFare()">Save Special Fare</button>
      <span class="save-msg" id="saveSpecialFareMsg"></span>
      <button class="btn btn-secondary" onclick="closeModal('modalSpecialFare')">Cancel</button>
    </div>
  </div>

  <!-- TA: CSV IMPORT MODAL (shared by Packages and Service Cases) -->
  <div class="modal" id="modalTaImport" style="width:720px">
    <span class="modal-drag"></span>
    <div class="modal-hd"><div class="modal-title" id="taImportTitle">Upload CSV</div><button class="icon-btn" onclick="closeModal('modalTaImport')">✕</button></div>
    <div class="modal-body">
      <div class="s-note" id="taImportHint" style="margin-bottom:12px"></div>
      <input type="file" id="taImportFile" accept=".csv" style="margin-bottom:12px" onchange="taImportHandleFile(this.files[0])">
      <div id="taImportPreviewWrap" style="display:none">
        <div id="taImportSummary" class="s-note" style="margin-bottom:8px"></div>
        <div class="tbl-wrap" style="max-height:320px;overflow-y:auto">
          <table>
            <thead><tr><th>Row</th><th id="taImportCol1">Name</th><th id="taImportCol2">Detail</th><th>Action</th></tr></thead>
            <tbody id="taImportPreviewTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="taImportConfirmBtn" onclick="taConfirmImport()" style="display:none">Import</button>
      <span class="save-msg" id="taImportMsg"></span>
      <button class="btn btn-secondary" onclick="closeModal('modalTaImport')">Cancel</button>
    </div>
  </div>

  <!-- TA: UMRAH GROUP MODAL -->
  <div class="modal" id="modalUmrah" style="width:580px">
    <span class="modal-drag"></span>
    <div class="modal-hd"><div class="modal-title" id="umrahModalTitle">New Umrah Group</div><button class="icon-btn" onclick="closeModal('modalUmrah')">✕</button></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Group Name *</label><input class="form-input" id="umrahName" placeholder="e.g. Ramadan 2026 Group"></div>
        <div class="form-group"><label class="form-label">Departure Date</label><input class="form-input" type="date" id="umrahDep"></div>
        <div class="form-group"><label class="form-label">Return Date</label><input class="form-input" type="date" id="umrahRet"></div>
        <div class="form-group"><label class="form-label">Total Seats</label><input class="form-input" type="number" id="umrahSeats" placeholder="40"></div>
        <div class="form-group"><label class="form-label">Price per Pax</label><input class="form-input" type="number" id="umrahPrice" placeholder="0"></div>
        <div class="sec-hd" style="grid-column:1/-1;margin-top:4px">Hotel Details</div>
        <div class="form-group"><label class="form-label">Makkah Hotel</label><input class="form-input" id="umrahMakkahHotel" placeholder="Hilton Makkah"></div>
        <div class="form-group"><label class="form-label">Madinah Hotel</label><input class="form-input" id="umrahMadinahHotel" placeholder="Anwar Al Madinah"></div>
        <div class="form-group"><label class="form-label">Makkah Nights</label><input class="form-input" type="number" id="umrahMakkahNights" placeholder="5"></div>
        <div class="form-group"><label class="form-label">Madinah Nights</label><input class="form-input" type="number" id="umrahMadinahNights" placeholder="3"></div>
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Transport</label><input class="form-input" id="umrahTransport" placeholder="Bus, Flight details etc."></div>
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Notes</label><textarea class="form-input" id="umrahNotes" rows="2"></textarea></div>
      </div>

<script>
const WORKER_BASE = 'https://leadvyne-api-proxy.leadvyne.workers.dev';
const CONFIG = {
  NOCODB_BASE: WORKER_BASE+'/nocodb',
  CLIENTS_TABLE_ID: 'mxl33bg4wi70fqj',
  LEADS_TABLE_ID: 'mvg6rcw0ia5qqrx',
  WORKER_BASE
};

const params = new URLSearchParams(location.search);
let clientId = params.get('client') || '';
let sessionToken = params.get('token') || '';
const isEmbedded = params.get('embed') === '1';
let clientRecord = null;
let allLeads = [];

function $id(id){ return document.getElementById(id); }
function esc(str){ return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(str){ return esc(str).replace(/"/g,'&quot;'); }
function fmtMoney(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}); }
function showMsg(id,msg,duration){ const el=$id(id); if(!el)return; el.textContent=msg; setTimeout(()=>{el.textContent='';},duration||3000); }

/* ═══════════════ NOCODB API (via the Cloudflare Worker proxy) ═══════════════ */
function ncAuthHeaders(extra){ return {'Authorization':'Bearer '+sessionToken, ...extra}; }
async function ncGet(url){ const r=await fetch(url,{headers:ncAuthHeaders()}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function ncPatch(url,body){ const r=await fetch(url,{method:'PATCH',headers:ncAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify(body)}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function patchClient(fields){
  const MAX=3; let lastErr=null;
  for(let attempt=1; attempt<=MAX; attempt++){
    await ncPatch(`${CONFIG.NOCODB_BASE}/api/v2/tables/${CONFIG.CLIENTS_TABLE_ID}/records`,{Id:Number(clientId),...fields});
    const fresh=await ncGet(`${CONFIG.NOCODB_BASE}/api/v2/tables/${CONFIG.CLIENTS_TABLE_ID}/records/${Number(clientId)}`);
    const stuck=Object.keys(fields).filter(k=>String(fresh[k]??'')!==String(fields[k]??''));
    if(!stuck.length){ Object.assign(clientRecord,fresh); return; }
    lastErr=new Error('Save did not take effect for: '+stuck.join(', '));
    if(attempt<MAX) await new Promise(r=>setTimeout(r,900*attempt));
  }
  throw lastErr;
}
async function patchLead(leadId,fields){ await ncPatch(`${CONFIG.NOCODB_BASE}/api/v2/tables/${CONFIG.LEADS_TABLE_ID}/records`,{Id:Number(leadId),...fields}); }

async function loadLeads(){
  const data=await ncGet(`${CONFIG.NOCODB_BASE}/api/v2/tables/${CONFIG.LEADS_TABLE_ID}/records?where=${encodeURIComponent(`(ClientId,eq,${clientId})`)}&limit=2000&sort=-Date`);
  allLeads=data.list||[];
}

/* Deep link back into the parent dashboard.html — used by renderTravelAnalyticsSection's trip
   cards/hot-inquiry rows (a lead is core CRM data, opened in the parent's own lead-detail modal
   rather than duplicating that UI in this standalone module). */
function openLeadInParent(leadId){
  window.parent.postMessage({type:'ta:openLead', leadId}, location.origin);
}

async function init(){
  if(isEmbedded){ const hdr=document.querySelector('header'); if(hdr) hdr.style.display='none'; }
  if(!clientId){ clientId=prompt('Enter your Client ID:')||''; }
  if(!clientId||!sessionToken){ document.body.innerHTML='<div class="empty-state" style="padding:60px"><div class="empty-icon">🔒</div>Missing client/session — open this page from the Agency tab inside your dashboard.</div>'; return; }
  $id('app').style.display='flex';
  try{
    clientRecord=await ncGet(`${CONFIG.NOCODB_BASE}/api/v2/tables/${CONFIG.CLIENTS_TABLE_ID}/records/${clientId}`);
    if(clientRecord.ta_enabled!=='Yes'){
      $id('app').innerHTML='<div class="empty-state" style="padding:60px"><div class="empty-icon">✈️</div>The Travel Agency module isn\'t enabled for this account. Ask your admin to enable it in Settings → Modules.</div>';
      return;
    }
    await loadLeads();
    if(!taTablesReady()){
      $id('agencyContent').innerHTML=renderTaSetupNeeded();
      document.querySelectorAll('.ta-tab').forEach(t=>t.classList.remove('active'));
      taUpdateMissingBanner();
      return;
    }
    await taLoad();
    taUpdateMissingBanner();
    renderAgencySubPage(_taPage);
  }catch(e){
    $id('app').innerHTML=`<div class="empty-state" style="padding:60px"><div class="empty-icon">⚠️</div>Failed to load: ${esc(e.message)}</div>`;
  }
}

/* ── TRAVEL AGENCY MODULE ── */
let _taPage = 'dashboard';
let _taPackages = [], _taBookings = [], _taCases = [], _taItineraries = [], _taUmrahGroups = [], _taCars = [], _taCarBookings = [];
let _taVisas = [], _taGroupFares = [], _taSpecialFares = [];
let _taLoaded = false;
/* ── TA: TABLE IDS & CRUD HELPERS ── */
function taTableIds(){
  try{return JSON.parse(clientRecord.ta_table_ids||'{}');}catch(e){return{};}
}
function taTablesReady(){
  const ids=taTableIds();
  return !!(ids.packages&&ids.bookings&&ids.cases&&ids.itineraries&&ids.umrah_groups);
}
function safeJson(s,def=[]){try{return JSON.parse(s||'null')||def;}catch(e){return def;}}

// Table titles keyed the same way as ta_table_ids, shared by taSetupTables() (first-time
// creation) and taRepairTableIds() below (re-resolving a stored ID that's stopped working —
// e.g. the table was deleted and recreated in NocoDB directly, which gives it a new ID that
// the client's stored ta_table_ids doesn't know about, so every save 404s until repaired).
const TA_TABLE_TITLES={packages:'ta_packages',bookings:'ta_bookings',cases:'ta_cases',itineraries:'ta_itineraries',umrah_groups:'ta_umrah_groups',cars:'ta_cars',car_bookings:'ta_car_bookings',visas:'ta_visas',group_fares:'ta_group_fares',special_fares:'ta_special_fares'};

async function taRepairTableIds(){
  const info=await ncGet(`${CONFIG.NOCODB_BASE}/api/v2/meta/tables/${CONFIG.CLIENTS_TABLE_ID}`);
  const baseId=info.base_id;
  if(!baseId) return taTableIds();
  const baseTables=await ncGet(`${CONFIG.NOCODB_BASE}/api/v2/meta/bases/${baseId}/tables`).catch(()=>({list:[]}));
  const existingTableMap={};
  (baseTables.list||[]).forEach(t=>{ existingTableMap[t.title]=t.id; });
  const ids=taTableIds();
  Object.entries(TA_TABLE_TITLES).forEach(([key,title])=>{
    if(existingTableMap[title]) ids[key]=existingTableMap[title];
  });
  const tableIdsJson=JSON.stringify(ids);
  // Same bug class already fixed for Appointments (see SETUP.md "Fixed: 'Enabled' not actually
  // saving") but never actually applied here: writing to the local cache unconditionally, before
  // confirming the server write landed, lets apptMergeLocal()'s TA equivalent (taMergeLocal) paper
  // over a real save failure with a value that was never actually persisted. Only cache locally
  // after patchClient() (which itself now retries through NocoDB's schema-cache lag — see its own
  // comment) confirms the write actually stuck; let a genuine failure propagate to this function's
  // caller (taWithRepair already has its own .catch(()=>({})) around this specific call).
  await patchClient({ta_table_ids:tableIdsJson});
  taSaveLocal('ta_table_ids',tableIdsJson);
  clientRecord.ta_table_ids=tableIdsJson;
  return ids;
}

// Wraps a taFetch/taCreate/taUpdate/taDeleteRow call: if the stored table ID 404s (table was
// deleted/recreated since it was first configured, or a stale ta_table_ids was resurrected from
// this browser's localStorage cache — see taMergeLocal), re-resolve every table ID by its actual
// name in NocoDB and retry once, instead of leaving the user stuck on a bare "HTTP 404".
async function taWithRepair(key,fn){
  const id=taTableIds()[key];
  if(!id) throw new Error(`${TA_TABLE_TITLES[key]||key} isn't set up yet — run "Create Tables Now" in the Agency module.`);
  try{
    return await fn(id);
  }catch(e){
    if(e.message!=='HTTP 404') throw e;
    const repaired=await taRepairTableIds().catch(()=>({}));
    const newId=repaired[key];
    if(!newId||newId===id) throw new Error(`${TA_TABLE_TITLES[key]||key} table is missing in NocoDB (it may have been deleted). Re-run "Create Tables Now" in the Agency module to recreate it.`);
    return await fn(newId);
  }
}

async function taFetch(key,limit=500,offset=0){
  if(!taTableIds()[key])return[];
  const d=await taWithRepair(key,id=>ncGet(`${CONFIG.NOCODB_BASE}/api/v2/tables/${id}/records?where=(client_id,eq,${clientId})&limit=${limit}&sort=-CreatedAt&offset=${offset}`));
  return d.list||[];
}
async function taCreate(key,record){
  return taWithRepair(key,id=>ncPost(`${CONFIG.NOCODB_BASE}/api/v2/tables/${id}/records`,{...record,client_id:String(clientId)}));
}
async function taUpdate(key,rowId,record){
  await taWithRepair(key,id=>ncPatch(`${CONFIG.NOCODB_BASE}/api/v2/tables/${id}/records`,{Id:rowId,...record}));
}
async function taDeleteRow(key,rowId){
  await taWithRepair(key,id=>ncDelete(`${CONFIG.NOCODB_BASE}/api/v2/tables/${id}/records`,{Id:rowId}));
}
/* ── TA: CSV IMPORT (Packages / Service Cases) — direct in-browser upload, no n8n involved.
   Parses with the same parseCSVLine used by the Leads importer above; list-type fields
   (inclusions/exclusions) use ";" as the in-cell separator instead of embedded newlines,
   since parseCSVLine splits on lines before it looks at quoting. Rows are matched against
   already-loaded records by matchKey (case-insensitive) and PATCHed if found, POSTed as new
   otherwise — the same real-upsert approach used for ecom Products, not a fake one. ── */
const TA_IMPORT_SCHEMAS={
  packages:{
    label:'Packages', taKey:'packages', matchKey:'name', col1:'Name', col2:'Price',
    fields:[
      {key:'name',label:'Name',required:true},{key:'type',label:'Type'},{key:'destination',label:'Destination'},
      {key:'nights',label:'Nights',type:'int'},{key:'pax_min',label:'Min Pax',type:'int'},{key:'pax_max',label:'Max Pax',type:'int'},
      {key:'currency',label:'Currency'},{key:'base_price',label:'Base Price',type:'float'},{key:'sell_price',label:'Sell Price',type:'float'},
      {key:'inclusions',label:'Inclusions',type:'list'},{key:'exclusions',label:'Exclusions',type:'list'},{key:'notes',label:'Notes'},
    ],
    sample:['Dubai 5N City Tour','tour','Dubai, UAE','5','1','20','AED','800','1200','Visa;Return flights;4-star hotel','Travel insurance','Popular package'],
    list:()=>_taPackages, renderRow:r=>({c1:r.name||'—',c2:(r.currency||'AED')+' '+(r.sell_price||r.base_price||0)}),
    afterImport:()=>renderAgencySubPage('packages'),
  },
  cases:{
    label:'Service Cases', taKey:'cases', matchKey:'ref_no', col1:'Client', col2:'Type',
    fields:[
      {key:'client_name',label:'Client Name',required:true},{key:'client_phone',label:'Phone'},{key:'type',label:'Type'},
      {key:'ref_no',label:'Ref No'},{key:'stage',label:'Stage'},{key:'due_date',label:'Due Date'},
      {key:'fee',label:'Fee',type:'float'},{key:'status',label:'Status'},{key:'notes',label:'Notes'},
    ],
    sample:['John Doe','971501234567','visa','REF-1001','pending','2026-08-01','150','open','New visa application'],
    list:()=>_taCases, renderRow:r=>({c1:r.client_name||'—',c2:r.type||'—'}),
    afterImport:()=>renderAgencySubPage('services'),
  },
};
let _taImportEntity=null, _taImportRows=[];

function taDownloadTemplate(entity){
  const schema=TA_IMPORT_SCHEMAS[entity];
  const headers=schema.fields.map(f=>f.key);
  const csv=[headers.join(','), schema.sample.map(taCsvCell).join(',')].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`${entity}_template.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}
function taCsvCell(v){ const s=String(v??''); return /[",]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }

function taOpenImport(entity){
  _taImportEntity=entity; _taImportRows=[];
  const schema=TA_IMPORT_SCHEMAS[entity];
  $id('taImportTitle').textContent=`Upload ${schema.label} CSV`;
  $id('taImportHint').innerHTML=`Use the same headers as the <a href="#" onclick="taDownloadTemplate('${entity}');return false">CSV template</a>: <code style="font-family:var(--mono);font-size:11px">${schema.fields.map(f=>f.key).join(', ')}</code>. Only <strong>${schema.fields.find(f=>f.required).label}</strong> is required.${schema.fields.some(f=>f.type==='list')?' List fields (inclusions/exclusions) use ";" to separate items within a cell.':''} Rows whose <strong>${schema.matchKey}</strong> matches an existing record update it in place — everything else is created as new.`;
  $id('taImportCol1').textContent=schema.col1; $id('taImportCol2').textContent=schema.col2;
  $id('taImportFile').value='';
  $id('taImportPreviewWrap').style.display='none';
  $id('taImportConfirmBtn').style.display='none';
  $id('taImportMsg').textContent='';

}

function taImportHandleFile(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    try{ _taImportRows=taParseImportRows(e.target.result, TA_IMPORT_SCHEMAS[_taImportEntity]); taRenderImportPreview(); }
    catch(err){ $id('taImportMsg').textContent='Could not read that file: '+err.message; }
  };
  r.readAsText(file);
}

function taParseImportRows(text,schema){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) throw new Error('CSV needs a header row plus at least one data row');
  const headerRow=parseCSVLine(lines[0]).map(h=>h.trim().toLowerCase());
  const colIndex={};
  schema.fields.forEach(f=>{
    let idx=headerRow.indexOf(f.key);
    if(idx===-1) idx=headerRow.indexOf(f.label.toLowerCase());
    if(idx!==-1) colIndex[f.key]=idx;
  });
  const requiredField=schema.fields.find(f=>f.required);
  if(colIndex[requiredField.key]===undefined) throw new Error(`CSV must have a "${requiredField.key}" column`);

  const existingByKey=new Map(schema.list().filter(r=>r[schema.matchKey]).map(r=>[String(r[schema.matchKey]).trim().toLowerCase(),r]));

  return lines.slice(1).map((line,i)=>{
    const cells=parseCSVLine(line);
    const get=key=>(colIndex[key]!==undefined?(cells[colIndex[key]]||'').trim():'');
    const data={};
    schema.fields.forEach(f=>{
      const raw=get(f.key);
      if(f.type==='int') data[f.key]=parseInt(raw,10)||0;
      else if(f.type==='float') data[f.key]=parseFloat(raw)||0;
      else if(f.type==='list') data[f.key]=JSON.stringify(raw?raw.split(';').map(s=>s.trim()).filter(Boolean):[]);
      else data[f.key]=raw;
    });
    const matchVal=get(schema.matchKey);
    const existing=matchVal?existingByKey.get(matchVal.toLowerCase()):null;
    return { rowNum:i+2, valid:!!get(requiredField.key), action:existing?'update':'create', existingId:existing?existing.Id:null, data };
  });
}

function taRenderImportPreview(){
  const schema=TA_IMPORT_SCHEMAS[_taImportEntity];
  const wrap=$id('taImportPreviewWrap'), tbody=$id('taImportPreviewTbody'), summary=$id('taImportSummary'), confirmBtn=$id('taImportConfirmBtn');
  const valid=_taImportRows.filter(r=>r.valid), invalid=_taImportRows.filter(r=>!r.valid);
  const creates=valid.filter(r=>r.action==='create').length, updates=valid.filter(r=>r.action==='update').length;
  summary.innerHTML=`<strong>${_taImportRows.length}</strong> row(s) parsed — <strong>${creates}</strong> new, <strong>${updates}</strong> updating existing (matched by ${esc(schema.matchKey)})`+
    (invalid.length?`, <strong>${invalid.length}</strong> skipped (missing required field)`:'');
  tbody.innerHTML=_taImportRows.map(r=>{
    const row=schema.renderRow(r.data);
    return `<tr${r.valid?'':' style="opacity:.5"'}>
      <td>${r.rowNum}</td><td>${esc(row.c1)}</td><td>${esc(row.c2)}</td>
      <td>${r.valid?(r.action==='update'?'Update':'Create'):'Skip'}</td>
    </tr>`;
  }).join('');
  wrap.style.display='';
  confirmBtn.style.display=valid.length?'':'none';
}

async function taConfirmImport(){
  const schema=TA_IMPORT_SCHEMAS[_taImportEntity];
  const valid=_taImportRows.filter(r=>r.valid);
  if(!valid.length) return;
  const btn=$id('taImportConfirmBtn'), msg=$id('taImportMsg');
  btn.disabled=true;
  let done=0, failed=0;
  for(const r of valid){
    msg.textContent=`Importing… ${done+failed}/${valid.length}`;
    try{
      if(r.existingId) await taUpdate(schema.taKey,r.existingId,r.data);
      else await taCreate(schema.taKey,r.data);
      done++;
    }catch(e){ failed++; }
  }
  btn.disabled=false;
  msg.textContent=failed?`Done — ${done} imported, ${failed} failed`:`✓ Imported ${done} record(s)`;
  _taLoaded=false;
  await taLoad();
  schema.afterImport();
  if(!failed) setTimeout(()=>closeModal('modalTaImport'),1200);
}

async function taLoad(){
  if(!taTablesReady())return;
  const [pkgs,bks,cs,its,ug,cars,carbks,visas,gfares,sfares]=await Promise.all([
    taFetch('packages'),taFetch('bookings'),taFetch('cases'),
    taFetch('itineraries'),taFetch('umrah_groups'),
    taFetch('cars'),taFetch('car_bookings'),
    taFetch('visas'),taFetch('group_fares'),taFetch('special_fares')
  ]);
  _taPackages=pkgs; _taBookings=bks; _taCases=cs;
  _taItineraries=its.map(r=>({...r,days:safeJson(r.days)}));
  _taUmrahGroups=ug.map(r=>({...r,pilgrims:safeJson(r.pilgrims)}));
  _taCars=cars; _taCarBookings=carbks;
  _taVisas=visas; _taGroupFares=gfares; _taSpecialFares=sfares;
  _taLoaded=true;
  sendTaBadgeCount();
}

// taTablesReady() only gates on the original 5 tables (packages/bookings/cases/itineraries/
// umrah_groups), so an account that finished setup before Visas/Group Fares/Special Fares/Cars
// existed sails straight past renderTaSetupNeeded() into the module — then hits a bare
// "ta_visas isn't set up yet" error the first time it touches one of those newer tabs, with no
// visible way to re-run Create Tables Now (that button only lives inside renderTaSetupNeeded(),
// which never shows again once the original 5 exist). This banner is the fix: it surfaces
// whichever tables are actually still missing, with a button that calls the same taSetupTables()
// — already idempotent (reuses any table that already exists by name) — so existing accounts can
// self-serve instead of needing a manual admin fix per client.
function taMissingTableTitles(){
  const ids=taTableIds();
  return Object.entries(TA_TABLE_TITLES).filter(([k])=>!ids[k]).map(([,title])=>title);
}
function taUpdateMissingBanner(){

}

function filterPkgs(type) {

function openPkgModal(id){

  $id('pkgModalTitle').textContent=id?'Edit Package':'New Package';

  $id('pkgSellPrice').value=p.sell_price||'';
  $id('pkgInclusions').value=safeJson(p.inclusions,p.inclusions instanceof Array?p.inclusions:[]).join('\n');
  $id('pkgExclusions').value=safeJson(p.exclusions,p.exclusions instanceof Array?p.exclusions:[]).join('\n');

async function savePkg(){
  const btn=$id('savePkgBtn'),msg=$id('savePkgMsg');
  btn.disabled=true;msg.textContent='';msg.className='save-msg';
  const inc=$id('pkgInclusions').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const exc=$id('pkgExclusions').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const p={name:$id('pkgName').value.trim(),type:$id('pkgType').value,destination:$id('pkgDest').value.trim(),nights:parseInt($id('pkgNights').value)||0,pax_min:parseInt($id('pkgPaxMin').value)||1,pax_max:parseInt($id('pkgPaxMax').value)||99,currency:$id('pkgCurrency').value,base_price:parseFloat($id('pkgBasePrice').value)||0,sell_price:parseFloat($id('pkgSellPrice').value)||0,inclusions:JSON.stringify(inc),exclusions:JSON.stringify(exc),notes:$id('pkgNotes').value.trim()};
  if(!p.name){msg.textContent='Name required';msg.className='save-msg err';btn.disabled=false;return;}
  try{
    if(_editPkgId) await taUpdate('packages',_editPkgId,p); else await taCreate('packages',p);
    msg.textContent='✓ Saved';
    _taLoaded=false;
    setTimeout(async()=>{closeModal('modalPkg');await taLoad();renderAgencySubPage('packages');},600);
  }catch(e){msg.textContent='Error: '+e.message;msg.className='save-msg err';}
  finally{btn.disabled=false;}
}

async function deletePkg(id){
  if(!confirm('Delete this package?'))return;
  await taDeleteRow('packages',id);_taLoaded=false;await taLoad();renderAgencySubPage('packages');
}

// Single source of truth for an itinerary item's type — icon/label for the builder UI and
// itinerary list preview, hex color for both the builder's card accent and the PDF's timeline bar
// + pill, so a "Flight" reads the same blue everywhere the app shows it.
const ITIN_TYPES=['flight','hotel','activity','transfer','meal','note'];
const ITIN_TYPE_META={
  flight:{icon:'✈️',label:'Flight',hex:'#2563EB'},
  hotel:{icon:'🏨',label:'Hotel',hex:'#7C3AED'},
  activity:{icon:'🎯',label:'Activity',hex:'#16A34A'},

// `prefill` (title/destination/from_date/to_date/notes/days — same shape as an itinerary record)
// lets pkgCreateItin/groupFareCreateItin/specialFareCreateItin below open this as a brand-new,
// pre-populated itinerary instead of a blank one. Only used when `id` is falsy — an existing
// itinerary always wins over a stale prefill.
function openItinModal(id, prefill) {
  _editItinId = id||null;

// ── Create Itinerary from Package / Group Fare / Special Fare ──
// Each builds a starting itinerary from whichever structured fields that source type actually
// has (packages: nights → blank day count; fares: flight fields → a seeded Flight item using the
// day-item types added earlier), then opens the same itinerary modal used for a blank "+ New
// Itinerary" — the user still fills in the day-by-day details, this just saves the re-typing of
// what's already known (title/destination/dates/flight info).
function pkgToItinPrefill(p){
  const nights=Math.max(1,parseInt(p.nights)||1);
  const days=[];
  for(let i=0;i<nights;i++) days.push({day_no:i+1,title:'',items:[]});
  const inc=safeJson(p.inclusions,p.inclusions instanceof Array?p.inclusions:[]);
  const notesParts=[];
  if(inc.length) notesParts.push('Includes: '+inc.join(', '));
  if((p.notes||'').trim()) notesParts.push(p.notes.trim());
  return {title:p.name||'',destination:p.destination||'',from_date:'',to_date:'',notes:notesParts.join('\n\n'),days};
}
function pkgCreateItin(id){
  const p=_taPackages.find(x=>String(x.Id)===String(id));
  if(p) openItinModal(null,pkgToItinPrefill(p));
}

function groupFareToItinPrefill(g){
  const flightDesc=[g.airline,g.flight_number].filter(Boolean).join(' ')
    +(g.departure_time?` — departs ${g.departure_time}`:'')+(g.arrival_time?`, arrives ${g.arrival_time}`:'');
  const notesParts=[];
  if(g.cabin_class) notesParts.push('Cabin: '+cap(g.cabin_class));
  if(g.fare_type) notesParts.push('Fare type: '+cap(g.fare_type));
  if(g.baggage_allowance) notesParts.push('Baggage: '+g.baggage_allowance);
  if((g.remarks||'').trim()) notesParts.push(g.remarks.trim());
  return {
    title:g.sector?`${g.sector} Group Fare`:'Group Fare Itinerary', destination:g.sector||'',
    from_date:g.departure_date||'', to_date:'', notes:notesParts.join('\n'),
    days:[{day_no:1,title:'Departure',items:[{type:'flight',description:flightDesc.trim(),image:''}]}],
  };
}
function groupFareCreateItin(id){
  const g=_taGroupFares.find(x=>String(x.Id)===String(id));
  if(g) openItinModal(null,groupFareToItinPrefill(g));
}

function specialFareToItinPrefill(s){
  const flightDesc=[s.airline,s.flight_number].filter(Boolean).join(' ')||'Flight';
  const notesParts=[];
  if(s.cabin_class) notesParts.push('Cabin: '+cap(s.cabin_class));
  if(s.fare_type) notesParts.push('Fare type: '+cap(s.fare_type));
  if(s.baggage_allowance) notesParts.push('Baggage: '+s.baggage_allowance);
  if(s.fare_valid_until) notesParts.push('Fare valid until: '+s.fare_valid_until);
  if((s.remarks||'').trim()) notesParts.push(s.remarks.trim());
  const days=[{day_no:1,title:'Departure',items:[{type:'flight',description:flightDesc,image:''}]}];
  if((s.return_date||'').trim()) days.push({day_no:2,title:'Return',items:[{type:'flight',description:flightDesc,image:''}]});
  return {
    title:(s.from_city||s.to_city)?`${s.from_city||'—'} → ${s.to_city||'—'}`:(s.sector||'Special Fare Itinerary'),
    destination:s.to_city||s.sector||'', from_date:s.departure_date||'', to_date:s.return_date||'',
    notes:notesParts.join('\n'), days,
  };
}
function specialFareCreateItin(id){
  const s=_taSpecialFares.find(x=>String(x.Id)===String(id));
  if(s) openItinModal(null,specialFareToItinPrefill(s));
}

function itinRenderLogoWrap(){
  const wrap=$id('itinLogoWrap'); if(!wrap) return;
  wrap.innerHTML=_itinLogoUrl
    ? `<div style="display:flex;align-items:center;gap:10px">
        <img src="${_itinLogoUrl}" style="max-height:50px;max-width:160px;border-radius:6px;border:1px solid var(--line)">
        <button type="button" onclick="itinRemoveLogo()" style="background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:12px">Remove</button>
      </div>`
    : `<label style="display:inline-block;font-size:12.5px;color:var(--accent-ink);cursor:pointer;border:1.5px dashed var(--ls);border-radius:6px;padding:8px 12px">+ Upload logo (PNG/JPG/WEBP, max 400KB)<input type="file" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="itinHandleLogoFile(this.files[0])"></label>`;
}

async function itinHandleLogoFile(file){
  if(!file) return;
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)){ alert('Please choose a PNG, JPG, or WEBP image.'); return; }
  if(file.size>400*1024){ alert('Logo must be under 400KB.'); return; }
  const dataUrl=await new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
  _itinLogoUrl=dataUrl;
  itinLoadLogoDims(dataUrl);
  itinRenderLogoWrap();
}

async function itinHandleItemImage(di,ii,file){

  if(!['image/png','image/jpeg','image/webp'].includes(file.type)){ alert('Please choose a PNG, JPG, or WEBP image.'); return; }
