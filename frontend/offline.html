<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline · Leadvyne</title>
<meta name="theme-color" content="#0D9C93">
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  .wrap{max-width:360px}
  .badge{width:56px;height:56px;border-radius:16px;background:#0D9C93;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:26px}

  p{font-size:14px;line-height:1.5;color:rgba(255,255,255,.7);margin-bottom:22px}
  button{background:#0D9C93;color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer}

</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">📡</div>
    <h1>You're offline</h1>

    <button onclick="location.reload()">Retry</button>
  </div>
