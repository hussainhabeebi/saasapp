<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leadvyne · Matrimonial</title><meta name="theme-color" content="#be185d"><link rel="manifest" href="manifest.json"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#fdf2f8;--card:#fff;--ink:#3b0764;--muted:#7e3a6e;--a:#be185d;--a2:#9d174d;--soft:#fce7f3;--line:#fbcfe8;--bad:#b91c1c;--ok:#047857;--r:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,sans-serif}button,input,select,textarea{font:inherit}header{height:58px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}.brand{font:700 17px "Space Grotesk"}.brand span{color:var(--a)}.chip,.badge{display:inline-block;border-radius:20px;padding:4px 9px;background:var(--soft);color:var(--a2);font-size:11px;font-weight:700}.badge.gray{background:#f1f5f9;color:#475569}.badge.ok{background:#d1fae5;color:var(--ok)}.badge.warn{background:#fef3c7;color:#92400e}.badge.danger{background:#fee2e2;color:var(--bad)}.back{margin-left:auto}.tabs{display:flex;overflow:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 16px;position:sticky;top:58px;z-index:19}.tab{white-space:nowrap;border:0;border-bottom:3px solid transparent;background:none;padding:12px 13px;color:var(--muted);font:600 13px "Space Grotesk";cursor:pointer}.tab.active{color:var(--a2);border-color:var(--a)}main{max-width:1400px;margin:auto;padding:20px}.page{display:none}.page.active{display:block}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:18px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 16px #be185d0d}.stat{padding:16px}.stat b{font:700 26px "Space Grotesk";color:var(--a2);display:block}.stat span{color:var(--muted);font-size:12px}.card{padding:18px;margin-bottom:16px}.title-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.title{font:700 14px "Space Grotesk";text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:8px 13px;background:linear-gradient(135deg,#be185d,#ec4899);color:#fff;font-weight:700;cursor:pointer}.btn.sec{background:var(--soft);color:var(--a2);border:1px solid var(--a)}.btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line)}.btn.danger{background:#fee2e2;color:var(--bad)}.btn.sm{padding:5px 9px;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.profile-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:box-shadow .15s}.profile-card:hover{box-shadow:0 4px 20px #be185d20}.profile-photo{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}.hint{color:var(--muted);font-size:12px;line-height:1.55}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}.empty{text-align:center;color:var(--muted);padding:30px!important}.input{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--bg);color:var(--ink);width:100%}.search{width:200px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field.full{grid-column:1/-1}.field label{display:block;color:var(--muted);text-transform:uppercase;font-size:10px;font-weight:700;margin:0 0 5px}.modal-bg{display:none;position:fixed;inset:0;background:#3b076480;z-index:100;padding:20px;align-items:center;justify-content:center}.modal-bg.on{display:flex}.modal{background:#fff;width:min(860px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:22px}.modal h2{font:700 19px "Space Grotesk";margin:0 0 18px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.row-actions{display:flex;gap:5px}.status-pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}.plan-free{background:#f1f5f9;color:#475569}.plan-silver{background:#e2e8f0;color:#334155}.plan-gold{background:#fef3c7;color:#92400e}.plan-platinum{background:#ede9fe;color:#5b21b6}.story-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center}.story-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--soft);margin:0 auto 10px}.toggle{display:flex!important;align-items:center;gap:8px;text-transform:none!important;font-size:13px!important}.toggle input{width:18px;height:18px}@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}main{padding:12px}.search{width:100%}}
</style></head><body>
<header><span class="brand">Leadvyne<span>.</span></span><span class="chip">💍 Matrimonial</span><button class="btn ghost back" onclick="location.href='dashboard.html?client='+clientId">← CRM</button></header>
<nav class="tabs">
  <button class="tab active" data-page="overview">Overview</button>
  <button class="tab" data-page="profiles">Profiles</button>
  <button class="tab" data-page="matches">Matches</button>
  <button class="tab" data-page="shortlists">Shortlists</button>
  <button class="tab" data-page="stories">Success Stories</button>
  <button class="tab" data-page="settings">Settings</button>
</nav>
<main>

<!-- OVERVIEW -->
<section class="page active" id="page-overview">
  <div class="stats" id="stats"></div>
  <div class="grid2">
    <div class="card">
      <div class="title">Recent profiles</div>
      <div id="recentProfiles"></div>
    </div>
    <div class="card">
      <div class="title">Recent matches</div>
      <div id="recentMatches"></div>
    </div>
  </div>
  <div class="card">
    <div class="title">System readiness</div>
    <div id="readiness"></div>
  </div>
</section>

<!-- PROFILES -->
<section class="page" id="page-profiles">
  <div class="card">
    <div class="title-row">
      <div class="title">All Profiles</div>
      <div class="actions">
        <select class="input" id="filterType" onchange="renderProfiles()" style="max-width:130px">
          <option value="">All types</option>
          <option value="bride">Bride</option>
          <option value="groom">Groom</option>
        </select>
        <select class="input" id="filterPlan" onchange="renderProfiles()" style="max-width:130px">
          <option value="">All plans</option>
          <option value="free">Free</option>
          <option value="silver">Silver</option>
          <option value="gold">Gold</option>
          <option value="platinum">Platinum</option>
        </select>
        <input class="input search" id="profileSearch" placeholder="Search name, city…" oninput="renderProfiles()">
        <button class="btn" onclick="openProfile()">+ Add Profile</button>
      </div>
    </div>
    <div class="profile-grid" id="profileGrid"></div>
  </div>
</section>

<!-- MATCHES -->
<section class="page" id="page-matches">
  <div class="card">
    <div class="title-row">
      <div class="title">Match Records</div>
      <div class="actions">
        <select class="input" id="filterMatchStatus" onchange="renderMatches()" style="max-width:160px">
          <option value="">All statuses</option>
          <option value="suggested">Suggested</option>
          <option value="interest_sent">Interest Sent</option>
          <option value="mutual">Mutual Interest</option>
          <option value="family_meeting_arranged">Meeting Arranged</option>
          <option value="family_meeting_done">Meeting Done</option>
          <option value="engaged">Engaged</option>
          <option value="married">Married</option>
          <option value="rejected">Rejected</option>
          <option value="on_hold">On Hold</option>
        </select>
        <button class="btn" onclick="openMatch()">+ New Match</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Profile 1</th><th>Profile 2</th><th>Score</th><th>Status</th><th>Family Meeting</th><th>Notes</th><th>Actions</th></tr></thead>
        <tbody id="matchRows"></tbody>
      </table>
    </div>
  </div>
</section>

<!-- SHORTLISTS -->
<section class="page" id="page-shortlists">
  <div class="card">
    <div class="title-row">
      <div class="title">Shortlists</div>
      <button class="btn" onclick="openShortlist()">+ Add Shortlist</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Profile</th><th>Shortlisted Profile</th><th>Notes</th><th>Date</th><th>Actions</th></tr></thead>
        <tbody id="shortlistRows"></tbody>
      </table>
    </div>
  </div>
</section>

<!-- SUCCESS STORIES -->
<section class="page" id="page-stories">
  <div class="card">
    <div class="title-row">
      <div class="title">Success Stories</div>
      <button class="btn" onclick="openStory()">+ Add Story</button>
    </div>
    <div class="grid3" id="storyGrid"></div>
  </div>
</section>

<!-- SETTINGS -->
<section class="page" id="page-settings">
  <div class="card">
    <div class="title">Service Settings</div>
    <div class="form-grid" style="margin-top:14px">
      <div class="field"><label>Service name</label><input class="input" id="setServiceName" placeholder="Matrimonial Service"></div>
      <div class="field"><label>Privacy note (shown to clients)</label><input class="input" id="setPrivacyNote" placeholder="All profiles are verified and kept confidential."></div>
      <div class="field full"><label>Membership plans (JSON — e.g. {"free":"Basic listing","gold":"Priority + horoscope"})</label><textarea class="input" id="setMembershipPlans" rows="3"></textarea></div>
      <div class="field"><label><label class="toggle"><input type="checkbox" id="setHoroscopeEnabled"> Enable horoscope matching</label></label></div>
      <div class="field"><label><label class="toggle"><input type="checkbox" id="setAutoSuggest"> Auto-suggest matches on new profile</label></label></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:9px"><button class="btn" onclick="saveSettings()">Save Settings</button><span id="setMsg" style="color:var(--ok);font-size:13px;align-self:center"></span></div>
  </div>
</section>

</main>
<div id="modals"></div>
<script>
const API='https://leadvyne-api-proxy.leadvyne.workers.dev',P=new URLSearchParams(location.search),clientId=P.get('client')||'';let token=P.get('token')||sessionStorage.getItem('lv_matrimonial_token')||'';if(P.get('token'))sessionStorage.setItem('lv_matrimonial_token',P.get('token'));
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let profiles=[],matches=[],shortlists=[],stories=[],settings={};

async function api(path,o={}){const r=await fetch(API+path,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||'HTTP '+r.status);return d}
function modal(id,on=true){$(id).classList.toggle('on',on)}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');$('page-'+b.dataset.page).classList.add('active');
  if(b.dataset.page==='settings')renderSettings();
});

function profileName(id){return profiles.find(x=>+x.id===+id)?.full_name||'#'+id}
function planBadge(plan){return `<span class="status-pill plan-${plan||'free'}">${(plan||'free').toUpperCase()}</span>`}
function statusBadge(s){const map={suggested:'gray',interest_sent:'warn',mutual:'warn',family_meeting_arranged:'warn',family_meeting_done:'warn',engaged:'ok',married:'ok',rejected:'danger',on_hold:'gray'};return `<span class="badge ${map[s]||'gray'}">${esc(s||'—').replace(/_/g,' ')}</span>`}

function buildModals(){
  const field=(id,label,type='text',full='')=>`<div class="field ${full}"><label>${label}</label><input class="input" id="${id}" type="${type}"></div>`,
        area=(id,label)=>`<div class="field full"><label>${label}</label><textarea class="input" id="${id}" rows="3"></textarea></div>`,
        sel=(id,label,opts)=>`<div class="field"><label>${label}</label><select class="input" id="${id}">${opts}</select></div>`,
        box=(id,title,body,save)=>`<div class="modal-bg" id="${id}"><div class="modal"><h2>${title}</h2>${body}<div class="modal-actions"><button class="btn sec" onclick="modal('${id}',false)">Cancel</button><button class="btn" onclick="${save}()">Save</button></div></div></div>`;
  const status='<option>active</option><option>inactive</option><option>matched</option><option>hidden</option>';
  const memPlans='<option value="free">Free</option><option value="silver">Silver</option><option value="gold">Gold</option><option value="platinum">Platinum</option>';
  $('modals').innerHTML=
    box('profileModal','Profile',`<input type="hidden" id="pId"><div class="form-grid">
      ${sel('pType','Profile type *','<option value="bride">Bride</option><option value="groom">Groom</option>')}
      ${field('pName','Full name *')}
      ${field('pDob','Date of birth','date')}
      ${field('pReligion','Religion')}
      ${field('pCaste','Caste')}
      ${field('pSubCaste','Sub-caste')}
      ${field('pMother','Mother tongue')}
      ${field('pHeight','Height (cm)','number')}
      ${field('pComplexion','Complexion')}
      ${field('pEducation','Education')}
      ${field('pOccupation','Occupation')}
      ${field('pIncome','Annual income')}
      ${field('pCity','City')}
      ${field('pState','State')}
      ${field('pCountry','Country')}
      ${sel('pFamilyType','Family type','<option value="">—</option><option value="nuclear">Nuclear</option><option value="joint">Joint</option>')}
      ${field('pFatherName','Father name')}
      ${field('pFatherOcc','Father occupation')}
      ${field('pMotherName','Mother name')}
      ${field('pMotherOcc','Mother occupation')}
      ${field('pSiblings','Siblings')}
      ${field('pStar','Horoscope star')}
      ${field('pRashi','Horoscope rashi')}
      ${sel('pManglik','Manglik','<option value="">—</option><option value="yes">Yes</option><option value="no">No</option><option value="partial">Partial</option>')}
      ${area('pHoroscope','Horoscope notes')}
      ${area('pAbout','About')}
      ${field('pPhoto','Photo URL','url','full')}
      ${field('pPhoto2','Photo 2 URL','url','full')}
      ${field('pPhoto3','Photo 3 URL','url','full')}
      ${field('pBiodata','Biodata PDF URL','url','full')}
      ${sel('pPlan','Membership plan',memPlans)}
      ${field('pExpiry','Membership expiry','date')}
      ${sel('pStatus','Status',status)}
    </div>`,'saveProfile')+
    box('matchModal','Match Record',`<input type="hidden" id="mId"><div class="form-grid">
      ${sel('mProfile1','Profile 1 *','<option value="">Select…</option>')}
      ${sel('mProfile2','Profile 2 *','<option value="">Select…</option>')}
      ${field('mScore','Compatibility score (0–100)','number')}
      ${sel('mStatus','Status','<option value="suggested">Suggested</option><option value="interest_sent">Interest Sent</option><option value="mutual">Mutual Interest</option><option value="family_meeting_arranged">Meeting Arranged</option><option value="family_meeting_done">Meeting Done</option><option value="engaged">Engaged</option><option value="married">Married</option><option value="rejected">Rejected</option><option value="on_hold">On Hold</option>')}
      ${field('mMeetingDate','Family meeting date','date')}
      ${field('mMeetingVenue','Meeting venue')}
      ${area('mNotes','Notes')}
      ${area('mOutcome','Outcome notes')}
    </div>`,'saveMatch')+
    box('shortlistModal','Shortlist Entry',`<input type="hidden" id="slId"><div class="form-grid">
      ${sel('slProfile','Profile *','<option value="">Select…</option>')}
      ${sel('slTarget','Shortlisted profile *','<option value="">Select…</option>')}
      ${area('slNotes','Notes')}
    </div>`,'saveShortlist')+
    box('storyModal','Success Story',`<input type="hidden" id="stId"><div class="form-grid">
      ${field('stBride','Bride name *')}
      ${field('stGroom','Groom name *')}
      ${field('stDate','Wedding date','date')}
      ${field('stPhoto','Photo URL','url','full')}
      ${area('stTestimonial','Testimonial')}
      <div class="field"><label><label class="toggle"><input type="checkbox" id="stFeatured"> Feature on overview</label></label></div>
    </div>`,'saveStory');
  document.querySelectorAll('.modal-bg').forEach(m=>m.onclick=e=>{if(e.target===m)modal(m.id,false)});
}

async function loadAll(){
  const [p,m,sl,st,se]=await Promise.all([
    api('/matrimonial/profiles'),
    api('/matrimonial/matches'),
    api('/matrimonial/shortlists'),
    api('/matrimonial/stories'),
    api('/matrimonial/settings')
  ]);
  profiles=p.list||[];matches=m.list||[];shortlists=sl.list||[];stories=st.list||[];settings=se;
  fillSelects();renderAll();
}

function fillSelects(){
  const opts='<option value="">Select profile…</option>'+profiles.map(p=>`<option value="${p.id}">${esc(p.full_name)} (${p.profile_type})</option>`).join('');
  [$('mProfile1'),$('mProfile2'),$('slProfile'),$('slTarget')].forEach(el=>{if(el)el.innerHTML=opts});
}

function renderAll(){renderOverview();renderProfiles();renderMatches();renderShortlists();renderStories();}

function renderOverview(){
  const brides=profiles.filter(p=>p.profile_type==='bride').length;
  const grooms=profiles.filter(p=>p.profile_type==='groom').length;
  const active=matches.filter(m=>!['rejected','married'].includes(m.status)).length;
  const married=matches.filter(m=>m.status==='married').length;
  const premium=profiles.filter(p=>p.membership_plan&&p.membership_plan!=='free').length;
  $('stats').innerHTML=[
    ['Total Profiles',profiles.length],['Brides',brides],['Grooms',grooms],
    ['Active Matches',active],['Married',married],['Premium Members',premium]
  ].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  const recent=profiles.slice(-5).reverse();
  $('recentProfiles').innerHTML=recent.length?recent.map(p=>`<div style="padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center">
    <div style="font-size:24px">${p.profile_type==='bride'?'👰':'🤵'}</div>
    <div><b>${esc(p.full_name)}</b><div class="hint">${esc(p.city||'—')} · ${planBadge(p.membership_plan)}</div></div>
  </div>`).join(''):'<div class="empty">No profiles yet.</div>';
  const recentM=matches.slice(-5).reverse();
  $('recentMatches').innerHTML=recentM.length?recentM.map(m=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(profileName(m.profile_id_1))}</b> ↔ <b>${esc(profileName(m.profile_id_2))}</b><div class="hint">${statusBadge(m.status)}</div></div>`).join(''):'<div class="empty">No matches yet.</div>';
  const checks=[[profiles.length>0,'Profiles added'],[matches.length>0,'Matches recorded'],[stories.length>0,'Success stories added'],[settings.horoscope_matching_enabled,'Horoscope matching enabled']];
  $('readiness').innerHTML=checks.map(x=>`<p>${x[0]?'✅':'⚠️'} ${x[1]}</p>`).join('');
}

function renderProfiles(){
  const q=($('profileSearch').value||'').toLowerCase();
  const type=$('filterType').value;
  const plan=$('filterPlan').value;
  let rows=profiles.filter(p=>{
    if(type && p.profile_type!==type) return false;
    if(plan && p.membership_plan!==plan) return false;
    if(q && ![p.full_name,p.city,p.education,p.occupation].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
  $('profileGrid').innerHTML=rows.length?rows.map(p=>`
    <div class="profile-card" onclick="openProfile(${p.id})">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px">
        ${p.photo_url?`<img src="${esc(p.photo_url)}" class="profile-photo" onerror="this.style.display='none'">`:`<div class="profile-photo">${p.profile_type==='bride'?'👰':'🤵'}</div>`}
        <div><b>${esc(p.full_name)}</b><div class="hint">${p.profile_type==='bride'?'Bride':'Groom'} · ${esc(p.city||'—')}</div></div>
      </div>
      <div class="hint">${esc(p.religion||'—')} · ${esc(p.caste||'—')}</div>
      <div class="hint">${esc(p.education||'—')} · ${esc(p.occupation||'—')}</div>
      <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center">
        ${planBadge(p.membership_plan)}
        <span class="badge ${p.status==='active'?'ok':p.status==='matched'?'warn':'gray'}">${esc(p.status)}</span>
      </div>
      <div style="margin-top:8px;display:flex;gap:6px">
        <button class="btn sm sec" onclick="event.stopPropagation();openProfile(${p.id})">Edit</button>
        <button class="btn sm danger" onclick="event.stopPropagation();removeRow('/matrimonial/profiles',${p.id})">Delete</button>
      </div>
    </div>`).join(''):'<div class="empty" style="grid-column:1/-1">No profiles found. Add the first profile!</div>';
}

function renderMatches(){
  const s=$('filterMatchStatus').value;
  const rows=matches.filter(m=>!s||m.status===s);
  $('matchRows').innerHTML=rows.length?rows.map(m=>`<tr>
    <td><b>${esc(profileName(m.profile_id_1))}</b></td>
    <td><b>${esc(profileName(m.profile_id_2))}</b></td>
    <td>${m.match_score??'—'}</td>
    <td>${statusBadge(m.status)}</td>
    <td>${m.family_meeting_date?`${esc(m.family_meeting_date)}<div class="hint">${esc(m.family_meeting_venue||'')}</div>`:'—'}</td>
    <td class="hint">${esc(m.notes||'—')}</td>
    <td><div class="row-actions"><button class="btn sm sec" onclick="openMatch(${m.id})">Edit</button><button class="btn sm danger" onclick="removeRow('/matrimonial/matches',${m.id})">Delete</button></div></td>
  </tr>`).join(''):`<tr><td colspan="7" class="empty">No match records.</td></tr>`;
}

function renderShortlists(){
  $('shortlistRows').innerHTML=shortlists.length?shortlists.map(s=>`<tr>
    <td>${esc(profileName(s.profile_id))}</td>
    <td>${esc(profileName(s.shortlisted_profile_id))}</td>
    <td class="hint">${esc(s.notes||'—')}</td>
    <td class="hint">${s.created_at?s.created_at.slice(0,10):'—'}</td>
    <td><button class="btn sm danger" onclick="removeRow('/matrimonial/shortlists',${s.id})">Remove</button></td>
  </tr>`).join(''):`<tr><td colspan="5" class="empty">No shortlists.</td></tr>`;
}

function renderStories(){
  $('storyGrid').innerHTML=stories.length?stories.map(s=>`
    <div class="story-card">
      ${s.photo_url?`<img src="${esc(s.photo_url)}" class="story-photo" onerror="this.style.display='none'">`:`<div class="story-photo" style="display:flex;align-items:center;justify-content:center;font-size:32px">💍</div>`}
      <b>${esc(s.bride_name)} &amp; ${esc(s.groom_name)}</b>
      ${s.wedding_date?`<div class="hint">${esc(s.wedding_date)}</div>`:''}
      ${s.testimonial?`<p style="font-size:12px;color:var(--muted);font-style:italic;margin:8px 0">"${esc(s.testimonial)}"</p>`:''}
      ${s.featured?'<span class="badge ok">Featured</span>':''}
      <div style="margin-top:8px;display:flex;gap:6px;justify-content:center">
        <button class="btn sm sec" onclick="openStory(${s.id})">Edit</button>
        <button class="btn sm danger" onclick="removeRow('/matrimonial/stories',${s.id})">Delete</button>
      </div>
    </div>`).join(''):'<div class="empty" style="grid-column:1/-1">No success stories yet.</div>';
}

function renderSettings(){
  $('setServiceName').value=settings.service_name||'';
  $('setPrivacyNote').value=settings.privacy_note||'';
  try{$('setMembershipPlans').value=settings.membership_plans?JSON.stringify(JSON.parse(settings.membership_plans),null,2):'{}';}catch(e){$('setMembershipPlans').value='{}';}
  $('setHoroscopeEnabled').checked=!!settings.horoscope_matching_enabled;
  $('setAutoSuggest').checked=settings.auto_suggest_matches!==0;
}

function sv(id){return $(id)?.value?.trim()||''}
function openProfile(id){
  const p=profiles.find(x=>+x.id===+id)||{};
  $('pId').value=p.id||'';
  const map={pType:'profile_type',pName:'full_name',pDob:'date_of_birth',pReligion:'religion',pCaste:'caste',pSubCaste:'sub_caste',pMother:'mother_tongue',pHeight:'height_cm',pComplexion:'complexion',pEducation:'education',pOccupation:'occupation',pIncome:'annual_income',pCity:'city',pState:'state',pCountry:'country',pFamilyType:'family_type',pFatherName:'father_name',pFatherOcc:'father_occupation',pMotherName:'mother_name',pMotherOcc:'mother_occupation',pSiblings:'siblings',pStar:'horoscope_star',pRashi:'horoscope_rashi',pManglik:'manglik',pHoroscope:'horoscope_notes',pAbout:'about',pPhoto:'photo_url',pPhoto2:'photo_url_2',pPhoto3:'photo_url_3',pBiodata:'biodata_pdf_url',pPlan:'membership_plan',pExpiry:'membership_expiry',pStatus:'status'};
  Object.entries(map).forEach(([el,key])=>{const e=$(el);if(e)e.value=p[key]??''});
  if(!id){$('pCountry').value='India';$('pPlan').value='free';$('pStatus').value='active';}
  modal('profileModal');
}
async function saveProfile(){
  const b={id:$('pId').value||undefined,profile_type:sv('pType'),full_name:sv('pName'),date_of_birth:sv('pDob')||null,religion:sv('pReligion'),caste:sv('pCaste'),sub_caste:sv('pSubCaste'),mother_tongue:sv('pMother'),height_cm:+sv('pHeight')||null,complexion:sv('pComplexion'),education:sv('pEducation'),occupation:sv('pOccupation'),annual_income:sv('pIncome'),city:sv('pCity'),state:sv('pState'),country:sv('pCountry'),family_type:sv('pFamilyType'),father_name:sv('pFatherName'),father_occupation:sv('pFatherOcc'),mother_name:sv('pMotherName'),mother_occupation:sv('pMotherOcc'),siblings:sv('pSiblings'),horoscope_star:sv('pStar'),horoscope_rashi:sv('pRashi'),manglik:sv('pManglik'),horoscope_notes:sv('pHoroscope'),about:sv('pAbout'),photo_url:sv('pPhoto'),photo_url_2:sv('pPhoto2'),photo_url_3:sv('pPhoto3'),biodata_pdf_url:sv('pBiodata'),membership_plan:sv('pPlan'),membership_expiry:sv('pExpiry')||null,status:sv('pStatus')};
  if(!b.profile_type||!b.full_name)return alert('Profile type and full name are required');
  await save('/matrimonial/profiles',b,'profileModal');
}

function openMatch(id){
  const m=matches.find(x=>+x.id===+id)||{};
  $('mId').value=m.id||'';
  $('mProfile1').value=m.profile_id_1||'';$('mProfile2').value=m.profile_id_2||'';
  $('mScore').value=m.match_score??'';$('mStatus').value=m.status||'suggested';
  $('mMeetingDate').value=m.family_meeting_date||'';$('mMeetingVenue').value=m.family_meeting_venue||'';
  $('mNotes').value=m.notes||'';$('mOutcome').value=m.outcome_notes||'';
  modal('matchModal');
}
async function saveMatch(){
  const b={id:$('mId').value||undefined,profile_id_1:+$('mProfile1').value,profile_id_2:+$('mProfile2').value,match_score:+$('mScore').value||0,status:$('mStatus').value,family_meeting_date:$('mMeetingDate').value||null,family_meeting_venue:$('mMeetingVenue').value.trim(),notes:$('mNotes').value.trim(),outcome_notes:$('mOutcome').value.trim()};
  if(!b.profile_id_1||!b.profile_id_2)return alert('Both profiles are required');
  await save('/matrimonial/matches',b,'matchModal');
}

function openShortlist(){
  $('slId').value='';$('slProfile').value='';$('slTarget').value='';$('slNotes').value='';
  modal('shortlistModal');
}
async function saveShortlist(){
  const b={id:$('slId').value||undefined,profile_id:+$('slProfile').value,shortlisted_profile_id:+$('slTarget').value,notes:$('slNotes').value.trim()};
  if(!b.profile_id||!b.shortlisted_profile_id)return alert('Both profiles are required');
  await save('/matrimonial/shortlists',b,'shortlistModal');
}

function openStory(id){
  const s=stories.find(x=>+x.id===+id)||{};
  $('stId').value=s.id||'';$('stBride').value=s.bride_name||'';$('stGroom').value=s.groom_name||'';
  $('stDate').value=s.wedding_date||'';$('stPhoto').value=s.photo_url||'';
  $('stTestimonial').value=s.testimonial||'';$('stFeatured').checked=!!s.featured;
  modal('storyModal');
}
async function saveStory(){
  const b={id:$('stId').value||undefined,bride_name:$('stBride').value.trim(),groom_name:$('stGroom').value.trim(),wedding_date:$('stDate').value||null,photo_url:$('stPhoto').value.trim(),testimonial:$('stTestimonial').value.trim(),featured:$('stFeatured').checked?1:0};
  if(!b.bride_name||!b.groom_name)return alert('Bride and groom names are required');
  await save('/matrimonial/stories',b,'storyModal');
}

async function save(path,b,modalId){await api(path,{method:b.id?'PATCH':'POST',body:JSON.stringify(b)});modal(modalId,false);await loadAll()}
async function removeRow(path,id){window.event?.stopPropagation?.();if(!confirm('Delete this record?'))return;await api(path,{method:'DELETE',body:JSON.stringify({id})});await loadAll()}

async function saveSettings(){
  let plans={};try{plans=JSON.parse($('setMembershipPlans').value||'{}')}catch(e){return alert('Membership plans must be valid JSON')}
  try{
    await api('/matrimonial/settings',{method:'PATCH',body:JSON.stringify({service_name:sv('setServiceName'),privacy_note:sv('setPrivacyNote'),membership_plans:JSON.stringify(plans),horoscope_matching_enabled:$('setHoroscopeEnabled').checked,auto_suggest_matches:$('setAutoSuggest').checked})});
    const msg=$('setMsg');msg.textContent='✓ Saved';setTimeout(()=>msg.textContent='',3000);
    await loadAll();
  }catch(e){alert(e.message)}
}

async function init(){
  if(!clientId||!token){document.body.innerHTML='<div style="text-align:center;padding:60px;color:#be185d">Open Matrimonial from the Leadvyne dashboard.</div>';return}
  buildModals();
  try{await loadAll()}catch(e){alert('Failed to load: '+e.message)}
}
init();
</script></body></html>
