# DDoS protection (SETUP.md "DDoS protection") — per-IP request limiting at this origin, as a
# backstop behind Cloudflare's edge. 20r/s with a 40-request burst is far above normal browser use.
limit_req_zone $binary_remote_addr zone=frontend_rl:10m rate=20r/s;
limit_req_status 429;

# HTML is revalidated on every load (ETag → 304 when unchanged) so a deploy shows up right away —
# without a Cache-Control header browsers heuristically cache pages like the embedded ecom.html
# iframe and keep serving the old copy. Assets keep the default caching.
map $sent_http_content_type $html_expires {
    ~*text/html epoch;
    default     off;
}

server {
    listen 80;
    server_name leadvyne.com www.leadvyne.com;
    root /usr/share/nginx/html;
    limit_req zone=frontend_rl burst=40 nodelay;
    expires $html_expires;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https://secure.leadvyne.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self), payment=()" always;

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name app.leadvyne.com;
    root /usr/share/nginx/html;
    limit_req zone=frontend_rl burst=40 nodelay;
    expires $html_expires;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https://secure.leadvyne.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self), payment=()" always;

    location / {
        try_files $uri $uri/ /dashboard.html;
    }

    location = /index.html {
        return 301 https://leadvyne.com/;
    }

    location = /onboard {
        try_files /index.html =404;
    }
}

server {
    listen 80;
    server_name onshope.com www.onshope.com;
    root /usr/share/nginx/html;
    limit_req zone=frontend_rl burst=40 nodelay;
    expires $html_expires;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https://secure.leadvyne.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self), payment=()" always;

    location = / {
        try_files /onshope-home.html =404;
    }

    location / {
        try_files $uri $uri/ @store;
    }

    location @store {
        rewrite ^/([a-zA-Z0-9_-]+)/?$ /onshope-store.html?slug=$1 last;
    }
}
