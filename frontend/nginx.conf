# DDoS protection (SETUP.md "DDoS protection") — per-IP request limiting at this origin, as a
# backstop behind Cloudflare's edge. 20r/s with a 40-request burst is far above normal browser use.
limit_req_zone $binary_remote_addr zone=frontend_rl:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name leadvyne.com www.leadvyne.com;
    root /usr/share/nginx/html;
    limit_req zone=frontend_rl burst=40 nodelay;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https://secure.leadvyne.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name app.leadvyne.com;
    root /usr/share/nginx/html;
    limit_req zone=frontend_rl burst=40 nodelay;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https://secure.leadvyne.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # Keep the existing Live Agency page intact and inject the POOMAS extension at serve time.
    # This makes POOMAS an optional client-level capability without duplicating the large module.
    location = /live-travel-agency.html {
        sub_filter '</body>' '<script src="/live-travel-poomas.js"></script></body>';
        sub_filter_once on;
        try_files /live-travel-agency.html =404;
    }

    location / {
        try_files $uri $uri/ /dashboard.html;
    }

    location = /index.html {
        return 301 https://leadvyne.com/;
    }

    location = /onboard {
        try_files /index.html =404;
    }
}

server {
    listen 80;
    server_name onshope.com www.onshope.com;
    root /usr/share/nginx/html;
    limit_req zone=frontend_rl burst=40 nodelay;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https://secure.leadvyne.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    location = / {
        try_files /onshope-home.html =404;
    }

    location / {
        try_files $uri $uri/ @store;
    }

    location @store {
        rewrite ^/([a-zA-Z0-9_-]+)/?$ /onshope-store.html?slug=$1 last;
    }
}
