# DDoS protection (SETUP.md "DDoS protection") — per-IP request limiting at this origin, as a
# backstop behind Cloudflare's edge (see SETUP.md for the dashboard-level steps: proxying these
# domains through Cloudflare, WAF, Bot Fight Mode). 20r/s with a 40-request burst is far above
# what a real visitor's browser generates loading a page (a handful of requests, not sustained
# per-second traffic) — this only kicks in under an actual flood. nodelay serves the burst
# immediately instead of queueing/delaying it, so it's invisible to normal users; excess requests
# get a fast 429 instead of being silently dropped or hanging the connection.
limit_req_zone $binary_remote_addr zone=frontend_rl:10m rate=20r/s;
limit_req_status 429;

# Security headers, shared by every server block below.
#
# CSP notes: no build step means every script/style is inline ('unsafe-inline' on both is
# unavoidable without a nonce/hash pipeline this app doesn't have). style-src/font-src also allow
# Google Fonts specifically (fonts.googleapis.com/fonts.gstatic.com) — most pages link a Google
# Fonts stylesheet directly rather than self-hosting, so this is a fixed, known pair of hosts
# worth naming explicitly rather than folding into the broad https: allowance below.
# connect-src/img-src allow any https: origin (rather than a fixed allowlist) because API bases
# are per-tenant config (each client's own Chatwoot/NocoDB/etc. base URL, entered in Settings),
# not fixed hosts we can enumerate here. frame-ancestors is locked to 'self' since the app is
# never itself embedded
# elsewhere. frame-src is 'self' plus the Authentik host specifically: same-origin covers this
# app's own module iframes (ecom.html, saas-ops.html, b2b.html, accounting.html), and Authentik is
# the one legitimate cross-origin frame — dashboard.html's trySilentAuthentikLogin() loads a
# prompt=none Authentik request in a hidden iframe (auth-silent.html) to check for an existing
# Authentik session without showing the interactive login screen. object-src/base-uri/form-action
# are locked down since nothing in the app needs plugins, a non-default <base>, or cross-origin
# form posts.
# TLS/HSTS is left to Cloudflare, which terminates it in front of this plain-HTTP origin.
#
# nginx has no config-level constant/include-string primitive worth reaching for here, so the
# same literal value is repeated in each server block below rather than built via a map hack.

server {
    listen 80;
    server_name leadvyne.com www.leadvyne.com;
    root /usr/share/nginx/html;
    limit_req zone=frontend_rl burst=40 nodelay;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https://secure.leadvyne.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # Real static files (privacy.html, terms.html, etc.) resolve normally; everything
    # else falls back to the landing page.
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name app.leadvyne.com;
    root /usr/share/nginx/html;
    limit_req zone=frontend_rl burst=40 nodelay;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https://secure.leadvyne.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    location / {
        try_files $uri $uri/ /dashboard.html;
    }

    # Block access to index.html on app subdomain
    location = /index.html {
        return 301 https://leadvyne.com/;
    }

    # Onboard signup form
    location = /onboard {
        try_files /index.html =404;
    }
}

server {
    listen 80;
    server_name onshope.com www.onshope.com;
    root /usr/share/nginx/html;
    limit_req zone=frontend_rl burst=40 nodelay;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https://secure.leadvyne.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    location = / {
        try_files /onshope-home.html =404;
    }

    # Real static files (favicon, etc.) still resolve normally — only bare single-segment
    # paths like /vintage1950 fall through to the slug rewrite below.
    location / {
        try_files $uri $uri/ @store;
    }

    # /<slug> -> onshope-store.html?slug=<slug>. This is the only URL shape a client's store
    # link ever has on this domain — deliberately not reusing saasapp's own store.html or its
    # ?client=<id> convention (see frontend/onshope-store.html's header comment).
    location @store {
        rewrite ^/([a-zA-Z0-9_-]+)/?$ /onshope-store.html?slug=$1 last;
    }
}
