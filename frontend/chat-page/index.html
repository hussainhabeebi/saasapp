<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#0D9C93;
  --brand-dark:#0b8880;
  --bg:#f5f7f9;
  --surface:#fff;
  --text:#1a1a1a;
  --muted:#6b7280;
  --line:#e5e7eb;
  --bubble-user-bg:var(--brand);
  --bubble-user-text:#fff;
  --bubble-bot-bg:#fff;
  --bubble-bot-text:#1a1a1a;
  --radius:18px;
  --shadow:0 2px 16px rgba(0,0,0,.10);
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text)}

/* ── layout ── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;background:var(--surface);box-shadow:var(--shadow)}

/* header */
#header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0;min-height:64px}
#avatar{width:40px;height:40px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;flex-shrink:0}
#headerText{flex:1;min-width:0}
#headerName{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#headerSub{font-size:12px;color:var(--muted);margin-top:1px}
#statusDot{width:9px;height:9px;border-radius:50%;background:#22c55e;flex-shrink:0}

/* messages */
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
#msgs::-webkit-scrollbar{width:4px}
#msgs::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* bubble */
.msg{display:flex;flex-direction:column;max-width:80%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.bot {align-self:flex-start;align-items:flex-start}
.bubble{padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--bubble-user-bg);color:var(--bubble-user-text);border-bottom-right-radius:4px}
.msg.bot  .bubble{background:var(--bg);color:var(--bubble-bot-text);border-bottom-left-radius:4px;border:1px solid var(--line)}
.ts{font-size:11px;color:var(--muted);margin-top:3px;padding:0 4px}

/* typing indicator */
.typing-dots{display:flex;gap:4px;padding:10px 14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);border-bottom-left-radius:4px;align-self:flex-start}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* input bar */
#bar{display:flex;align-items:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);flex-shrink:0}
#inp{flex:1;border:1px solid var(--line);border-radius:22px;padding:10px 16px;font-size:14px;font-family:inherit;outline:none;resize:none;max-height:120px;line-height:1.4;transition:border-color .15s}
#inp:focus{border-color:var(--brand)}
#sendBtn{width:40px;height:40px;border-radius:50%;background:var(--brand);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;margin-bottom:1px}
#sendBtn:hover{background:var(--brand-dark)}
#sendBtn:disabled{opacity:.5;cursor:not-allowed}
#sendBtn svg{fill:#fff;width:18px;height:18px}

/* error / not found states */
#notFound{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;text-align:center;padding:32px;color:var(--muted)}
#notFound .icon{font-size:48px}
#notFound p{font-size:14px}

/* loading skeleton */
#loadingShell{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:8px;color:var(--muted);font-size:14px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="header" style="display:none">
    <div id="avatar">L</div>
    <div id="headerText">
      <div id="headerName">Chat</div>
      <div id="headerSub">Online</div>
    </div>
    <div id="statusDot"></div>
  </div>

  <div id="loadingShell"><div class="spin"></div><span>Loading…</span></div>

  <div id="notFound">
    <div class="icon">🔗</div>
    <p>This chat link is invalid or has expired.<br>Please contact the business for a new link.</p>
  </div>

  <div id="msgs" style="display:none"></div>

  <div id="bar" style="display:none">
    <textarea id="inp" rows="1" placeholder="Type a message…" autocomplete="off" spellcheck="true"></textarea>
    <button id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const WORKER='https://leadvyne-api-proxy.leadvyne.workers.dev';

// ── helpers ──
const $=id=>document.getElementById(id);
function uuid(){return([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))}
function fmtTime(iso){const d=new Date(iso);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}

// ── state ──
const params=new URLSearchParams(location.search);
const token=params.get('t')||'';
const LS_SID='lv_chat_sid_'+token;
let sessionId=localStorage.getItem(LS_SID)||(()=>{const s=uuid();localStorage.setItem(LS_SID,s);return s;})();
let brand={brand_color:'#0D9C93'};
let busy=false;

// ── apply brand color ──
function applyColor(hex){
  document.documentElement.style.setProperty('--brand',hex);
  document.documentElement.style.setProperty('--brand-dark',hex);
  document.documentElement.style.setProperty('--bubble-user-bg',hex);
}

// ── render a message bubble ──
function addBubble(role, text, ts, prepend=false){
  const wrap=document.createElement('div');
  wrap.className='msg '+role;
  const bubble=document.createElement('div');
  bubble.className='bubble';
  bubble.textContent=text;
  const time=document.createElement('div');
  time.className='ts';
  time.textContent=fmtTime(ts||new Date().toISOString());
  wrap.appendChild(bubble);
  wrap.appendChild(time);
  const msgs=$('msgs');
  if(prepend) msgs.insertBefore(wrap, msgs.firstChild);
  else msgs.appendChild(wrap);
  return wrap;
}

// ── typing indicator ──
let typingEl=null;
function showTyping(){
  if(typingEl) return;
  typingEl=document.createElement('div');
  typingEl.className='typing-dots';
  typingEl.innerHTML='<span></span><span></span><span></span>';
  $('msgs').appendChild(typingEl);
  scrollBottom();
}
function hideTyping(){if(typingEl){typingEl.remove();typingEl=null;}}

function scrollBottom(){const m=$('msgs');m.scrollTop=m.scrollHeight;}

// ── show UI ──
function showChat(){
  $('loadingShell').style.display='none';
  $('header').style.display='flex';
  $('msgs').style.display='flex';
  $('bar').style.display='flex';
}

function showNotFound(){
  $('loadingShell').style.display='none';
  $('notFound').style.display='flex';
}

// ── load config + history ──
async function init(){
  if(!token){showNotFound();return;}
  try{
    const [cfgRes, histRes]=await Promise.all([
      fetch(`${WORKER}/public/chat/config?t=${encodeURIComponent(token)}`),
      fetch(`${WORKER}/public/chat/history?t=${encodeURIComponent(token)}&s=${encodeURIComponent(sessionId)}`)
    ]);
    if(!cfgRes.ok){showNotFound();return;}
    const cfg=await cfgRes.json();
    brand=cfg;
    if(cfg.brand_color) applyColor(cfg.brand_color);
    $('headerName').textContent=cfg.client_name||'Chat';
    const initials=(cfg.client_name||'L').trim().slice(0,1).toUpperCase();
    $('avatar').textContent=initials;
    showChat();

    const hist=histRes.ok?await histRes.json():{messages:[]};
    const msgs=hist.messages||[];
    if(msgs.length){
      msgs.forEach(m=>addBubble(m.role==='user'?'user':'bot', m.content, m.created_at));
      scrollBottom();
    } else {
      // Show greeting as first bot message
      addBubble('bot', cfg.greeting||'Hi! How can I help you today? 👋', new Date().toISOString());
    }
  }catch(e){showNotFound();}
}

// ── send message ──
async function send(){
  const inp=$('inp');
  const text=inp.value.trim();
  if(!text||busy) return;
  busy=true;
  $('sendBtn').disabled=true;
  inp.value='';
  autoResize(inp);

  addBubble('user', text, new Date().toISOString());
  scrollBottom();
  showTyping();
  scrollBottom();

  try{
    const r=await fetch(`${WORKER}/public/chat/message`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token, session_id:sessionId, message:text})
    });
    const d=await r.json().catch(()=>({}));
    hideTyping();
    addBubble('bot', d.reply||"Sorry, I couldn't process that. Please try again.", new Date().toISOString());
  }catch(e){
    hideTyping();
    addBubble('bot', "Connection error. Please try again.", new Date().toISOString());
  }

  scrollBottom();
  busy=false;
  $('sendBtn').disabled=false;
  inp.focus();
}

// ── input events ──
const inp=$('inp');
inp.addEventListener('input',()=>autoResize(inp));
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
$('sendBtn').addEventListener('click',send);

init();
</script>
</body>
</html>
