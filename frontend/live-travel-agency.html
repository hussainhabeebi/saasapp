<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Leadvyne · Live Travel Agency</title>
<meta name="theme-color" content="#073B4C">
<style>
:root{--navy:#073B4C;--navy2:#0B5368;--teal:#00A896;--cyan:#E8F8F6;--gold:#FFB703;--bg:#F4F7F9;--card:#fff;--ink:#102A35;--muted:#667E87;--line:#DDE7EB;--red:#C63C3C;--green:#138A62;--shadow:0 4px 18px rgba(7,59,76,.08)}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}
body{display:flex;flex-direction:column;overflow:hidden}.top{height:62px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 20px;gap:12px;flex:none}.brand{font-size:19px;font-weight:800}.brand i{font-style:normal;color:#67E8D5}.live{background:#E62E2E;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;letter-spacing:.05em}.back{margin-left:auto;color:#D7ECF2;border:1px solid #467383;background:transparent;border-radius:8px;padding:8px 12px}.shell{display:flex;flex:1;min-height:0}.side{width:225px;background:#fff;border-right:1px solid var(--line);padding:16px 10px;overflow:auto;flex:none}.nav{width:100%;border:0;background:transparent;border-radius:9px;padding:11px 12px;text-align:left;color:var(--muted);font-weight:650;margin:2px 0}.nav:hover{background:var(--bg)}.nav.active{background:var(--cyan);color:#05766B}.main{flex:1;overflow:auto;padding:22px}.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:18px}.pagehead h1{font-size:23px;margin:0}.pagehead p{color:var(--muted);margin:4px 0 0;font-size:13px}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:8px;font-weight:650}.btn:hover{box-shadow:var(--shadow)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger{color:var(--red)}.btn.sm{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stat{padding:16px}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--muted)}.card{padding:17px;margin-top:14px}.card h3{margin:0 0 13px;font-size:15px}.twocol{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:750;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px;color:var(--ink)}.field textarea{min-height:75px;resize:vertical}.span2{grid-column:span 2}.span4{grid-column:1/-1}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:760px}th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:11px;border-bottom:1px solid var(--line);background:#FAFCFD}td{padding:12px 11px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}tr:last-child td{border-bottom:0}.badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:800;background:#EEF3F5;color:#50666F}.badge.ok{background:#DDF6EB;color:var(--green)}.badge.warn{background:#FFF2CC;color:#8A5A00}.badge.bad{background:#FCE3E3;color:var(--red)}.notice{padding:11px 13px;background:#FFF7DE;border:1px solid #F5D87A;border-radius:9px;color:#705617;font-size:12.5px;margin:12px 0}.offer{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:10px}.offer h3{margin:0 0 4px;font-size:16px}.sub{color:var(--muted);font-size:12px}.price{text-align:right;font-size:20px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:45px 20px}.supplier{display:grid;grid-template-columns:1fr repeat(4,minmax(100px,140px)) auto;gap:10px;align-items:end;padding:14px 0;border-bottom:1px solid var(--line)}.supplier:last-child{border-bottom:0}.supplier strong{text-transform:capitalize}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#A9B8BD;margin-right:5px}.dot.ok{background:var(--green)}.modalback{display:none;position:fixed;inset:0;background:rgba(4,35,45,.55);z-index:100;align-items:center;justify-content:center;padding:18px}.modalback.show{display:flex}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.modalhd{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}.modalhd h2{font-size:17px;margin:0}.modalbody{padding:20px}.modalft{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}.error{background:#FCE3E3;color:var(--red);padding:10px;border-radius:8px;font-size:12px;margin-bottom:12px}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #BCD1D6;border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.side{width:70px}.nav{font-size:0;text-align:center}.nav::first-letter{font-size:20px}.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}.supplier{grid-template-columns:1fr 1fr}.main{padding:14px}.twocol{grid-template-columns:1fr}}
@media(max-width:520px){.brand{font-size:15px}.grid,.formgrid{grid-template-columns:1fr}.span2,.span4{grid-column:auto}.side{display:none}.offer{grid-template-columns:1fr}.price{text-align:left}.pagehead{align-items:flex-start}.actions{flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div class="brand">Leadvyne<i>.</i> Travel</div><span class="live">● LIVE AGENCY</span><button class="back" onclick="goLegacy()">← Existing Agency</button></header>
<div class="shell"><aside class="side" id="nav"></aside><main class="main" id="main"><div class="empty"><span class="spinner"></span><p>Loading Live Agency…</p></div></main></div>
<div class="modalback" id="modal"><div class="modal"><div class="modalhd"><h2 id="modalTitle"></h2></div><div class="modalbody" id="modalBody"></div><div class="modalft" id="modalFoot"></div></div></div>
<script>
const WORKER_BASE='https://leadvyne-api-proxy.leadvyne.workers.dev';
const qs=new URLSearchParams(location.search),clientId=qs.get('client')||'',sessionToken=qs.get('token')||'';
let page='dashboard',data={suppliers:[],poomas_settings:{enabled:false,checkout_base:'https://flypoomas.com'},searches:[],quotes:[],bookings:[],service_requests:[],wallet:[],wallet_entries:[],agents:[],commissions:[]},lastSearch=null;
const pages=[['dashboard','📊 Dashboard'],['search','🔎 Flight Search'],['quotes','📄 Quotes'],['bookings','🎫 Bookings'],['servicing','🔄 Servicing'],['wallet','💰 Wallet'],['agents','👥 Agents'],['suppliers','🔌 Suppliers']];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,c='AED')=>`${esc(c)} ${Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
function auth(extra={}){return {'Authorization':'Bearer '+sessionToken,'Content-Type':'application/json',...extra}}
async function api(path,opts={}){const r=await fetch(WORKER_BASE+path,{...opts,headers:auth(opts.headers||{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function goLegacy(){location.href=`travel-agency.html?client=${encodeURIComponent(clientId)}&token=${encodeURIComponent(sessionToken)}`}
function statusBadge(s){const ok=['complete','confirmed','ticketed','paid','accepted','approved','completed','configured'],bad=['failed','cancelled','rejected','expired','not_configured'];return `<span class="badge ${ok.includes(s)?'ok':bad.includes(s)?'bad':'warn'}">${esc(String(s||'—').replaceAll('_',' '))}</span>`}
function drawNav(){$('nav').innerHTML=pages.map(([k,l])=>`<button class="nav ${page===k?'active':''}" onclick="show('${k}')">${l}</button>`).join('')}
function head(title,sub,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`}
function show(k){page=k;drawNav();({dashboard:renderDashboard,search:renderSearch,quotes:renderQuotes,bookings:renderBookings,servicing:renderServicing,wallet:renderWallet,agents:renderAgents,suppliers:renderSuppliers}[k])()}
function renderDashboard(){
 const supplierReady=data.suppliers.filter(s=>s.enabled&&s.credentials_configured).length, revenue=data.bookings.reduce((a,b)=>a+Number(b.amount_paid||0),0),due=data.bookings.reduce((a,b)=>a+Number(b.balance_due||0),0);
 const poomasOn=data.poomas_settings?.enabled;
 $('main').innerHTML=head('Live Travel Dashboard','Real-time supplier search, booking and servicing operations')+`<div class="grid"><div class="stat"><b>${data.searches.length}</b><span>Recent searches</span></div><div class="stat"><b>${data.bookings.length}</b><span>Bookings</span></div><div class="stat"><b>${money(revenue)}</b><span>Collected</span></div><div class="stat"><b>${money(due)}</b><span>Balance due</span></div></div><div class="twocol"><div class="card"><h3>Recent bookings</h3>${bookingTable(data.bookings.slice(0,7))}</div><div class="card"><h3>Supplier health</h3>${data.suppliers.map(s=>`<p><span class="dot ${s.credentials_configured||s.supplier==='poomas'?'ok':''}"></span><b style="text-transform:capitalize">${s.supplier}</b> · ${s.enabled?'Enabled':'Disabled'} · ${s.supplier==='poomas'?(poomasOn?'POOMAS checkout enabled':'Toggle on in Suppliers'):(s.credentials_configured?'Credentials ready':'Needs secrets')}</p>`).join('')}<div class="notice">${supplierReady} supplier${supplierReady===1?'':'s'} ready. SerpApi is comparison-only. POOMAS offers can be held and then completed via POOMAS checkout.</div></div></div>`;
}
function renderSearch(){
 $('main').innerHTML=head('Flight Search','Compare live Riya, TripJack, POOMAS and Google Flights results')+`<div class="card"><form class="formgrid" onsubmit="runSearch(event)"><div class="field"><label>Trip type</label><select id="tripType" onchange="toggleReturn()"><option value="round_trip">Round trip</option><option value="one_way">One way</option></select></div><div class="field"><label>Origin (IATA)</label><input id="origin" maxlength="3" placeholder="DXB" required></div><div class="field"><label>Destination (IATA)</label><input id="destination" maxlength="3" placeholder="DEL" required></div><div class="field"><label>Cabin</label><select id="cabin"><option value="economy">Economy</option><option value="premium_economy">Premium economy</option><option value="business">Business</option><option value="first">First</option></select></div><div class="field"><label>Departure</label><input id="departure" type="date" required></div><div class="field" id="returnField"><label>Return</label><input id="returnDate" type="date" required></div><div class="field"><label>Adults</label><input id="adults" type="number" min="1" max="9" value="1"></div><div class="field"><label>Children</label><input id="children" type="number" min="0" max="9" value="0"></div><div class="field"><label>Infants</label><input id="infants" type="number" min="0" max="9" value="0"></div><div class="field"><label>Currency</label><select id="currency"><option>AED</option><option>INR</option><option>USD</option><option>SAR</option><option>EUR</option></select></div><div class="field span2"><label>CRM Lead ID (optional)</label><input id="leadId" placeholder="Link this search to a lead"></div><div class="span4"><button class="btn primary" id="searchBtn">🔎 Search live fares</button></div></form></div><div id="results">${renderOffers(lastSearch?.offers||[])}</div>`;
}
function toggleReturn(){const one=$('tripType').value==='one_way';$('returnField').style.display=one?'none':'';$('returnDate').required=!one}
async function runSearch(e){e.preventDefault();const btn=$('searchBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Searching suppliers…';try{const payload={trip_type:$('tripType').value,origin:$('origin').value,destination:$('destination').value,departure_date:$('departure').value,return_date:$('returnDate').value,adults:$('adults').value,children:$('children').value,infants:$('infants').value,cabin:$('cabin').value,currency:$('currency').value,lead_id:$('leadId').value};lastSearch=await api('/live-travel/search',{method:'POST',body:JSON.stringify(payload)});$('results').innerHTML=renderOffers(lastSearch.offers);await refresh(false)}catch(err){$('results').innerHTML=`<div class="error">${esc(err.message)}</div>`}finally{btn.disabled=false;btn.textContent='🔎 Search live fares'}}
function offerActions(o){
  if(o.supplier==='poomas'){
    const checkoutUrl=o.checkout_url||(o.raw&&o.raw._checkout_url)||'';
    if(!o.bookable)return `<span class="badge warn">Indicative only</span>`;
    return `<button class="btn sm primary" onclick="quoteModal(${o.id})">Create quote</button>${checkoutUrl?`<a class="btn sm" href="${esc(checkoutUrl)}" target="_blank" rel="noopener">Checkout on POOMAS ↗</a>`:''}`;
  }
  if(o.bookable)return `<button class="btn sm" onclick="revalidate(${o.id})">✓ Revalidate</button><button class="btn sm primary" onclick="quoteModal(${o.id})">Create quote</button>`;
  return `<span class="badge warn">Comparison only</span>`;
}
function renderOffers(list){
  if(!list.length)return `<div class="empty">Search results will appear here.</div>`;
  const hasSerpapi=list.some(o=>o.supplier==='serpapi'), hasPoomas=list.some(o=>o.supplier==='poomas');
  let notice='Prices can change. Revalidate a Riya or TripJack fare immediately before booking.';
  if(hasSerpapi)notice+=' Google Flights/SerpApi offers are indicative only.';
  if(hasPoomas)notice+=' POOMAS offers can be held and checked out on the POOMAS platform.';
  return `<div class="notice">${notice}</div>${list.map(o=>`<div class="offer"><div><h3>${esc(o.airline_name||o.airline_code||'Flight')} <span class="badge ${o.supplier==='poomas'?'ok':''}">${esc(o.supplier)}</span></h3><div class="sub">${esc(o.flight_numbers||'Flight details from supplier')} · ${esc(o.cabin)} ${o.seats_left!=null?'· '+o.seats_left+' seats left':''}</div><div class="sub">Baggage and fare rules are saved with the offer.</div></div><div><div class="price">${money(o.total_amount,o.currency)}</div><div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-end">${offerActions(o)}</div></div></div>`).join('')}`;
}
async function revalidate(id){try{const d=await api('/live-travel/offers/revalidate',{method:'POST',body:JSON.stringify({offer_id:id})});alert(d.price_changed?'Fare revalidated. The price changed; review the new total.':'Fare and availability revalidated.');if(lastSearch){const f=lastSearch.offers.findIndex(o=>o.id===id);if(f>=0)lastSearch.offers[f]=d.offer;renderSearch()}}catch(e){alert(e.message)}}
function quoteModal(offerId){openModal('Create customer quote',`<div id="merr"></div><div class="formgrid"><div class="field span2"><label>Customer name</label><input id="qname" required></div><div class="field"><label>Phone</label><input id="qphone"></div><div class="field"><label>Email</label><input id="qemail" type="email"></div><div class="field"><label>Service fee</label><input id="qfee" type="number" min="0" value="0"></div><div class="field"><label>Discount</label><input id="qdiscount" type="number" min="0" value="0"></div><div class="field span2"><label>Valid until</label><input id="qvalid" type="datetime-local"></div><div class="field span4"><label>Notes</label><textarea id="qnotes"></textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createQuote(${offerId})">Create quote</button>`)}
async function createQuote(offerId){try{await api('/live-travel/quotes',{method:'POST',body:JSON.stringify({offer_id:offerId,customer_name:$('qname').value,customer_phone:$('qphone').value,customer_email:$('qemail').value,service_fee:$('qfee').value,discount:$('qdiscount').value,valid_until:$('qvalid').value?new Date($('qvalid').value).toISOString():null,notes:$('qnotes').value})});closeModal();await refresh();show('quotes')}catch(e){$('merr').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function renderQuotes(){$('main').innerHTML=head('Quotes','Create, share and convert live fare quotes')+`<div class="tablewrap"><table><thead><tr><th>Quote</th><th>Customer</th><th>Flight</th><th>Total</th><th>Valid until</th><th>Status</th><th></th></tr></thead><tbody>${data.quotes.map(q=>`<tr><td><b>${esc(q.quote_ref)}</b></td><td>${esc(q.customer_name||'—')}<div class="sub">${esc(q.customer_phone)}</div></td><td>${esc(q.airline_name||'—')}<div class="sub">${esc(q.flight_numbers||'')}</div></td><td>${money(q.total_amount,q.currency)}</td><td>${q.valid_until?new Date(q.valid_until).toLocaleString():'—'}</td><td>${statusBadge(q.status)}</td><td><button class="btn sm" onclick="shareQuote(${q.id})">WhatsApp</button> <button class="btn sm" onclick="printQuote(${q.id})">PDF</button> <button class="btn sm" onclick="setQuote(${q.id},'sent')">Mark sent</button> <button class="btn sm primary" onclick="bookingModal(${q.id})">Book</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">No quotes yet.</td></tr>`}</tbody></table></div>`}
function shareQuote(id){const q=data.quotes.find(x=>x.id===id);if(!q)return;const text=`Flight Quote ${q.quote_ref}\n${q.airline_name||''} ${q.flight_numbers||''}\nTotal: ${q.currency} ${Number(q.total_amount).toFixed(2)}\nValid until: ${q.valid_until?new Date(q.valid_until).toLocaleString():'subject to availability'}\nPrices are subject to supplier revalidation.`;const phone=String(q.customer_phone||'').replace(/\D/g,'');if(navigator.share)navigator.share({title:`Flight Quote ${q.quote_ref}`,text}).catch(()=>{});else window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank')}
function printQuote(id){const q=data.quotes.find(x=>x.id===id);if(!q)return;const w=window.open('','_blank');w.document.write(`<!doctype html><title>${esc(q.quote_ref)}</title><style>body{font:15px Arial;color:#123;padding:45px;max-width:760px;margin:auto}h1{color:#073B4C}.box{border:1px solid #ddd;border-radius:10px;padding:20px;margin:20px 0}.total{font-size:25px;font-weight:bold}small{color:#667}</style><h1>Leadvyne Travel</h1><p>Flight quotation <b>${esc(q.quote_ref)}</b></p><div class="box"><h2>${esc(q.airline_name||'Flight')} ${esc(q.flight_numbers||'')}</h2><p>Prepared for: ${esc(q.customer_name||'Customer')}</p><p class="total">${money(q.total_amount,q.currency)}</p><p>Valid until: ${q.valid_until?new Date(q.valid_until).toLocaleString():'Subject to availability'}</p></div><small>Fare and availability are subject to supplier revalidation before booking and payment.</small><script>print()<\/script>`);w.document.close()}
async function setQuote(id,status){try{await api('/live-travel/quotes',{method:'PATCH',body:JSON.stringify({id,status})});await refresh();show('quotes')}catch(e){alert(e.message)}}
function bookingModal(quoteId){openModal('Passenger & booking record',`<div id="merr"></div><p class="sub">Create the booking record after the selected fare has been revalidated. Add the lead passenger now; more passenger tools remain available in booking details.</p><div class="formgrid"><div class="field"><label>Type</label><select id="ptype"><option value="adult">Adult</option><option value="child">Child</option><option value="infant">Infant</option></select></div><div class="field"><label>Title</label><select id="ptitle"><option>Mr</option><option>Ms</option><option>Mrs</option><option>Master</option></select></div><div class="field"><label>First name</label><input id="pfirst"></div><div class="field"><label>Last name</label><input id="plast"></div><div class="field"><label>Date of birth</label><input id="pdob" type="date"></div><div class="field"><label>Nationality</label><input id="pnat"></div><div class="field"><label>Passport number</label><input id="ppass"></div><div class="field"><label>Passport expiry</label><input id="pexp" type="date"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createBooking(${quoteId})">Create booking</button>`)}
async function createBooking(quoteId){try{const passenger={passenger_type:$('ptype').value,title:$('ptitle').value,first_name:$('pfirst').value,last_name:$('plast').value,date_of_birth:$('pdob').value,nationality:$('pnat').value,passport_number:$('ppass').value,passport_expiry:$('pexp').value};await api('/live-travel/bookings',{method:'POST',body:JSON.stringify({quote_id:quoteId,passengers:[passenger]})});closeModal();await refresh();show('bookings')}catch(e){$('merr').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function bookingTable(list){return `<div class="tablewrap" style="margin:0"><table><thead><tr><th>Booking</th><th>Customer</th><th>PNR</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>${list.map(b=>`<tr><td><b>${esc(b.booking_ref)}</b><div class="sub">${esc(b.supplier)}</div></td><td>${esc(b.customer_name||'—')}</td><td>${esc(b.pnr||'Pending')}</td><td>${money(b.total_amount,b.currency)}</td><td>${statusBadge(b.payment_status)}<div class="sub">Due ${money(b.balance_due,b.currency)}</div></td><td>${statusBadge(b.status)}</td><td><button class="btn sm" onclick="bookingDetail(${b.id})">Open</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">No bookings yet.</td></tr>`}</tbody></table></div>`}
function renderBookings(){$('main').innerHTML=head('Bookings','PNR, tickets, payments and live supplier status')+bookingTable(data.bookings)}
function poomasBookingActions(b){
  const isPoomas=b.supplier==='poomas';
  if(!isPoomas)return `<button class="btn" onclick="bookingAction(${b.id},'sync')">Sync</button><button class="btn primary" onclick="bookingAction(${b.id},'${b.status==='draft'?'book':'ticket'}')">${b.status==='draft'?'Confirm booking':'Issue ticket'}</button>`;
  const holdBtn=b.status==='draft'?`<button class="btn primary" onclick="holdPoomas(${b.id})">🔒 Hold fare</button>`:'';
  const checkoutBtn=b.checkout_url?`<a class="btn primary" href="${esc(b.checkout_url)}" target="_blank" rel="noopener">Complete on POOMAS ↗</a>`:`<button class="btn primary" onclick="poomasCheckout(${b.id})">Complete on POOMAS ↗</button>`;
  const syncBtn=`<button class="btn" onclick="bookingAction(${b.id},'sync')">Sync status</button>`;
  return (b.status==='draft'?holdBtn:'')+checkoutBtn+syncBtn;
}
async function bookingDetail(id){try{const d=await api(`/live-travel/bookings?id=${id}`),b=d.booking;openModal(`${b.booking_ref} · ${b.pnr||'PNR pending'}`,`<div class="grid"><div class="stat"><b>${money(b.total_amount,b.currency)}</b><span>Total</span></div><div class="stat"><b>${money(b.amount_paid,b.currency)}</b><span>Paid</span></div><div class="stat"><b>${money(b.balance_due,b.currency)}</b><span>Due</span></div><div class="stat"><b>${esc(b.status)}</b><span>Status</span></div></div>${b.supplier==='poomas'&&b.hold_ref?`<div class="notice">POOMAS hold reference: <b>${esc(b.hold_ref)}</b>${b.hold_expires_at?' · Expires '+new Date(b.hold_expires_at).toLocaleString():''}</div>`:''}<div class="card"><h3>Passengers</h3>${d.passengers.map(p=>`<p><b>${esc(p.title)} ${esc(p.first_name)} ${esc(p.last_name)}</b> · ${esc(p.passenger_type)} · ${esc(p.passport_number||'Passport pending')}</p>`).join('')||'<p class="sub">No passenger saved.</p>'}</div><div class="card"><h3>Payments</h3>${d.payments.map(p=>`<p>${esc(p.payment_ref)} · ${money(p.amount,p.currency)} · ${esc(p.method)}</p>`).join('')||'<p class="sub">No payment received.</p>'}</div>`,`<button class="btn" onclick="passengerModal(${b.id})">Add passenger</button><button class="btn" onclick="paymentModal(${b.id})">Add payment</button><button class="btn" onclick="serviceModal(${b.id})">Service request</button>${poomasBookingActions(b)}<button class="btn" onclick="closeModal()">Close</button>`)}catch(e){alert(e.message)}}
async function holdPoomas(id){try{await api(`/live-travel/bookings/hold`,{method:'POST',body:JSON.stringify({booking_id:id})});closeModal();await refresh();bookingDetail(id)}catch(e){alert('Hold failed: '+e.message)}}
async function poomasCheckout(id){try{const d=await api(`/live-travel/bookings/book`,{method:'POST',body:JSON.stringify({booking_id:id})});if(d.checkout_url){window.open(d.checkout_url,'_blank')}else{alert('No checkout URL available. Enable POOMAS in Suppliers settings.')}}catch(e){alert(e.message)}}
function passengerModal(id){openModal('Add passenger',`<div id="merr"></div><div class="formgrid"><div class="field"><label>Type</label><select id="npType"><option value="adult">Adult</option><option value="child">Child</option><option value="infant">Infant</option></select></div><div class="field"><label>Title</label><input id="npTitle"></div><div class="field"><label>First name</label><input id="npFirst"></div><div class="field"><label>Last name</label><input id="npLast"></div><div class="field"><label>Date of birth</label><input id="npDob" type="date"></div><div class="field"><label>Nationality</label><input id="npNat"></div><div class="field"><label>Passport</label><input id="npPass"></div><div class="field"><label>Passport expiry</label><input id="npExp" type="date"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePassenger(${id})">Add passenger</button>`)}
async function savePassenger(id){try{await api('/live-travel/passengers',{method:'POST',body:JSON.stringify({booking_id:id,passenger_type:$('npType').value,title:$('npTitle').value,first_name:$('npFirst').value,last_name:$('npLast').value,date_of_birth:$('npDob').value,nationality:$('npNat').value,passport_number:$('npPass').value,passport_expiry:$('npExp').value})});closeModal();await refresh();bookingDetail(id)}catch(e){$('merr').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function bookingAction(id,action){try{await api(`/live-travel/bookings/${action}`,{method:'POST',body:JSON.stringify({booking_id:id})});closeModal();await refresh();show('bookings')}catch(e){alert(e.message)}}
function paymentModal(id){openModal('Record payment',`<div id="merr"></div><div class="formgrid"><div class="field span2"><label>Amount</label><input id="payAmount" type="number" min="0.01" step="0.01"></div><div class="field span2"><label>Method</label><select id="payMethod"><option>cash</option><option>bank_transfer</option><option>card</option><option>payment_link</option><option>wallet</option></select></div><div class="field span4"><label>External reference</label><input id="payRef"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePayment(${id})">Save payment</button>`)}
async function savePayment(id){try{await api('/live-travel/payments',{method:'POST',body:JSON.stringify({booking_id:id,amount:$('payAmount').value,method:$('payMethod').value,external_ref:$('payRef').value})});closeModal();await refresh();show('bookings')}catch(e){$('merr').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function serviceModal(id){openModal('New servicing request',`<div id="merr"></div><div class="formgrid"><div class="field span2"><label>Request type</label><select id="srvType"><option value="cancel">Cancellation</option><option value="refund">Refund</option><option value="reissue">Reissue</option><option value="name_correction">Name correction</option><option value="baggage">Add baggage</option><option value="seat">Seat request</option><option value="other">Other</option></select></div><div class="field span2"><label>Estimated amount</label><input id="srvAmount" type="number" min="0"></div><div class="field span4"><label>Reason</label><textarea id="srvReason"></textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveService(${id})">Create request</button>`)}
async function saveService(id){try{await api('/live-travel/service-requests',{method:'POST',body:JSON.stringify({booking_id:id,request_type:$('srvType').value,estimated_amount:$('srvAmount').value,reason:$('srvReason').value})});closeModal();await refresh();show('servicing')}catch(e){$('merr').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function renderServicing(){$('main').innerHTML=head('Servicing','Cancellations, refunds, reissues and post-booking requests')+`<div class="tablewrap"><table><thead><tr><th>Request</th><th>Booking / PNR</th><th>Type</th><th>Reason</th><th>Estimate</th><th>Status</th></tr></thead><tbody>${data.service_requests.map(s=>`<tr><td><b>${esc(s.request_ref)}</b></td><td>${esc(s.booking_ref||s.booking_id)}<div class="sub">${esc(s.pnr||'')}</div></td><td>${esc(s.request_type.replaceAll('_',' '))}</td><td>${esc(s.reason||'—')}</td><td>${money(s.estimated_amount,s.currency)}</td><td>${statusBadge(s.status)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">No servicing requests.</td></tr>`}</tbody></table></div>`}
function renderWallet(){const rows=data.wallet||[],entries=data.wallet_entries||[];$('main').innerHTML=head('Wallet & Credit','Agency wallet, receipts, debits, refunds and commissions',`<button class="btn primary" onclick="walletModal()">＋ Ledger entry</button>`)+`<div class="grid">${rows.length?rows.map(w=>`<div class="stat"><b>${money(w.balance,w.currency)}</b><span>${esc(w.currency)} balance</span></div>`).join(''):'<div class="stat"><b>—</b><span>No wallet activity</span></div>'}</div><div class="tablewrap"><table><thead><tr><th>Entry</th><th>Agent</th><th>Type</th><th>Amount</th><th>Balance after</th><th>Created</th></tr></thead><tbody>${entries.map(w=>`<tr><td><b>${esc(w.entry_ref)}</b></td><td>${esc(w.agent_ref)}</td><td>${statusBadge(w.entry_type)}</td><td>${money(w.amount,w.currency)}</td><td>${money(w.balance_after,w.currency)}</td><td>${new Date(w.created_at).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No ledger entries.</td></tr>'}</tbody></table></div>`}
function walletModal(){openModal('Wallet ledger entry',`<div id="merr"></div><div class="formgrid"><div class="field span2"><label>Agent reference</label><input id="wagent" value="owner"></div><div class="field"><label>Type</label><select id="wtype"><option>credit</option><option>debit</option><option>refund</option><option>commission</option></select></div><div class="field"><label>Currency</label><select id="wcur"><option>AED</option><option>INR</option><option>USD</option><option>SAR</option></select></div><div class="field span2"><label>Amount</label><input id="wamount" type="number" min="0.01"></div><div class="field span2"><label>Notes</label><input id="wnotes"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveWallet()">Save entry</button>`)}
async function saveWallet(){try{await api('/live-travel/wallet',{method:'POST',body:JSON.stringify({agent_ref:$('wagent').value,entry_type:$('wtype').value,currency:$('wcur').value,amount:$('wamount').value,notes:$('wnotes').value})});closeModal();await refresh();show('wallet')}catch(e){$('merr').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function renderAgents(){$('main').innerHTML=head('Agents & Commissions','Master Agent → Agent → Sub-Agent hierarchy with credit controls',`<button class="btn primary" onclick="agentModal()">＋ Add agent</button>`)+`<div class="twocol"><div class="card"><h3>Agency network</h3>${data.agents.map(a=>`<p><b>${esc(a.name)}</b> ${statusBadge(a.status)}<br><span class="sub">${esc(a.agent_type.replaceAll('_',' '))} · ${esc(a.agent_ref)} · Parent ${esc(a.parent_agent_ref)} · Credit ${money(a.credit_limit)}</span></p>`).join('')||'<p class="sub">No agents added.</p>'}</div><div class="card"><h3>Commissions</h3>${data.commissions.map(c=>`<p><b>${esc(c.booking_ref)}</b> · ${esc(c.agent_name||c.agent_ref)}<br><span class="sub">${money(c.commission_amount,c.currency)} · ${esc(c.status)}</span></p>`).join('')||'<p class="sub">No commissions recorded.</p>'}<button class="btn sm" onclick="commissionModal()">＋ Commission</button></div></div>`}
function agentModal(){const parents=['<option value="owner">Owner</option>',...data.agents.map(a=>`<option value="${esc(a.agent_ref)}">${esc(a.name)}</option>`)].join('');openModal('Add agency user',`<div id="merr"></div><div class="formgrid"><div class="field span2"><label>Name</label><input id="aname"></div><div class="field"><label>Type</label><select id="atype"><option value="master_agent">Master Agent</option><option value="agent">Agent</option><option value="sub_agent">Sub-Agent</option></select></div><div class="field"><label>Parent</label><select id="aparent">${parents}</select></div><div class="field span2"><label>Email</label><input id="aemail" type="email"></div><div class="field"><label>Phone</label><input id="aphone"></div><div class="field"><label>Credit limit</label><input id="acredit" type="number" min="0"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAgent()">Add agent</button>`)}
async function saveAgent(){try{await api('/live-travel/agents',{method:'POST',body:JSON.stringify({name:$('aname').value,agent_type:$('atype').value,parent_agent_ref:$('aparent').value,email:$('aemail').value,phone:$('aphone').value,credit_limit:$('acredit').value})});closeModal();await refresh();show('agents')}catch(e){$('merr').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function commissionModal(){if(!data.bookings.length){alert('Create a booking first.');return}const bookings=data.bookings.map(b=>`<option value="${b.id}">${esc(b.booking_ref)}</option>`).join(''),agents=['<option value="owner">Owner</option>',...data.agents.map(a=>`<option value="${esc(a.agent_ref)}">${esc(a.name)}</option>`)].join('');openModal('Add commission',`<div id="merr"></div><div class="formgrid"><div class="field span2"><label>Booking</label><select id="cbooking">${bookings}</select></div><div class="field span2"><label>Agent</label><select id="cagent">${agents}</select></div><div class="field span2"><label>Type</label><select id="ctype"><option value="fixed">Fixed</option><option value="percent">Percent</option></select></div><div class="field span2"><label>Value</label><input id="cvalue" type="number" min="0"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCommission()">Save commission</button>`)}
async function saveCommission(){try{await api('/live-travel/commissions',{method:'POST',body:JSON.stringify({booking_id:$('cbooking').value,agent_ref:$('cagent').value,commission_type:$('ctype').value,commission_value:$('cvalue').value})});closeModal();await refresh();show('agents')}catch(e){$('merr').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function supplierFields(s){
  if(s.supplier==='poomas')return `<div class="field span4"><p class="sub" style="margin:0">POOMAS uses a platform-level integration key — no per-client API credentials are required. Configure checkout and API URLs in the POOMAS Settings card below.</p></div>`;
  const saved=k=>(s.credential_fields||[]).includes(k)?'Saved — enter only to replace':'Enter value';
  if(s.supplier==='serpapi')return `<div class="field span2"><label>SerpApi API key</label><input id="skey-${s.supplier}" type="password" autocomplete="new-password" placeholder="${saved('api_key')}"></div><div class="field span2"><label>Search endpoint</label><input id="search-${s.supplier}" value="${esc(s.endpoints?.search||'https://serpapi.com/search.json')}"></div>`;
  const riya=s.supplier==='riya';
  return `<div class="field"><label>API key</label><input id="skey-${s.supplier}" type="password" autocomplete="new-password" placeholder="${saved('api_key')}"></div>${riya?`<div class="field"><label>API secret</label><input id="ssecret-${s.supplier}" type="password" autocomplete="new-password" placeholder="${saved('api_secret')}"></div><div class="field"><label>Client ID</label><input id="sclient-${s.supplier}" type="password" autocomplete="new-password" placeholder="${saved('client_id')}"></div>`:''}${['search','revalidate','book','ticket','sync','cancel'].map(k=>`<div class="field"><label>${k} endpoint</label><input id="${k}-${s.supplier}" value="${esc(s.endpoints?.[k]||'')}" placeholder="https://supplier.example/${k}"></div>`).join('')}`;
}
function renderSuppliers(){
  const ps=data.poomas_settings||{};
  const poomasCard=`<div class="card" style="border-color:var(--teal)"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><h3 style="margin:0">POOMAS Settings</h3><span class="badge ok">Platform integration</span></div><div class="notice">POOMAS uses a shared platform integration key. Enable POOMAS in the supplier row above to include its fares in flight searches. Configure the URLs below only if you have a custom POOMAS deployment.</div><div class="formgrid"><div class="field span2"><label>API base URL</label><input id="poomasApi" value="${esc(ps.api_base||'https://api.flypoomas.com')}"></div><div class="field span2"><label>Checkout base URL</label><input id="poomasCheckout" value="${esc(ps.checkout_base||'https://flypoomas.com')}"></div><div class="span4" style="display:flex;gap:8px"><button class="btn primary" onclick="savePoomasSettings()">Save POOMAS settings</button></div></div></div>`;
  $('main').innerHTML=head('Client Supplier Settings','Each client connects and controls their own SerpApi, Riya, TripJack and POOMAS accounts')+`<div class="notice">Credentials are encrypted in this client's D1 settings and are never shown again or sent back to the browser. Keep Riya and TripJack in sandbox until supplier certification is complete.</div>${data.suppliers.map(s=>`<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><h3 style="margin:0;text-transform:capitalize">${esc(s.supplier)}</h3><span class="dot ${s.supplier==='poomas'||(s.credentials_configured)?'ok':''}"></span><span class="sub">${s.supplier==='poomas'?'Platform integration key (no per-client credentials needed)':s.credentials_configured?'Client credentials configured':'Client credentials missing'}</span></div><div class="formgrid"><div class="field"><label>Enabled</label><select id="sen-${s.supplier}"><option value="0" ${!s.enabled?'selected':''}>No</option><option value="1" ${s.enabled?'selected':''}>Yes</option></select></div><div class="field"><label>Mode</label><select id="smode-${s.supplier}"><option value="sandbox" ${s.mode==='sandbox'?'selected':''}>Sandbox</option><option value="production" ${s.mode==='production'?'selected':''}>Production</option></select></div><div class="field"><label>Markup</label><select id="stype-${s.supplier}"><option value="fixed" ${s.markup_type==='fixed'?'selected':''}>Fixed</option><option value="percent" ${s.markup_type==='percent'?'selected':''}>Percent</option></select></div><div class="field"><label>Markup value</label><input id="svalue-${s.supplier}" type="number" min="0" value="${Number(s.markup_value||0)}"></div>${supplierFields(s)}<div class="span4" style="display:flex;gap:8px;align-items:center"><button class="btn primary" onclick="saveSupplier('${s.supplier}',${s.priority})">Save settings</button>${s.supplier!=='poomas'?`<button class="btn danger" onclick="clearSupplier('${s.supplier}',${s.priority})">Clear credentials</button>`:''}</div></div></div>`).join('')}${poomasCard}`;
}
function fieldValue(id){return $(id)?.value||''}
async function saveSupplier(supplier,priority,clear=false){try{const credentials={api_key:fieldValue(`skey-${supplier}`),api_secret:fieldValue(`ssecret-${supplier}`),client_id:fieldValue(`sclient-${supplier}`)},endpoints={};for(const k of ['search','revalidate','book','ticket','sync','cancel'])if($(`${k}-${supplier}`))endpoints[k]=fieldValue(`${k}-${supplier}`);await api('/live-travel/suppliers',{method:'PATCH',body:JSON.stringify({supplier,enabled:clear?false:$(`sen-${supplier}`).value==='1',mode:$(`smode-${supplier}`).value,priority,markup_type:$(`stype-${supplier}`).value,markup_value:$(`svalue-${supplier}`).value,credentials,endpoints,clear_credentials:clear})});await refresh();show('suppliers')}catch(e){alert(e.message)}}
async function clearSupplier(supplier,priority){if(confirm(`Remove this client's saved ${supplier} credentials?`))await saveSupplier(supplier,priority,true)}
async function savePoomasSettings(){try{const body={api_base:$('poomasApi').value.trim()||'https://api.flypoomas.com',checkout_base:$('poomasCheckout').value.trim()||'https://flypoomas.com'};await api('/live-travel/poomas/settings',{method:'PATCH',body:JSON.stringify(body)});await refresh();show('suppliers')}catch(e){alert('Failed to save POOMAS settings: '+e.message)}}
function openModal(title,body,foot){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalFoot').innerHTML=foot;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
async function refresh(redraw=true){data=await api('/live-travel/bootstrap');if(redraw)show(page)}
async function init(){drawNav();if(!clientId||!sessionToken){$('main').innerHTML='<div class="empty">🔒 Open Live Agency from the existing Travel Agency module.</div>';return}try{await refresh()}catch(e){$('main').innerHTML=`<div class="empty"><h2>Could not open Live Agency</h2><div class="error">${esc(e.message)}</div><button class="btn" onclick="location.reload()">Retry</button></div>`}}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});init();
</script>
</body>
</html>
