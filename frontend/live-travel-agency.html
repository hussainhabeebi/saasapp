<header class="top"><div class="brand">Leadvyne<i>.</i> Travel</div><span class="live">● LIVE AGENCY</span><button class="back" onclick="goLegacy()">← Existing Agency</button></header>
<div class="shell"><aside class="side" id="nav"></aside><main class="main" id="main"><div class="empty"><span class="spinner"></span><p>Loading Live Agency…</p></div></main></div>
<div class="modalback" id="modal"><div class="modal"><div class="modalhd"><h2 id="modalTitle"></h2></div><div class="modalbody" id="modalBody"></div><div class="modalft" id="modalFoot"></div></div></div>
<script>
const WORKER_BASE='https://leadvyne-api-proxy.leadvyne.workers.dev';
const qs=new URLSearchParams(location.search),clientId=qs.get('client')||'',sessionToken=qs.get('token')||'';
let page='dashboard',data={suppliers:[],poomas_settings:{enabled:false,checkout_base:'https://flypoomas.com'},searches:[],quotes:[],bookings:[],service_requests:[],wallet:[],wallet_entries:[],agents:[],commissions:[],currency_settings:{default_currency:'AED',fx_buffer_pct:1.5,rounding:'auto',allow_currency_override:1,auto_detect_phone_currency:1},supported_currencies:[],fx:null},lastSearch=null;
const pages=[['dashboard','📊 Dashboard'],['search','🔎 Flight Search'],['quotes','📄 Quotes'],['bookings','🎫 Bookings'],['servicing','🔄 Servicing'],['wallet','💰 Wallet'],['agents','👥 Agents'],['suppliers','🔌 Suppliers'],['settings','⚙️ Travel Settings']];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const agencyCur=()=>data.currency_settings?.default_currency||'AED';
const curDecimals=c=>['KWD','BHD','OMR'].includes(String(c).toUpperCase())?3:2;
const money=(n,c=agencyCur())=>`${esc(c)} ${Number(n||0).toLocaleString(undefined,{minimumFractionDigits:curDecimals(c),maximumFractionDigits:curDecimals(c)})}`;
const currencyCodes=()=>(data.supported_currencies||[]).map(x=>x.code).length?(data.supported_currencies||[]).map(x=>x.code):['INR','AED','SAR','QAR','OMR','KWD','BHD','USD','EUR','GBP'];
const currencyOptions=(sel=agencyCur())=>currencyCodes().map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('');
function fxAge(at){if(!at)return 'no live rate yet';const m=Math.round((Date.now()-new Date(at).getTime())/60000);return m<1?'just now':m<60?`${m} min ago`:`${Math.round(m/60)} h ago`}
function auth(extra={}){return {'Authorization':'Bearer '+sessionToken,'Content-Type':'application/json',...extra}}
async function api(path,opts={}){const r=await fetch(WORKER_BASE+path,{...opts,headers:auth(opts.headers||{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||`HTTP ${r.status}`),{code:d.code,data:d});return d}
function goLegacy(){location.href=`travel-agency.html?client=${encodeURIComponent(clientId)}&token=${encodeURIComponent(sessionToken)}`}
function statusBadge(s){const ok=['complete','confirmed','ticketed','paid','accepted','approved','completed','configured'],bad=['failed','cancelled','rejected','expired','not_configured'];return `<span class="badge ${ok.includes(s)?'ok':bad.includes(s)?'bad':'warn'}">${esc(String(s||'—').replaceAll('_',' '))}</span>`}
function drawNav(){$('nav').innerHTML=pages.map(([k,l])=>`<button class="nav ${page===k?'active':''}" onclick="show('${k}')">${l}</button>`).join('')}
function head(title,sub,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`}
function show(k){page=k;drawNav();({dashboard:renderDashboard,search:renderSearch,quotes:renderQuotes,bookings:renderBookings,servicing:renderServicing,wallet:renderWallet,agents:renderAgents,suppliers:renderSuppliers,settings:renderTravelSettings}[k])()}
function renderDashboard(){
 const supplierReady=data.suppliers.filter(s=>s.enabled&&s.credentials_configured).length, cur=agencyCur(),inCur=data.bookings.filter(b=>(b.currency||cur)===cur),revenue=inCur.reduce((a,b)=>a+Number(b.amount_paid||0),0),due=inCur.reduce((a,b)=>a+Number(b.balance_due||0),0);
 const poomasOn=data.poomas_settings?.enabled;
 $('main').innerHTML=head('Live Travel Dashboard','Real-time supplier search, booking and servicing operations')+`<div class="grid"><div class="stat"><b>${data.searches.length}</b><span>Recent searches</span></div><div class="stat"><b>${data.bookings.length}</b><span>Bookings</span></div><div class="stat"><b>${money(revenue)}</b><span>Collected</span></div><div class="stat"><b>${money(due)}</b><span>Balance due</span></div></div><div class="twocol"><div class="card"><h3>Recent bookings</h3>${bookingTable(data.bookings.slice(0,7))}</div><div class="card"><h3>Supplier health</h3>${data.suppliers.map(s=>`<p><span class="dot ${s.credentials_configured||s.supplier==='poomas'?'ok':''}"></span><b style="text-transform:capitalize">${esc(supplierName(s))}</b> · ${s.enabled?'Enabled':'Disabled'} · ${s.supplier==='poomas'?(poomasOn?'POOMAS checkout enabled':'Toggle on in Suppliers'):(s.credentials_configured?'Credentials ready':'Needs secrets')}</p>`).join('')}<div class="notice">${supplierReady} supplier${supplierReady===1?'':'s'} ready. SerpApi is comparison-only. POOMAS offers can be held and then completed via POOMAS checkout.</div></div></div>`;
}

// Airports as CODE|City|Airport|Country|extra search words. Gulf ⇄ India first (where these

const ltAirportLabel=code=>{const a=ltAirport(code);return a?`${a.city} (${a.code})`:String(code||'').toUpperCase()};

// Memory: server search history (data.searches — shared by the whole agency, any device) plus a
// per-browser store for things the server doesn't keep — the half-filled form, starred routes and
// a longer recent list. localStorage can be blocked (private mode) — every access is guarded.
const ltMemKey=()=>`lt_search_mem_${clientId}`;
function ltMem(){try{return {draft:null,favs:[],recent:[],...JSON.parse(localStorage.getItem(ltMemKey())||'{}')}}catch(e){return {draft:null,favs:[],recent:[]}}}
function ltMemSave(patch){const m={...ltMem(),...patch};try{localStorage.setItem(ltMemKey(),JSON.stringify(m))}catch(e){}return m}
function ltRecentRoutes(){
  const seen=new Set(),out=[];
  const all=[...(data.searches||[]).map(s=>({o:s.origin,d:s.destination,at:s.created_at})),...ltMem().recent].sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
  for(const r of all){const k=`${r.o}-${r.d}`;if(!r.o||!r.d||seen.has(k))continue;seen.add(k);out.push([r.o,r.d])}
  return out.slice(0,8);
}
// How often this agency has used each airport — ranks the suggestion list and picks the default origin.
function ltAirportUse(){
  const n={};
  for(const s of data.searches||[]){n[s.origin]=(n[s.origin]||0)+2;n[s.destination]=(n[s.destination]||0)+2}
  for(const r of ltMem().recent){n[r.o]=(n[r.o]||0)+1;n[r.d]=(n[r.d]||0)+1}
  for(const k of ltMem().favs){const [o,d]=k.split('-');n[o]=(n[o]||0)+3;n[d]=(n[d]||0)+3}
  return n;
}
function ltHomeOrigin(){const n={};for(const s of data.searches||[])n[s.origin]=(n[s.origin]||0)+1;for(const r of ltMem().recent)n[r.o]=(n[r.o]||0)+1;return Object.entries(n).sort((a,b)=>b[1]-a[1])[0]?.[0]||''}

// Text typed in an airport box → the code to search. Exact code wins, then a single city match
// ("dubai" → DXB; "london" is ambiguous so the agent must pick from the list).
function ltResolveAirport(text){
  const t=String(text||'').trim(),up=t.toUpperCase(),m=up.match(/\(([A-Z]{3})\)\s*$/);
  if(m)return {code:m[1],known:!!ltAirport(m[1])};
  if(/^[A-Z]{3}$/.test(up))return {code:up,known:!!ltAirport(up)};
  const low=t.toLowerCase();if(!low)return {code:'',known:false};
  const city=LT_AIRPORTS.filter(a=>a.city.toLowerCase()===low);
  if(city.length===1)return {code:city[0].code,known:true};
  const hits=ltSuggest(t);
  if(hits.length===1)return {code:hits[0].code,known:true};
  return {code:'',known:false,ambiguous:city.length>1||hits.length>1};
}
function ltSuggest(text){
  const q=String(text||'').trim().toLowerCase(),use=ltAirportUse();
  if(!q)return Object.keys(use).sort((a,b)=>use[b]-use[a]).map(ltAirport).filter(Boolean).slice(0,8);
  const score=a=>a.code.toLowerCase()===q?100:a.code.toLowerCase().startsWith(q)?60:a.city.toLowerCase().startsWith(q)?50:a.hay.split(/[\s()–-]+/).some(w=>w.startsWith(q))?30:a.hay.includes(q)?10:0;
  return LT_AIRPORTS.map(a=>({a,s:score(a)})).filter(x=>x.s).sort((x,y)=>(y.s+(use[y.a.code]||0))-(x.s+(use[x.a.code]||0))).map(x=>x.a).slice(0,8);
}

function airportField(id,label,ph){return `<div class="field"><label>${label}</label><div class="ap"><input id="${id}" placeholder="${ph}" autocomplete="off" required oninput="apInput('${id}')" onfocus="apInput('${id}')" onkeydown="apKey(event,'${id}')" onblur="setTimeout(()=>apClose('${id}'),150)"><div class="aplist" id="${id}List"></div></div><div class="aphint" id="${id}Hint"></div></div>`}
function apInput(id){

function apKey(e,id){
  const opts=[...$(id+'List').querySelectorAll('.apopt')],cur=opts.findIndex(o=>o.classList.contains('on'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!$(id+'List').classList.contains('show'))return apInput(id);const n=opts.length?(cur+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length:-1;opts.forEach((o,i)=>o.classList.toggle('on',i===n))}
  else if((e.key==='Enter'||e.key==='Tab')&&$(id+'List').classList.contains('show')&&cur>=0){if(e.key==='Enter')e.preventDefault();opts[cur].dispatchEvent(new MouseEvent('mousedown'))}
  else if(e.key==='Escape')apClose(id);

function apHint(id){

}
function routeChip(o,d,{fav=false}={}){return `<button type="button" class="chip" title="${esc(ltAirport(o)?.city||o)} → ${esc(ltAirport(d)?.city||d)}" onclick="setRoute('${o}','${d}')">${fav?'★ ':''}${esc(o)} → ${esc(d)}</button>`}
function routeChipsHtml(){

function curRoute(){const o=ltResolveAirport($('origin')?.value).code,d=ltResolveAirport($('destination')?.value).code;return o&&d?`${o}-${d}`:''}
function setRoute(o,d){$('origin').value=o;$('destination').value=d;apHint('origin');apHint('destination');drawRouteChips();ltDraftSave();if(!$('departure').value)$('departure').focus()}

function isoDay(offset,from){const d=from?new Date(from+'T00:00:00'):new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function searchErr(msg){const el=$('searchErr');if(el){el.innerHTML=msg?`<div class="error">${esc(msg)}</div>`:''}return false}
const LT_FORM_FIELDS=['tripType','origin','destination','cabin','departure','returnDate','adults','children','infants','currency','leadId'];
function ltDraftSave(){if(!$('origin'))return;const draft={};for(const f of LT_FORM_FIELDS)draft[f]=$(f)?.value??'';ltMemSave({draft});const r=$('favBtn');if(r)drawRouteChips()}

// Checked in the browser before anything goes to the suppliers — the server would otherwise take
// the first 3 letters of whatever was typed ("Dubai" → DUB) and search the wrong airport.
function validateSearch(){
  searchErr('');
  const o=ltResolveAirport($('origin').value),d=ltResolveAirport($('destination').value);
  if(!o.code)return searchErr(`Origin: ${o.ambiguous?'several airports match — pick one from the list':'pick an airport from the list or type its 3-letter code'}.`);
  if(!d.code)return searchErr(`Destination: ${d.ambiguous?'several airports match — pick one from the list':'pick an airport from the list or type its 3-letter code'}.`);
  if(o.code===d.code)return searchErr('Origin and destination are the same airport.');
  const unknown=[o,d].filter(x=>!x.known).map(x=>x.code);
  if(unknown.length&&!confirm(`${unknown.join(' and ')} ${unknown.length>1?"aren't":"isn't"} in the airport list. Search anyway?`))return false;
  $('origin').value=o.code;$('destination').value=d.code;apHint('origin');apHint('destination');
  const dep=$('departure').value,ret=$('returnDate').value,today=isoDay(0);
  if(dep&&dep<today)return searchErr('Departure date is in the past.');
  if($('tripType').value==='round_trip'&&ret&&ret<dep)return searchErr('Return date is before the departure date.');
  if(Number($('infants').value)>Number($('adults').value))return searchErr('Each infant needs an adult — infants cannot exceed adults.');
  return true;
}
function ltRememberSearch(o,d){const recent=[{o,d,at:new Date().toISOString()},...ltMem().recent.filter(r=>`${r.o}-${r.d}`!==`${o}-${d}`)].slice(0,15);ltMemSave({recent})}

 const paxField=(id,label,min,val)=>`<div class="field"><label>${label}</label><div class="stepper"><button type="button" class="btn sm" onclick="stepPax('${id}',-1)" aria-label="Fewer ${label}">−</button><input id="${id}" type="number" min="${min}" max="9" value="${val}" onchange="ltDraftSave()"><button type="button" class="btn sm" onclick="stepPax('${id}',1)" aria-label="More ${label}">+</button></div></div>`;
 $('main').innerHTML=head('Flight Search','Compare live Riya, TripJack, POOMAS and Google Flights results',`<button class="btn" onclick="repeatLastSearch()" ${(data.searches||[]).length?'':'disabled'}>🔁 Repeat last search</button><button class="btn" onclick="clearSearchForm()">🧹 Clear</button>`)+`<div class="card"><form class="formgrid" onsubmit="runSearch(event)" onchange="ltDraftSave()"><div class="field"><label>Trip type</label><select id="tripType" onchange="toggleReturn()"><option value="round_trip">Round trip</option><option value="one_way">One way</option></select></div>${airportField('origin','Origin — city or code','Dubai or DXB')}${airportField('destination','Destination — city or code','Kochi or COK')}<div class="field"><label>Cabin</label><select id="cabin"><option value="economy">Economy</option><option value="premium_economy">Premium economy</option><option value="business">Business</option><option value="first">First</option></select></div><div class="span4 routebar"><button type="button" class="btn sm" onclick="swapRoute()" title="Swap origin and destination">⇄ Swap</button><button type="button" class="btn sm" id="favBtn" onclick="toggleFavRoute()">☆ Save route</button><div id="routeChips" class="routechips"></div></div><div class="field"><label>Departure</label><input id="departure" type="date" min="${isoDay(0)}" required><div class="quick"><button type="button" class="chip" onclick="quickDate('departure',0)">Today</button><button type="button" class="chip" onclick="quickDate('departure',1)">Tomorrow</button><button type="button" class="chip" onclick="quickDate('departure',7)">+1 week</button><button type="button" class="chip" onclick="quickDate('departure',30)">+1 month</button></div></div><div class="field" id="returnField"><label>Return</label><input id="returnDate" type="date" min="${isoDay(0)}" required><div class="quick"><button type="button" class="chip" onclick="quickDate('returnDate',3)">3 nights</button><button type="button" class="chip" onclick="quickDate('returnDate',7)">1 week</button><button type="button" class="chip" onclick="quickDate('returnDate',14)">2 weeks</button><button type="button" class="chip" onclick="quickDate('returnDate',30)">1 month</button></div></div>${paxField('adults','Adults',1,1)}${paxField('children','Children',0,0)}${paxField('infants','Infants',0,0)}<div class="field"><label>Show prices in</label><select id="currency" ${data.currency_settings?.allow_currency_override?'':'disabled title="Locked to the agency currency in 💱 Currency"'}>${currencyOptions()}</select></div><div class="field span2"><label>CRM Lead ID (optional)</label><input id="leadId" placeholder="Link this search to a lead"></div><div class="span4" id="searchErr"></div><div class="span4"><button class="btn primary" id="searchBtn">🔎 Search live fares</button></div></form></div><div id="results">${renderOffers(lastSearch?.offers||[])}</div>`;

  if(o.supplier==='poomas'||o.supplier==='custom'){

  }

function fxLine(o){

  if(o.fx_status!=='converted')return '';

  const fx=lastSearch?.fx;
  if(list.some(o=>o.fx_status==='converted')&&fx)notice+=` Supplier fares converted to ${esc(fx.currency)} at live rates (${esc(fx.source||'rates')}, updated ${fxAge(fx.fetched_at)}${fx.stale?', stale':''}) incl. ${fx.buffer_pct}% FX buffer.`;
  if(list.some(o=>o.fx_status==='unconverted'))notice+=' Some fares could not be converted (no exchange rate) and are listed last in their supplier currency.';

async function createBooking(quoteId){try{const passenger={passenger_type:$('ptype').value,title:$('ptitle').value,first_name:$('pfirst').value,last_name:$('plast').value,date_of_birth:$('pdob').value,nationality:$('pnat').value,passport_number:$('ppass').value,passport_expiry:$('pexp').value};const send=confirm_fx_drift=>api('/live-travel/bookings',{method:'POST',body:JSON.stringify({quote_id:quoteId,passengers:[passenger],confirm_fx_drift})});try{await send(false)}catch(err){if(err.code!=='fx_drift'||!confirm(err.message+'\n\nBook at the quoted price anyway?'))throw err;await send(true)}closeModal();await refresh();show('bookings')}catch(e){$('merr').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function bookingTable(list){return `<div class="tablewrap" style="margin:0"><table><thead><tr><th>Booking</th><th>Customer</th><th>PNR</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>${list.map(b=>`<tr><td><b>${esc(b.booking_ref)}</b><div class="sub">${esc(b.supplier)}</div></td><td>${esc(b.customer_name||'—')}</td><td>${esc(b.pnr||'Pending')}</td><td>${money(b.total_amount,b.currency)}</td><td>${statusBadge(b.payment_status)}<div class="sub">Due ${money(b.balance_due,b.currency)}</div></td><td>${statusBadge(b.status)}</td><td><button class="btn sm" onclick="bookingDetail(${b.id})">Open</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">No bookings yet.</td></tr>`}</tbody></table></div>`}
function renderBookings(){$('main').innerHTML=head('Bookings','PNR, tickets, payments and live supplier status')+bookingTable(data.bookings)}
function customName(){const s=data.suppliers.find(x=>x.supplier==='custom');return s?supplierName(s):'Custom API'}
function poomasBookingActions(b){
  if(b.supplier==='custom')return `<button class="btn primary" onclick="poomasCheckout(${b.id})">Complete on ${esc(customName())} ↗</button>`;
  const isPoomas=b.supplier==='poomas';
  if(!isPoomas)return `<button class="btn" onclick="bookingAction(${b.id},'sync')">Sync</button><button class="btn primary" onclick="bookingAction(${b.id},'${b.status==='draft'?'book':'ticket'}')">${b.status==='draft'?'Confirm booking':'Issue ticket'}</button>`;
  const holdBtn=b.status==='draft'?`<button class="btn primary" onclick="holdPoomas(${b.id})">🔒 Hold fare</button>`:'';
  const checkoutBtn=b.checkout_url?`<a class="btn primary" href="${esc(b.checkout_url)}" target="_blank" rel="noopener">Complete on POOMAS ↗</a>`:`<button class="btn primary" onclick="poomasCheckout(${b.id})">Complete on POOMAS ↗</button>`;
  const syncBtn=`<button class="btn" onclick="bookingAction(${b.id},'sync')">Sync status</button>`;
  return (b.status==='draft'?holdBtn:'')+checkoutBtn+syncBtn;
}
async function bookingDetail(id){try{const d=await api(`/live-travel/bookings?id=${id}`),b=d.booking;openModal(`${b.booking_ref} · ${b.pnr||'PNR pending'}`,`<div class="grid"><div class="stat"><b>${money(b.total_amount,b.currency)}</b><span>Total</span></div><div class="stat"><b>${money(b.amount_paid,b.currency)}</b><span>Paid</span></div><div class="stat"><b>${money(b.balance_due,b.currency)}</b><span>Due</span></div><div class="stat"><b>${esc(b.status)}</b><span>Status</span></div></div>${b.supplier==='poomas'&&b.hold_ref?`<div class="notice">POOMAS hold reference: <b>${esc(b.hold_ref)}</b>${b.hold_expires_at?' · Expires '+new Date(b.hold_expires_at).toLocaleString():''}</div>`:''}<div class="card"><h3>Passengers</h3>${d.passengers.map(p=>`<p><b>${esc(p.title)} ${esc(p.first_name)} ${esc(p.last_name)}</b> · ${esc(p.passenger_type)} · ${esc(p.passport_number||'Passport pending')}</p>`).join('')||'<p class="sub">No passenger saved.</p>'}</div><div class="card"><h3>Payments</h3>${d.payments.map(p=>`<p>${esc(p.payment_ref)} · ${money(p.amount,p.currency)} · ${esc(p.method)}</p>`).join('')||'<p class="sub">No payment received.</p>'}</div>`,`<button class="btn" onclick="passengerModal(${b.id})">Add passenger</button><button class="btn" onclick="paymentModal(${b.id})">Add payment</button><button class="btn" onclick="serviceModal(${b.id})">Service request</button>${poomasBookingActions(b)}<button class="btn" onclick="closeModal()">Close</button>`)}catch(e){alert(e.message)}}

async function poomasCheckout(id){try{const d=await api(`/live-travel/bookings/book`,{method:'POST',body:JSON.stringify({booking_id:id})});if(d.checkout_url){window.open(d.checkout_url,'_blank')}else{alert('No checkout URL available. Check the checkout settings in Suppliers.')}}catch(e){alert(e.message)}}
function passengerModal(id){openModal('Add passenger',`<div id="merr"></div><div class="formgrid"><div class="field"><label>Type</label><select id="npType"><option value="adult">Adult</option><option value="child">Child</option><option value="infant">Infant</option></select></div><div class="field"><label>Title</label><input id="npTitle"></div><div class="field"><label>First name</label><input id="npFirst"></div><div class="field"><label>Last name</label><input id="npLast"></div><div class="field"><label>Date of birth</label><input id="npDob" type="date"></div><div class="field"><label>Nationality</label><input id="npNat"></div><div class="field"><label>Passport</label><input id="npPass"></div><div class="field"><label>Passport expiry</label><input id="npExp" type="date"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePassenger(${id})">Add passenger</button>`)}

async function bookingAction(id,action){try{await api(`/live-travel/bookings/${action}`,{method:'POST',body:JSON.stringify({booking_id:id})});closeModal();await refresh();show('bookings')}catch(e){alert(e.message)}}
function paymentModal(id){openModal('Record payment',`<div id="merr"></div><div class="formgrid"><div class="field"><label>Amount</label><input id="payAmount" type="number" min="0.01" step="0.001"></div><div class="field"><label>Currency</label><select id="payCur">${currencyOptions((data.bookings.find(b=>b.id===id)||{}).currency||agencyCur())}</select></div><div class="field span2"><label>Method</label><select id="payMethod"><option>cash</option><option>bank_transfer</option><option>card</option><option>payment_link</option><option>wallet</option></select></div><div class="field span4"><label>External reference</label><input id="payRef"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePayment(${id})">Save payment</button>`)}

function renderServicing(){$('main').innerHTML=head('Servicing','Cancellations, refunds, reissues and post-booking requests')+`<div class="tablewrap"><table><thead><tr><th>Request</th><th>Booking / PNR</th><th>Type</th><th>Reason</th><th>Estimate</th><th>Status</th></tr></thead><tbody>${data.service_requests.map(s=>`<tr><td><b>${esc(s.request_ref)}</b></td><td>${esc(s.booking_ref||s.booking_id)}<div class="sub">${esc(s.pnr||'')}</div></td><td>${esc(s.request_type.replaceAll('_',' '))}</td><td>${esc(s.reason||'—')}</td><td>${money(s.estimated_amount,s.currency)}</td><td>${statusBadge(s.status)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">No servicing requests.</td></tr>`}</tbody></table></div>`}
function renderWallet(){const rows=data.wallet||[],entries=data.wallet_entries||[];$('main').innerHTML=head('Wallet & Credit','Agency wallet, receipts, debits, refunds and commissions',`<button class="btn primary" onclick="walletModal()">＋ Ledger entry</button>`)+`<div class="grid">${rows.length?rows.map(w=>`<div class="stat"><b>${money(w.balance,w.currency)}</b><span>${esc(w.currency)} balance</span></div>`).join(''):'<div class="stat"><b>—</b><span>No wallet activity</span></div>'}</div><div class="tablewrap"><table><thead><tr><th>Entry</th><th>Agent</th><th>Type</th><th>Amount</th><th>Balance after</th><th>Created</th></tr></thead><tbody>${entries.map(w=>`<tr><td><b>${esc(w.entry_ref)}</b></td><td>${esc(w.agent_ref)}</td><td>${statusBadge(w.entry_type)}</td><td>${money(w.amount,w.currency)}</td><td>${money(w.balance_after,w.currency)}</td><td>${new Date(w.created_at).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No ledger entries.</td></tr>'}</tbody></table></div>`}
function walletModal(){openModal('Wallet ledger entry',`<div id="merr"></div><div class="formgrid"><div class="field span2"><label>Agent reference</label><input id="wagent" value="owner"></div><div class="field"><label>Type</label><select id="wtype"><option>credit</option><option>debit</option><option>refund</option><option>commission</option></select></div><div class="field"><label>Entered in</label><select id="wcur">${currencyOptions()}</select></div><div class="field span4"><div class="notice" style="margin:0">The ledger is kept in ${esc(agencyCur())}. Other currencies are converted at the live rate (or the booking's locked rate).</div></div><div class="field span2"><label>Amount</label><input id="wamount" type="number" min="0.01"></div><div class="field span2"><label>Notes</label><input id="wnotes"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveWallet()">Save entry</button>`)}

function renderAgents(){$('main').innerHTML=head('Agents & Commissions','Master Agent → Agent → Sub-Agent hierarchy with credit controls',`<button class="btn primary" onclick="agentModal()">＋ Add agent</button>`)+`<div class="twocol"><div class="card"><h3>Agency network</h3>${data.agents.map(a=>`<p><b>${esc(a.name)}</b> ${statusBadge(a.status)}<br><span class="sub">${esc(a.agent_type.replaceAll('_',' '))} · ${esc(a.agent_ref)} · Parent ${esc(a.parent_agent_ref)} · Credit ${money(a.credit_limit)}</span></p>`).join('')||'<p class="sub">No agents added.</p>'}</div><div class="card"><h3>Commissions</h3>${data.commissions.map(c=>`<p><b>${esc(c.booking_ref)}</b> · ${esc(c.agent_name||c.agent_ref)}<br><span class="sub">${money(c.commission_amount,c.currency)} · ${esc(c.status)}</span></p>`).join('')||'<p class="sub">No commissions recorded.</p>'}<button class="btn sm" onclick="commissionModal()">＋ Commission</button></div></div>`}
function agentModal(){const parents=['<option value="owner">Owner</option>',...data.agents.map(a=>`<option value="${esc(a.agent_ref)}">${esc(a.name)}</option>`)].join('');openModal('Add agency user',`<div id="merr"></div><div class="formgrid"><div class="field span2"><label>Name</label><input id="aname"></div><div class="field"><label>Type</label><select id="atype"><option value="master_agent">Master Agent</option><option value="agent">Agent</option><option value="sub_agent">Sub-Agent</option></select></div><div class="field"><label>Parent</label><select id="aparent">${parents}</select></div><div class="field span2"><label>Email</label><input id="aemail" type="email"></div><div class="field"><label>Phone</label><input id="aphone"></div><div class="field"><label>Credit limit</label><input id="acredit" type="number" min="0"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAgent()">Add agent</button>`)}

function commissionModal(){if(!data.bookings.length){alert('Create a booking first.');return}const bookings=data.bookings.map(b=>`<option value="${b.id}">${esc(b.booking_ref)}</option>`).join(''),agents=['<option value="owner">Owner</option>',...data.agents.map(a=>`<option value="${esc(a.agent_ref)}">${esc(a.name)}</option>`)].join('');openModal('Add commission',`<div id="merr"></div><div class="formgrid"><div class="field span2"><label>Booking</label><select id="cbooking">${bookings}</select></div><div class="field span2"><label>Agent</label><select id="cagent">${agents}</select></div><div class="field span2"><label>Type</label><select id="ctype"><option value="fixed">Fixed</option><option value="percent">Percent</option></select></div><div class="field span2"><label>Value</label><input id="cvalue" type="number" min="0"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCommission()">Save commission</button>`)}
async function saveCommission(){try{await api('/live-travel/commissions',{method:'POST',body:JSON.stringify({booking_id:$('cbooking').value,agent_ref:$('cagent').value,commission_type:$('ctype').value,commission_value:$('cvalue').value})});closeModal();await refresh();show('agents')}catch(e){$('merr').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function supplierName(s){return s.supplier==='custom'?(s.endpoints?.name||'Custom API'):s.supplier}
function customCurrencyOptions(cur){return `<option value="">Agency default (${esc(agencyCur())}, converted)</option>`+(data.supported_currencies||[]).map(c=>`<option value="${esc(c.code)}" ${c.code===cur?'selected':''}>${esc(c.code)}${c.name?' — '+esc(c.name):''}</option>`).join('')}
function supplierFields(s){
  if(s.supplier==='custom'){
    const e=s.endpoints||{},keySaved=(s.credential_fields||[]).includes('api_key');
    return `<div class="field span2"><label>Connector name</label><input id="cname-custom" value="${esc(e.name||'')}" placeholder="e.g. TripCod"></div><div class="field span2"><label>API key (X-API-Key)</label><input id="skey-custom" type="password" autocomplete="new-password" placeholder="${keySaved?'Saved — leave blank to keep':'pmsk_…'}"></div>`
      +`<div class="field span2"><label>Search endpoint</label><input id="search-custom" value="${esc(e.search||'')}" placeholder="https://api.tripcod.com/api/search"></div><div class="field span2"><label>Default currency</label><select id="ccur-custom">${customCurrencyOptions(e.currency||'')}</select></div>`
      +`<div class="field span2"><label>Checkout link (booking site)</label><input id="checkout-custom" value="${esc(e.checkout||'')}" placeholder="https://tripcod.com"></div><div class="field span2"><label>Checkout session endpoint (optional)</label><input id="checkout_session-custom" value="${esc(e.checkout_session||'')}" placeholder="https://api.tripcod.com/api/checkout/session"></div>`
      +`<div class="field span4"><p class="sub" style="margin:0">Search sends <code>POST</code> with your <code>X-API-Key</code> and <code>{origin, destination, departureDate, adults, cabinClass, tripType, currency}</code>. Customers pay on the checkout session URL when that endpoint is set (<code>{bookingId, whatsappPhone}</code> → <code>{checkoutUrl}</code>), otherwise on <code>&lt;checkout link&gt;/book?fareId=…</code> — or put <code>{fareId}</code> in the checkout link to use your own path. Fares are shown in the default currency exactly as charged at checkout. The connector works only after the API key, search endpoint and a checkout option are saved.</p></div>`;
  }
  if(s.supplier==='poomas')return `<div class="field span4"><p class="sub" style="margin:0">POOMAS uses a platform-level integration key — no per-client API credentials are required. Configure checkout and API URLs in the POOMAS Settings card below.</p></div>`;
  const saved=k=>(s.credential_fields||[]).includes(k)?'Saved — enter only to replace':'Enter value';
  if(s.supplier==='serpapi')return `<div class="field span2"><label>SerpApi API key</label><input id="skey-${s.supplier}" type="password" autocomplete="new-password" placeholder="${saved('api_key')}"></div><div class="field span2"><label>Search endpoint</label><input id="search-${s.supplier}" value="${esc(s.endpoints?.search||'https://serpapi.com/search.json')}"></div>`;
  const riya=s.supplier==='riya';
  return `<div class="field"><label>API key</label><input id="skey-${s.supplier}" type="password" autocomplete="new-password" placeholder="${saved('api_key')}"></div>${riya?`<div class="field"><label>API secret</label><input id="ssecret-${s.supplier}" type="password" autocomplete="new-password" placeholder="${saved('api_secret')}"></div><div class="field"><label>Client ID</label><input id="sclient-${s.supplier}" type="password" autocomplete="new-password" placeholder="${saved('client_id')}"></div>`:''}${['search','revalidate','book','ticket','sync','cancel'].map(k=>`<div class="field"><label>${k} endpoint</label><input id="${k}-${s.supplier}" value="${esc(s.endpoints?.[k]||'')}" placeholder="https://supplier.example/${k}"></div>`).join('')}`;
}
function renderSuppliers(){
  const ps=data.poomas_settings||{};
  const poomasCard=`<div class="card" style="border-color:var(--teal)"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><h3 style="margin:0">POOMAS Settings</h3><span class="badge ok">Platform integration</span></div><div class="notice">POOMAS uses a shared platform integration key. Enable POOMAS in the supplier row above to include its fares in flight searches. Configure the URLs below only if you have a custom POOMAS deployment.</div><div class="formgrid"><div class="field span2"><label>API base URL</label><input id="poomasApi" value="${esc(ps.api_base||'https://api.flypoomas.com')}"></div><div class="field span2"><label>Checkout base URL</label><input id="poomasCheckout" value="${esc(ps.checkout_base||'https://flypoomas.com')}"></div><div class="span4" style="display:flex;gap:8px"><button class="btn primary" onclick="savePoomasSettings()">Save POOMAS settings</button></div></div></div>`;
  $('main').innerHTML=head('Client Supplier Settings','Each client connects and controls their own SerpApi, Riya, TripJack, POOMAS and Custom API accounts')+`<div class="notice">Credentials are encrypted in this client's D1 settings and are never shown again or sent back to the browser. Keep Riya and TripJack in sandbox until supplier certification is complete.</div>${data.suppliers.map(s=>`<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><h3 style="margin:0;text-transform:capitalize">${esc(supplierName(s))}</h3>${s.supplier==='custom'?'<span class="badge">Custom API connector</span>':''}<span class="dot ${s.supplier==='poomas'||(s.credentials_configured)?'ok':''}"></span><span class="sub">${s.supplier==='poomas'?'Platform integration key (no per-client credentials needed)':s.supplier==='custom'?(s.credentials_configured?'API key and links saved — ready to enable':'Save the API key, search endpoint and checkout link to activate'):s.credentials_configured?'Client credentials configured':'Client credentials missing'}</span></div><div class="formgrid"><div class="field"><label>Enabled</label><select id="sen-${s.supplier}"><option value="0" ${!s.enabled?'selected':''}>No</option><option value="1" ${s.enabled?'selected':''}>Yes</option></select></div><div class="field"><label>Mode</label><select id="smode-${s.supplier}"><option value="sandbox" ${s.mode==='sandbox'?'selected':''}>Sandbox</option><option value="production" ${s.mode==='production'?'selected':''}>Production</option></select></div>${s.supplier==='custom'?`<div class="field span2"><label>Markup</label><p class="sub" style="margin:8px 0 0">Not added — the fare is charged at the connector's own checkout.</p><input type="hidden" id="stype-custom" value="fixed"><input type="hidden" id="svalue-custom" value="0"></div>`:`<div class="field"><label>Markup</label><select id="stype-${s.supplier}"><option value="fixed" ${s.markup_type==='fixed'?'selected':''}>Fixed</option><option value="percent" ${s.markup_type==='percent'?'selected':''}>Percent</option></select></div><div class="field"><label>Markup value</label><input id="svalue-${s.supplier}" type="number" min="0" value="${Number(s.markup_value||0)}"></div>`}${supplierFields(s)}<div class="span4" style="display:flex;gap:8px;align-items:center"><button class="btn primary" onclick="saveSupplier('${s.supplier}',${s.priority})">Save settings</button>${s.supplier!=='poomas'?`<button class="btn danger" onclick="clearSupplier('${s.supplier}',${s.priority})">Clear credentials</button>`:''}</div></div></div>`).join('')}${poomasCard}`;
}
function fieldValue(id){return $(id)?.value||''}

// A Drive file link shows as its thumbnail; any other https link is shown as it is.
function qrImageUrl(url){
  const u=String(url||'').trim();if(!/^https:\/\//i.test(u))return '';
  const id=(u.match(/\/file\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/)||[])[1];
  return /drive\.google\.com/i.test(u)?(id?`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w200`:''):u;
}
function qrPreview(i){
  const img=$(`fsQr${i}Img`);if(!img)return;
  const src=qrImageUrl($(`fsQr${i}Url`).value);
  img.style.display=src?'block':'none';if(src)img.src=src;else img.removeAttribute('src');
}

async function tfSave(status){

function tfRenderTest(){
  const el=$('tfChat');if(!el)return;
  el.innerHTML=(tfTest.msgs.map(m=>m.kind==='out'?`<div class="wmbubble out">${esc(m.text)}</div>`:m.kind==='note'?`<div style="text-align:center;margin:8px 0"><span class="badge ${m.cls||''}">${esc(m.text)}</span></div>`
    :`<div class="wmbubble in">${tfFmt(m.text)}${(m.options||[]).length?`<div class="quick" style="margin-top:6px">${m.options.map(o=>`<button class="chip" onclick="tfSend(${esc(JSON.stringify(o))})">${esc(o)}</button>`).join('')}</div>`:''}</div>`).join(''))
    ||`<div style="text-align:center;margin-top:40%"><span class="badge">Type a message that ${tfEdit.trigger.type==='keyword'?'contains a keyword':'names a chosen package'} to start</span></div>`;
  if(tfTest.busy)el.innerHTML+='<div class="wmbubble in"><span class="spinner"></span></div>';
  el.scrollTop=el.scrollHeight;
  const c=tfTest.collected;$('tfCollected').innerHTML=c&&Object.keys(c).length>1?'<b>Collected:</b> '+Object.entries(c).filter(([k])=>k!=='travel_flow').map(([k,v])=>`${esc(k.replace(/_/g,' '))}: ${esc(v)}`).join(' · '):'';
}
async function tfSend(text){
  const inp=$('tfIn'),msg=String(text??inp.value).trim();if(!msg||tfTest.busy)return;
  if(text==null)inp.value='';
  tfTest.msgs.push({kind:'out',text:msg});tfTest.busy=true;tfRenderTest();
  try{
    const flow={...tfEdit};delete flow._new;delete flow._dirty;
    const r=await api('/live-travel/flows/preview',{method:'POST',body:JSON.stringify({flow,state:tfTest.state,message:msg,history:tfTest.history})});
    tfTest.history.push({role:'user',content:msg});
    const add=t=>{if(t){tfTest.msgs.push({kind:'in',text:t});tfTest.history.push({role:'assistant',content:t})}};
    if(r.action==='pause'){tfTest.msgs.push({kind:'note',cls:'warn',text:'⏸️ Topic changed: flow paused, your normal bot answers. Type "continue booking" to resume.'})}
    else if(r.action==='handover'){tfTest.msgs.push({kind:'note',cls:'ok',text:'👤 Customer asked for a person: handed to your team'})}
    else{
      add(r.lead);
      for(const o of r.outputs){
        if(o.kind==='package')add(`${o.photos?'📷 _Package photos_\n':''}${o.text.length>500?o.text.slice(0,500)+'…':o.text}${o.pdf?'\n📄 _PDF itinerary_':''}`);
        else if(o.kind==='handover'||o.kind==='complete'){add(o.text);tfTest.msgs.push({kind:'note',cls:'ok',text:o.kind==='handover'?'👤 Handed to your team · 🔥 Hot lead':'✅ Flow complete'})}
        else add(o.text+(o.kind==='payment'&&o.send_qr&&tf.payment_qrs?'\n\n🖼️ _Payment QR code_':''));
      }
      if(r.question){tfTest.msgs.push({kind:'in',text:r.question,options:r.options});tfTest.history.push({role:'assistant',content:r.question})}
      if(r.action==='cancel')tfTest.msgs.push({kind:'note',text:'Customer cancelled the booking request'});
    }
    tfTest.state=r.state;tfTest.collected=r.collected;
    if(!r.state&&r.action!=='pause')tfTest.msgs.push({kind:'note',text:'Test finished. ↺ Restart to try again.'});
  }catch(e){tfTest.msgs.push({kind:'note',cls:'bad',text:'Error: '+e.message})}
  finally{tfTest.busy=false;tfRenderTest()}
}

// 📲 Travel CRM tools (worker /travel-crm/settings; screens in dashboard's travel-crm.js). Off by
// default — while off the leads, pipeline, reports and chats work exactly as before.
async function renderTravelCrmSettings(){
  const title=()=>settingsTabs()+head('Travel Settings','Track which WhatsApp number each enquiry came from, its type, route and travel dates');
  $('main').innerHTML=title()+'<div class="card"><span class="spinner"></span> Loading…</div>';
  let t;try{t=await api('/travel-crm/settings')}catch(e){$('main').innerHTML=title()+`<div class="error">${esc(e.message)}</div>`;return}
  if(!t.is_travel_account){$('main').innerHTML=title()+'<div class="card" style="margin-top:0"><h3>📲 Travel CRM tools</h3><p class="sub">Available for travel agency accounts only.</p></div>';return}
  $('main').innerHTML=title()+`<div class="card" style="margin-top:0"><h3>📲 Travel CRM tools <span class="badge ${t.enabled?'ok':'warn'}" id="tcBadge">${t.enabled?'On':'Off'}</span></h3><div class="formgrid">
<div class="field span4"><label>📲 Travel CRM tools</label><select id="tcOn"><option value="0" ${!t.enabled?'selected':''}>Off — leads, pipeline and reports work as today</option><option value="1" ${t.enabled?'selected':''}>On — show the travel CRM tools below</option></select>
<div class="sub" style="margin-top:6px">When on: every enquiry shows the <b>WhatsApp number</b> it came in on · <b>enquiry type</b> and <b>route</b> labels in the pipeline · a 🧳 <b>travel profile</b> on each lead with the customer's travel dates, marked <b>✅ Completed</b> automatically once the trip is over · <b>filters</b> by WhatsApp number, route, travel date and enquiry type · Reports → 📲 <b>WhatsApp Numbers</b> (leads and conversions per number) · replies sent from the <b>WhatsApp Business app</b> shown in Chats.</div></div>
<div class="field span2"><label>🏷️ Enquiry types <span class="sub">(one per line)</span></label><textarea id="tcTypes" rows="8">${esc((t.enquiry_types||[]).join('\n'))}</textarea></div>
<div class="field span2"><label>🛫 Routes <span class="sub">(one per line)</span></label><textarea id="tcRoutes" rows="8" placeholder="Calicut → Dubai">${esc((t.routes||[]).join('\n'))}</textarea><div class="sub" style="margin-top:4px">"Calicut to Dubai" or "Calicut-Dubai" is saved as Calicut → Dubai.</div></div>
<div class="span4" style="display:flex;gap:10px;align-items:center"><button class="btn primary" id="tcSave" onclick="saveTravelCrmSettings()">Save settings</button><span class="sub" id="tcMsg"></span></div></div>
<div class="notice">📱 <b>WhatsApp Business app replies</b> show in Chats as "📱 WhatsApp Business app" when they reach your Chatwoot inbox. If your Meta app sends WhatsApp webhooks here instead, subscribe it to <code>smb_message_echoes</code> at <code>${esc(t.echo_url||'')}</code>.</div></div>`;
}
async function saveTravelCrmSettings(){
  const btn=$('tcSave'),msg=$('tcMsg');btn.disabled=true;msg.textContent='';
  const lines=id=>$(id).value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
  try{
    const t=await api('/travel-crm/settings',{method:'PUT',body:JSON.stringify({enabled:$('tcOn').value==='1',enquiry_types:lines('tcTypes'),routes:lines('tcRoutes')})});
    $('tcTypes').value=t.enquiry_types.join('\n');$('tcRoutes').value=t.routes.join('\n');
    const b=$('tcBadge');if(b){b.textContent=t.enabled?'On':'Off';b.className='badge '+(t.enabled?'ok':'warn')}
    msg.textContent=t.enabled?'✓ Saved — Travel CRM tools are on':'✓ Saved — everything works as before';msg.style.color='var(--green)';
    // The dashboard around this frame picks the change up straight away (travel-crm.js).
    try{if(window.parent!==window)window.parent.postMessage({type:'tc:settings',enabled:t.enabled,config:{enquiry_types:t.enquiry_types,routes:t.routes}},location.protocol==='file:'?'*':location.origin)}catch(e){}
  }catch(e){msg.textContent='Error: '+e.message;msg.style.color='var(--red)'}
  finally{btn.disabled=false}
}
function renderCurrency(){
  const cs=data.currency_settings||{},fx=data.fx||{},cur=cs.default_currency||'AED';
  const modes=[['auto','Auto (per currency)'],['none','No rounding'],['up_1','Round up to 1'],['up_5','Round up to 5'],['up_10','Round up to 10']];
  const rows=(fx.rates||[]).map(r=>`<tr><td><b>${esc(r.currency)}</b> <span class="sub">${esc(r.name)}</span></td><td>${r.rate_to_default?`1 ${esc(r.currency)} = ${Number(r.rate_to_default).toFixed(curDecimals(cur)+2)} ${esc(cur)}`:'—'}</td><td>${r.rate_from_default?`1 ${esc(cur)} = ${Number(r.rate_from_default).toFixed(4)} ${esc(r.currency)}`:'—'}</td></tr>`).join('');
  $('main').innerHTML=settingsTabs()+head('Currency & Exchange Rates','Agency default currency, live conversion of supplier fares and rate protection')+`<div class="card"><div class="formgrid">
<div class="field span2"><label>Default currency</label><select id="cxCur">${currencyCodes().map(c=>`<option value="${c}" ${c===cur?'selected':''}>${c} — ${esc((data.supported_currencies||[]).find(x=>x.code===c)?.name||c)}</option>`).join('')}</select></div>
<div class="field"><label>FX buffer %</label><input id="cxBuf" type="number" min="0" max="10" step="0.1" value="${Number(cs.fx_buffer_pct??1.5)}"></div>
<div class="field"><label>Rounding</label><select id="cxRound">${modes.map(([v,l])=>`<option value="${v}" ${v===cs.rounding?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="field span2"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px"><input type="checkbox" id="cxOverride" ${cs.allow_currency_override?'checked':''}> Allow staff/customers to view prices in another currency</label></div>
<div class="field span2"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px"><input type="checkbox" id="cxPhone" ${cs.auto_detect_phone_currency?'checked':''}> WhatsApp: suggest currency from customer's country code (+91 INR, +971 AED, +966 SAR, +974 QAR…)</label></div>
<div class="span4"><button class="btn primary" onclick="saveCurrency()">Save currency settings</button></div></div>
<div class="notice">Supplier fares are converted into ${esc(cur)} at the live rate plus the FX buffer, then your supplier markup is added in ${esc(cur)} and the total is rounded. Quotes and bookings lock the rate they were priced at; booking is blocked if the rate has since moved past the buffer.</div></div>
<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h3 style="margin:0">Live rates vs ${esc(cur)}</h3><span class="badge ok">Shared · auto-refresh</span></div><p class="sub">Source: ${esc(fx.source||'—')} · rates as of ${fx.fetched_at?new Date(fx.fetched_at).toLocaleString():'—'} (${fxAge(fx.fetched_at)})${fx.stale?' · <span class="badge warn">stale</span>':''}</p><p class="sub">One rate set is shared by every Live Agency on the platform and used across search, quotes, bookings, wallet, payments and WhatsApp. It refreshes automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC), at most ${fx.max_refreshes_per_day||4} times a day${fx.next_refresh_at?` · next scheduled ${new Date(fx.next_refresh_at).toLocaleString()}`:''}.</p><div class="tablewrap" style="margin:0"><table><thead><tr><th>Currency</th><th>To ${esc(cur)}</th><th>From ${esc(cur)}</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="empty">Rates load after the first refresh.</td></tr>'}</tbody></table></div></div>`;
}
async function saveCurrency(){try{const d=await api('/live-travel/currency-settings',{method:'PATCH',body:JSON.stringify({default_currency:$('cxCur').value,fx_buffer_pct:Number($('cxBuf').value),rounding:$('cxRound').value,allow_currency_override:$('cxOverride').checked?1:0,auto_detect_phone_currency:$('cxPhone').checked?1:0})});data.currency_settings=d.settings;data.fx=d.fx;data.supported_currencies=d.supported;renderCurrency();alert('Currency settings saved.')}catch(e){alert(e.message)}}
// ── 💬 WhatsApp Menu: the menu customers get on "hi" / "menu" (worker: live-travel-wa-menu.js) ──
let wm=null;
const WM_ACTIONS=[['flight_search','✈️ Live flights'],['portal','📚 Travel Portal list'],['ask','💬 Ask a question'],['link','🔗 Open a link'],['my_bookings','🎫 My bookings'],['handover','👤 Hand to team']];
const wmRowTitle=it=>`${it.emoji?it.emoji+' ':''}${it.title}`.slice(0,24);
// Same rule as the bot: Live Flights needs the API connected, a Travel Portal row needs listings.
const wmAvailable=it=>it.action==='flight_search'?!!wm.flights_connected:it.action==='portal'?(wm.portal_counts?.[it.source]||0)>0:true;
const wmPortalLabel=src=>wm.portal_sources?.[src]?.label||src;
async function renderWhatsappMenu(){
 if(!wm){$('main').innerHTML=settingsTabs()+head('WhatsApp Menu','Loading…')+'<div class="empty"><span class="spinner"></span></div>';try{wm=await api('/live-travel/whatsapp-menu');wm.dirty=false}catch(e){$('main').innerHTML=settingsTabs()+head('WhatsApp Menu','')+`<div class="error">${esc(e.message)}</div>`;return}}
 const m=wm.menu,on=m.items.filter(i=>i.enabled).length,shown=m.items.filter(i=>i.enabled&&wmAvailable(i)).length;
 $('main').innerHTML=settingsTabs()+head('WhatsApp Menu','The menu customers get when they say "hi" or type "menu" on WhatsApp',`<button class="btn" onclick="wmReset()">↺ Defaults</button><button class="btn primary" id="wmSave" onclick="wmSaveMenu()">💾 Save menu</button>`)
 +`<div id="wmErr"></div><div class="wmgrid"><div>
 <div class="card"><label class="wmtoggle"><input type="checkbox" ${wm.travel_flow?'checked':''} onchange="wmSaveFlow(this)"> <b>✈️ Travel Flow (optional)</b></label>
 <p class="sub">When on, "hi", "hello", "menu" and every menu tap are answered by this menu, flight questions get live fares with buttons, and a picked flight goes details → Proceed → booking form → your booking site. When off, your WhatsApp bot works exactly as before. Same switch as Dashboard → Settings → Industry Modules → Travel Flow.</p>
 ${wm.flights_connected?'':'<div class="notice">Live flight search is not connected, so <b>✈️ Live Flights</b> is hidden from customers. Connect POOMAS or a Custom API in 🔌 Suppliers to share live fares and book in chat.</div>'}
 <p class="sub">Other services come from your Travel Portal (← Existing Agency): an option shows only while that section has something listed.</p>
 <div class="formgrid" style="grid-template-columns:1fr 180px"><div class="field"><label>Welcome message</label><textarea maxlength="900" placeholder="Leave empty for: 👋 Welcome to {agency}! How can we help you today?…" oninput="wmTop('greeting',this.value)">${esc(m.greeting)}</textarea><span class="sub">Use {name} for the customer's first name and {agency} for your agency name.</span></div>
 <div class="field"><label>Menu button</label><input maxlength="20" value="${esc(m.button_label)}" oninput="wmTop('button_label',this.value)"></div></div></div>
 <div class="card"><h3>Menu options <span class="badge ${on>10?'bad':'ok'}">${on} / 10 on</span> <span class="badge">${shown} shown to customers now</span></h3><p class="sub" style="margin-top:-6px">WhatsApp shows up to 10 options. Rows with the same section are grouped under one heading.</p>
 <div id="wmItems">${m.items.map(wmItemHtml).join('')}</div>
 <button class="btn" onclick="wmAdd()">＋ Add option</button></div>
 <div class="card"><h3>✈️ Route buttons for flight search</h3><p class="sub" style="margin-top:-6px">Offered as one-tap routes after the customer picks Flights (their own last search comes first).</p>
 <div class="field"><label>Pinned routes</label><input id="wmRoutes" placeholder="DXB-COK, SHJ-CCJ, AUH-TRV" value="${esc(m.popular_routes.map(r=>r.join('-')).join(', '))}" oninput="wmRoutes(this.value)"></div>
 ${(wm.suggested_routes||[]).length?`<div class="chiprow" style="margin-top:8px"><span class="chiplbl">Your top routes</span>${wm.suggested_routes.map(r=>`<button type="button" class="chip" onclick="wmAddRoute('${esc(r[0])}','${esc(r[1])}')">＋ ${esc(r[0])} → ${esc(r[1])}</button>`).join('')}</div>`:''}</div>
 </div><div><div class="wmphone"><div class="wmbar">${esc('Your agency')} <span>online</span></div><div class="wmchat" id="wmPreview"></div></div><p class="sub" style="text-align:center">Live preview</p></div></div>
 <datalist id="wmCats">${(wm.categories||[]).map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`;
 wmPreview();
}
function wmItemHtml(it,i){
 const n=wm.menu.items.length,act=it.action;
 return `<div class="wmitem ${it.enabled&&wmAvailable(it)?'':'off'}"><div class="wmhead"><input type="checkbox" title="Show in menu" ${it.enabled?'checked':''} onchange="wmItem(${i},'enabled',this.checked,true)">
 <input class="wmemoji" maxlength="8" value="${esc(it.emoji)}" oninput="wmItem(${i},'emoji',this.value)" aria-label="Emoji">
 <input class="wmtitle" maxlength="24" value="${esc(it.title)}" oninput="wmItem(${i},'title',this.value)" aria-label="Title">
 <button class="btn sm" ${i?'':'disabled'} onclick="wmMove(${i},-1)" title="Move up">↑</button><button class="btn sm" ${i<n-1?'':'disabled'} onclick="wmMove(${i},1)" title="Move down">↓</button><button class="btn sm danger" onclick="wmDel(${i})" title="Remove">✕</button></div>
 <div class="formgrid wmfields"><div class="field"><label>When tapped</label><select onchange="wmItem(${i},'action',this.value,true)">${WM_ACTIONS.map(([k,l])=>`<option value="${k}" ${k===act?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="field"><label>Section</label><input maxlength="24" value="${esc(it.section)}" oninput="wmItem(${i},'section',this.value)"></div>
 <div class="field"><label>Service category</label><input list="wmCats" maxlength="60" value="${esc(it.category)}" placeholder="—" oninput="wmItem(${i},'category',this.value)"></div>
 <div class="field"><label>Short description</label><input maxlength="72" value="${esc(it.description)}" oninput="wmItem(${i},'description',this.value)"></div>
 ${act==='portal'?`<div class="field"><label>Travel Portal section</label><select onchange="wmItem(${i},'source',this.value,true)">${Object.entries(wm.portal_sources||{}).map(([k,v])=>`<option value="${k}" ${k===it.source?'selected':''}>${esc(v.label)}</option>`).join('')}</select></div><div class="span4 sub">${(wm.portal_counts?.[it.source]||0)>0?`✓ ${wm.portal_counts[it.source]} listed in Existing Agency → ${esc(wmPortalLabel(it.source))}. Tap → list → details → Enquire Now.`:`⚠ Nothing listed in Existing Agency → ${esc(wmPortalLabel(it.source))} — hidden from customers until you add one.`}</div>`:''}
 ${act==='ask'||act==='link'?`<div class="field span4"><label>${act==='link'?'Message above the button':'Bot reply'}</label><textarea maxlength="900" oninput="wmItem(${i},'message',this.value)" placeholder="${act==='link'?'e.g. See all our holiday packages:':'e.g. Which country is the visa for? Please share your nationality and travel date.'}">${esc(it.message)}</textarea></div>`:''}
 ${act==='link'?`<div class="field span2"><label>Link (https://)</label><input value="${esc(it.url)}" placeholder="https://youragency.com/packages" oninput="wmItem(${i},'url',this.value)"></div><div class="field"><label>Button text</label><input maxlength="20" value="${esc(it.button_text)}" placeholder="Open" oninput="wmItem(${i},'button_text',this.value)"></div>`:''}
 ${act==='flight_search'?`<div class="span4 sub">${wm.flights_connected?'✓ Live API connected. Route → date → passengers buttons → live fares → flight details → Proceed → booking form → your booking site.':'⚠ Live API not connected — hidden from customers.'}</div>`:''}
 ${act==='handover'?'<div class="span4 sub">The chat is assigned to your team with the usual handover message.</div>':''}
 ${act==='my_bookings'?'<div class="span4 sub">Lists the customer\'s Live Agency bookings (reference, PNR, status, balance) found for their WhatsApp number.</div>':''}
 </div></div>`;
}
function wmDirty(){wm.dirty=true;wmPreview()}
function wmTop(k,v){wm.menu[k]=v;wmDirty()}
function wmItem(i,k,v,redraw){wm.menu.items[i][k]=v;if(redraw)renderWhatsappMenu();wmDirty()}
function wmMove(i,d){const a=wm.menu.items,j=i+d;[a[i],a[j]]=[a[j],a[i]];wm.dirty=true;renderWhatsappMenu()}
function wmDel(i){if(!confirm(`Remove "${wm.menu.items[i].title}" from the menu?`))return;wm.menu.items.splice(i,1);wm.dirty=true;renderWhatsappMenu()}
function wmAdd(){wm.menu.items.push({id:'',emoji:'⭐',title:'New option',description:'',section:'Services',action:'portal',source:'packages',category:'',message:'',url:'',button_text:'',enabled:true});wm.dirty=true;renderWhatsappMenu()}
function wmReset(){if(!confirm('Replace your menu with the default travel menu? Your changes are not saved until you click Save.'))return;wm.menu={...wm.defaults,enabled:wm.menu.enabled,items:wm.defaults.items.map(x=>({message:'',url:'',button_text:'',enabled:true,...x}))};wm.dirty=true;renderWhatsappMenu()}
function wmRoutes(v){wm.menu.popular_routes=(String(v).toUpperCase().match(/[A-Z]{3}\s*(?:-|→|>|TO)\s*[A-Z]{3}/g)||[]).map(r=>r.match(/[A-Z]{3}/g).filter(x=>x!=='TO').slice(0,2)).filter(r=>r.length===2&&r[0]!==r[1]).slice(0,8);wmDirty()}
function wmAddRoute(o,d){const r=wm.menu.popular_routes;if(!r.some(x=>x[0]===o&&x[1]===d)&&r.length<8)r.push([o,d]);$('wmRoutes').value=r.map(x=>x.join('-')).join(', ');wmDirty()}
function wmPreview(){
 const m=wm.menu,el=$('wmPreview');if(!el)return;
 const greet=(m.greeting||`👋 Welcome to your agency!\n\nHow can we help you today? Tap *${m.button_label||'Menu'}* to choose a service, or simply type your question.`).replace(/\{name\}/gi,'Hussain').replace(/\{agency\}/gi,'your agency');
 const fmt=t=>esc(t).replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/_([^_\n]+)_/g,'<i>$1</i>').replace(/\n/g,'<br>');
 const sections=[];m.items.filter(i=>i.enabled&&wmAvailable(i)).slice(0,10).forEach(it=>{let s=sections.find(x=>x.t.toLowerCase()===String(it.section||'Services').toLowerCase());if(!s){s={t:it.section||'Services',rows:[]};sections.push(s)}s.rows.push(it)});
 el.innerHTML=`<div class="wmbubble out">hi</div><div class="wmbubble in">${fmt(greet)}<div class="wmbtn">☰ ${esc(m.button_label||'Menu')}</div></div>
 <div class="wmsheet"><div class="wmsheethd">${esc(m.button_label||'Menu')}</div>${sections.map(s=>`<div class="wmsec">${esc(s.t)}</div>${s.rows.map(r=>`<div class="wmrow"><div><b>${esc(wmRowTitle(r))}</b>${r.description?`<span>${esc(r.description)}</span>`:''}</div><i></i></div>`).join('')}`).join('')||'<div class="wmrow"><span>No options turned on</span></div>'}</div>`;
}
// The Travel Flow switch saves the moment it is ticked — no separate Save needed.
async function wmSaveFlow(box){

 try{const r=await api('/live-travel/travel-flow',{method:'PUT',body:JSON.stringify({enabled:on})});wm.travel_flow=r.enabled;
  $('wmErr').innerHTML=`<div class="notice" style="background:#DDF6EB;border-color:#9FDCC0;color:var(--green)">✓ Travel Flow ${r.enabled?'is on — customers get this menu on WhatsApp now':'is off — your WhatsApp bot works as before'}.</div>`}
 catch(e){box.checked=!on;$('wmErr').innerHTML=`<div class="error">Travel Flow was not saved: ${esc(e.message)}</div>`}
 finally{box.disabled=false}
}
async function wmSaveMenu(){
 const btn=$('wmSave');btn.disabled=true;$('wmErr').innerHTML='';
 try{const payload={menu:{...wm.menu,enabled:!!wm.travel_flow}};const r=await api('/live-travel/whatsapp-menu',{method:'PUT',body:JSON.stringify(payload)});wm.menu=r.menu;wm.dirty=false;renderWhatsappMenu();$('wmErr').innerHTML=`<div class="notice" style="background:#DDF6EB;border-color:#9FDCC0;color:var(--green)">✓ Saved — ${wm.travel_flow?'Travel Flow is on: customers get this menu on WhatsApp now':'Travel Flow is off: your WhatsApp bot works as before. Turn it on to use this menu'}.</div>`}
 catch(e){$('wmErr').innerHTML=`<div class="error">${esc(e.message)}</div>`}

}
function openModal(title,body,foot){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalFoot').innerHTML=foot;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
async function refresh(redraw=true){data=await api('/live-travel/bootstrap');if(redraw)show(page)}
