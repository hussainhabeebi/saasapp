<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leadvyne · Proposals</title>
<link rel="icon" type="image/webp" href="http://aiingo.com/wp-content/uploads/2026/01/cropped-Aiingo-1.png.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Proposals for General accounts (Dashboard → 📑 Proposals). Every proposal sent from
     Chats → Attach → 📑 AI Proposal: its number, customer, total, validity and status. The agent
     sets the status (sent / negotiating / accepted / rejected); "expired" (validity passed) and
     "revised" (a newer proposal went to the same lead) are worked out by the worker. Accepting can
     also move the lead to Won. Worker routes: /catalog/proposals, /catalog/proposals/pdf
     (session-gated). -->
<style>
:root{
  --bg:#EEF2F0;--card:#FFFFFF;--ink:#0F1A1E;--muted:#55666B;
  --accent:#0D9C93;--accent-ink:#0A6F69;--accent-soft:#DFF6F3;
  --line:#D7E0DC;--danger:#B42318;--danger-soft:#FEE4E2;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.06);
  --disp:"Space Grotesk",sans-serif;--body:"Inter",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;min-height:56px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--disp);font-size:16px;font-weight:700}.brand span{color:var(--accent)}
.chip{background:var(--accent-soft);color:var(--accent-ink);font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
body.embed header{display:none}
main{padding:20px 16px 40px}
.inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.intro{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.intro h1{font-family:var(--disp);font-size:21px;flex:1;min-width:0}
.intro p{color:var(--muted);font-size:13px;width:100%;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--disp);font-size:20px;color:var(--accent-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;height:34px;padding:0 14px;border-radius:17px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button small{opacity:.75;margin-left:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar input,.toolbar select{height:38px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);min-width:0}
.toolbar input{flex:1 1 220px}
.btn{height:36px;border-radius:10px;border:0;padding:0 14px;font-family:var(--disp);font-weight:600;cursor:pointer;background:var(--accent);color:#fff;white-space:nowrap;font-size:13.5px}
.btn:hover{background:var(--accent-ink)}.btn.sec{background:var(--card);color:var(--accent-ink);border:1.5px solid var(--line)}
.btn.sec:hover{border-color:var(--accent)}.btn:disabled{opacity:.55;cursor:default}
.list{display:flex;flex-direction:column;gap:10px}
.prop{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:start}
.prop .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.prop .ref{font-weight:600;color:var(--ink);font-family:var(--disp)}
.prop h3{font-family:var(--disp);font-size:16px;line-height:1.3;grid-column:1}
.prop .who{font-size:13px;color:var(--muted);grid-column:1}
.prop .who b{color:var(--ink);font-weight:600}
.prop .amt{grid-column:2;grid-row:1/span 3;text-align:right}
.prop .amt b{display:block;font-family:var(--disp);font-size:18px;color:var(--accent-ink);white-space:nowrap}
.prop .amt small{font-size:12px;color:var(--muted)}
.prop .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.prop .meta span{background:var(--bg);border-radius:8px;padding:3px 8px;color:var(--muted)}
.prop .meta span.warn{background:#FEF3C7;color:#92400E}
.prop .meta span.ok{background:#DCFCE7;color:#166534}
.prop .note{grid-column:1/-1;font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.prop .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.prop .acts .btn{height:32px;padding:0 12px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:12px;text-transform:uppercase;letter-spacing:.03em}
.st-sent{background:#E0F2FE;color:#075985}.st-negotiating{background:#FEF3C7;color:#92400E}.st-accepted{background:#DCFCE7;color:#166534}
.st-rejected{background:var(--danger-soft);color:var(--danger)}.st-expired{background:#F1F5F9;color:#475569}.st-revised{background:#EDE9FE;color:#5B21B6}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted);line-height:1.5}
.empty b{display:block;font-family:var(--disp);font-size:17px;color:var(--ink);margin-bottom:6px}
/* Status sheet */
.ov{position:fixed;inset:0;background:rgba(10,20,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.hidden{display:none}
.sheet{background:var(--card);border-radius:16px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100dvh - 32px);overflow-y:auto}
.sheet h2{font-family:var(--disp);font-size:17px}
.sheet .sub{font-size:12.5px;color:var(--muted);margin-top:-6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts label{border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:500}
.opts input{accent-color:var(--accent)}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.sheet textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);resize:vertical;font-size:14px;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.sheet .msg{flex:1;color:var(--danger);font-size:12.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0F1A1E;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
.toast.hidden,.hidden{display:none!important}
@media(max-width:600px){
  main{padding:14px 12px 32px}
  .prop{grid-template-columns:1fr;padding:12px 14px}
  .prop .amt{grid-column:1;grid-row:auto;text-align:left;display:flex;align-items:baseline;gap:8px}
  .prop .acts .btn{flex:1 1 auto}
  .ov{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:18px 18px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<header><div class="brand">Lead<span>vyne</span></div><span class="chip">📑 Proposals</span></header>
<main><div class="inner">
  <div class="intro">
    <h1>📑 Proposals</h1>
    <button class="btn sec" onclick="load(true)" title="Refresh">↻ Refresh</button>
    <p>Every proposal sent from <b>Chats → Attach → 📑 AI Proposal</b>. Update the status as the deal moves — accepted proposals can mark the lead as Won.</p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Search number, title or customer" oninput="draw()">
    <select id="sort" onchange="draw()" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="value">Highest value</option><option value="expiry">Expiring soon</option></select>
  </div>
  <div class="list" id="list"><div class="empty">Loading…</div></div>
</div></main>

<div class="ov hidden" id="ov" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <h2 id="shTitle">Update status</h2>
    <div class="sub" id="shSub"></div>
    <div class="opts" id="shOpts"></div>
    <label class="check hidden" id="shWonRow"><input type="checkbox" id="shWon" checked>Also mark the lead as Won</label>
    <textarea id="shNote" rows="3" maxlength="500" placeholder="Note (optional) — e.g. asked for 5% more discount"></textarea>
    <div class="row"><span class="msg" id="shMsg"></span><button class="btn sec" onclick="closeSheet()">Cancel</button><button class="btn" id="shSave" onclick="saveStatus()">Save</button></div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<script>
const WORKER_BASE='https://leadvyne-api-proxy.leadvyne.workers.dev';
const params=new URLSearchParams(location.search);
let sessionToken=params.get('token')||'';
try{ if(!sessionToken) sessionToken=localStorage.getItem('lv_session')||''; }catch(e){}
const embedded=params.get('embed')==='1';
if(embedded) document.body.classList.add('embed');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const el=$('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.add('hidden'),2600)}
const STATUS={sent:['📤','Sent'],negotiating:['💬','Negotiating'],accepted:['✅','Accepted'],rejected:['✖','Rejected'],expired:['⌛','Expired'],revised:['🔁','Revised']};
const SETTABLE=['sent','negotiating','accepted','rejected'];
const TABS=[['all','All'],['open','Open'],['negotiating','Negotiating'],['accepted','Accepted'],['rejected','Rejected'],['expired','Expired'],['revised','Revised']];
let rows=[],tab='all',editing=null;
try{tab=localStorage.getItem('lv_proposals_tab')||'all'}catch(e){}
const isOpen=r=>r.status==='sent'||r.status==='negotiating';
const money=(n,c)=>n==null||n===''?'':`${c||'INR'} ${Number(n).toLocaleString((c||'INR')==='INR'?'en-IN':'en-US',{maximumFractionDigits:2})}`;
const day=s=>s?new Date(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'';
const when=s=>{if(!s)return '';const d=new Date(s),m=(Date.now()-d.getTime())/6e4;return m<60?`${Math.max(1,Math.round(m))} min ago`:m<1440?`${Math.round(m/60)} h ago`:d.toLocaleDateString(undefined,{day:'numeric',month:'short'})};
async function copyLink(id){
  const r=rows.find(x=>x.id===id);if(!r?.link)return;
  try{await navigator.clipboard.writeText(r.link);toast('✓ Link copied — anyone with it can open this PDF')}catch(e){prompt('Copy the proposal link',r.link)}
}
const daysLeft=s=>s?Math.ceil((new Date(s).getTime()-Date.now())/864e5):null;
async function api(path,opts={}){
  const r=await fetch(WORKER_BASE+path,{...opts,headers:{'Authorization':'Bearer '+sessionToken,...(opts.body?{'Content-Type':'application/json'}:{})}});
  if(/application\/pdf/.test(r.headers.get('content-type')||''))return r;
  const d=await r.json().catch(()=>({}));
  if(!r.ok||d.error)throw new Error(d.error||'HTTP '+r.status);
  return d;
}
async function load(manual){
  try{rows=(await api('/catalog/proposals')).proposals||[];draw();if(manual)toast('Up to date')}
  catch(e){$('list').innerHTML=`<div class="empty"><b>Could not load proposals</b>${esc(e.message)}</div>`}
}
// Stats in the currency most proposals use (mixed currencies are listed, not added together).
function drawStats(){
  const cur=Object.entries(rows.reduce((m,r)=>(r.currency&&(m[r.currency]=(m[r.currency]||0)+1),m),{})).sort((a,b)=>b[1]-a[1])[0]?.[0]||'INR';
  const sum=list=>list.filter(r=>r.total!=null&&(r.currency||cur)===cur).reduce((s,r)=>s+Number(r.total),0);
  const open=rows.filter(isOpen),won=rows.filter(r=>r.status==='accepted'),decided=rows.filter(r=>r.status==='accepted'||r.status==='rejected');
  $('stats').innerHTML=[[rows.length,'Proposals sent'],[money(sum(open),cur)||'—',`Open · ${open.length}`],[money(sum(won),cur)||'—',`Accepted · ${won.length}`],
    [decided.length?Math.round(won.length/decided.length*100)+'%':'—','Win rate (decided)']].map(([n,l])=>`<div class="stat"><b title="${esc(n)}">${esc(n)}</b><span>${esc(l)}</span></div>`).join('');
}
function drawTabs(){
  const count=k=>k==='all'?rows.length:k==='open'?rows.filter(isOpen).length:rows.filter(r=>r.status===k).length;
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" class="${k===tab?'on':''}" onclick="setTab('${k}')">${l}<small>${count(k)}</small></button>`).join('');
}
function setTab(k){tab=k;try{localStorage.setItem('lv_proposals_tab',k)}catch(e){}draw()}
function draw(){
  drawStats();drawTabs();
  const q=$('q').value.trim().toLowerCase(),sort=$('sort').value;
  let list=rows.filter(r=>tab==='all'||(tab==='open'?isOpen(r):r.status===tab));
  if(q)list=list.filter(r=>`${r.ref} ${r.title} ${r.customer?.name||''} ${r.customer?.company||''} ${r.customer?.phone||''}`.toLowerCase().includes(q));
  if(sort==='old')list=[...list].reverse();
  if(sort==='value')list=[...list].sort((a,b)=>(Number(b.total)||0)-(Number(a.total)||0));
  if(sort==='expiry')list=[...list].filter(r=>isOpen(r)&&r.valid_until).sort((a,b)=>a.valid_until.localeCompare(b.valid_until)).concat(list.filter(r=>!(isOpen(r)&&r.valid_until)));
  if(!rows.length){$('list').innerHTML=`<div class="empty"><b>No proposals yet</b>Open a chat, tap <b>Attach → 📑 AI Proposal</b>, pick products or services and send it — it shows up here with its status.</div>`;return}
  if(!list.length){$('list').innerHTML=`<div class="empty">No proposals here.</div>`;return}
  $('list').innerHTML=list.map(r=>{
    const [ic,label]=STATUS[r.status]||STATUS.sent,c=r.customer||{};
    const left=isOpen(r)?daysLeft(r.valid_until):null;
    const meta=[`Sent ${esc(day(r.sent_at))}`,
      r.valid_until?(left!=null&&left>=0?`<span class="${left<=3?'warn':''}">${left===0?'Expires today':`${left} day${left>1?'s':''} left`}</span>`:`Valid until ${esc(day(r.valid_until))}`):'',
      `${(r.items||[]).length} item${(r.items||[]).length===1?'':'s'}`,
      r.customer_replied_at&&isOpen(r)?`<span class="ok">💬 Customer replied ${esc(day(r.customer_replied_at))}</span>`:'',
      r.link?(r.view_count?`<span class="ok" title="Opened from the PDF link">👁 Viewed ${r.view_count}× · last ${esc(when(r.last_viewed_at))}</span>`:'<span>👁 Link not opened yet</span>'):'',
      r.sent_via==='template'?'<span title="Sent after the 24-hour window closed: WhatsApp template with a link to the PDF">📨 Sent as template</span>':'',
      r.sent_by?`By ${esc(r.sent_by.split('@')[0])}`:''].filter(Boolean).map(x=>x.startsWith('<span')?x:`<span>${x}</span>`).join('');
    return `<div class="prop">
      <div class="top"><span class="ref">${esc(r.ref)}</span><span class="pill st-${esc(r.status)}">${ic} ${label}</span>${r.status_at&&r.stored_status!=='sent'?`<span>updated ${esc(day(r.status_at))}</span>`:''}</div>
      <h3>${esc(r.title)}</h3>
      <div class="who"><b>${esc(c.name||'Customer')}</b>${c.company?' · '+esc(c.company):''}${c.phone?' · '+esc(c.phone):''}</div>
      <div class="amt"><b>${r.total!=null?esc(money(r.total,r.currency)):'On request'}</b><small>${r.total!=null?'incl. tax & discount':''}</small></div>
      <div class="meta">${meta}</div>
      ${r.status_note?`<div class="note">${esc(r.status_note)}</div>`:''}
      <div class="acts"><button class="btn" onclick="openSheet(${r.id})">Update status</button>
        <button class="btn sec" onclick="viewPdf(${r.id},this)" ${r.has_pdf||r.pdf_url?'':'disabled title="Sent before PDFs were kept — open it from the chat"'}>📄 PDF</button>
        ${r.link?`<button class="btn sec" onclick="copyLink(${r.id})">🔗 Copy link</button>`:''}
        <button class="btn sec" onclick="openChat(${r.lead_id})">💬 Chat</button></div>
    </div>`}).join('');
}
async function viewPdf(id,btn){
  const r=rows.find(x=>x.id===id);if(!r)return;
  // Open the window first (in the click) so mobile browsers don't block it, then fill it.
  const w=window.open('','_blank');btn.disabled=true;const t=btn.textContent;btn.textContent='Opening…';
  try{
    const res=await api('/catalog/proposals/pdf?id='+id);
    const url=res.url||URL.createObjectURL(await res.blob());
    if(w)w.location.href=url;else location.href=url;
  }catch(e){if(w)w.close();toast(e.message)}
  finally{btn.disabled=false;btn.textContent=t}
}
function openChat(leadId){
  if(embedded&&window.parent!==window){window.parent.postMessage({type:'pc:openChat',leadId},location.origin);return}
  location.href=`chats.html?lead=${encodeURIComponent(leadId)}`;
}
function openSheet(id){
  editing=rows.find(r=>r.id===id);if(!editing)return;
  $('shSub').textContent=`${editing.ref} · ${editing.customer?.name||'Customer'}${editing.total!=null?' · '+money(editing.total,editing.currency):''}`;
  const cur=SETTABLE.includes(editing.stored_status)?editing.stored_status:'sent';
  $('shOpts').innerHTML=SETTABLE.map(k=>`<label><input type="radio" name="st" value="${k}" ${k===cur?'checked':''} onchange="syncWon()">${STATUS[k][0]} ${STATUS[k][1]}</label>`).join('');
  $('shNote').value=editing.status_note||'';$('shMsg').textContent='';$('shWon').checked=true;syncWon();
  $('ov').classList.remove('hidden');
}
function syncWon(){$('shWonRow').classList.toggle('hidden',document.querySelector('input[name=st]:checked')?.value!=='accepted')}
function closeSheet(){$('ov').classList.add('hidden');editing=null}
async function saveStatus(){
  if(!editing)return;const status=document.querySelector('input[name=st]:checked')?.value;if(!status)return;
  const btn=$('shSave');btn.disabled=true;btn.textContent='Saving…';$('shMsg').textContent='';
  try{
    const d=await api('/catalog/proposals',{method:'PATCH',body:JSON.stringify({id:editing.id,status,note:$('shNote').value.trim(),mark_won:status==='accepted'&&$('shWon').checked})});
    closeSheet();await load();toast(`✓ Marked ${STATUS[status][1].toLowerCase()}${d.stage==='won'?' · lead moved to Won':''}`);
  }catch(e){$('shMsg').textContent=e.message}
  finally{btn.disabled=false;btn.textContent='Save'}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ov').classList.contains('hidden'))closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sessionToken&&rows.length)load()});
if(!sessionToken){$('list').innerHTML='<div class="empty"><b>Please sign in</b>Open this page from your Leadvyne dashboard.</div>'}
else load();
</script>
</body>
</html>
