 // failed sends stay; sends the server now has (no _status) are replaced by its copy.

// data often never finishes, so photos are shrunk before sending the way WhatsApp itself does

// as it is; so does a GIF (would lose its animation) and anything already small.

  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(file));

// Some Android gallery / file-manager apps hand over a file with an empty type; without it a photo
// was sent as a "document". Fill it in from the extension.
const EXT_TYPES={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',heic:'image/heic',heif:'image/heif',mp4:'video/mp4',mov:'video/quicktime','3gp':'video/3gpp',mp3:'audio/mpeg',ogg:'audio/ogg',opus:'audio/ogg',m4a:'audio/mp4',aac:'audio/aac',amr:'audio/amr',pdf:'application/pdf'};
function withType(f){if(f.type)return f;const t=EXT_TYPES[String(f.name||'').split('.').pop().toLowerCase()];try{return t?new File([f],f.name,{type:t,lastModified:f.lastModified}):f}catch{return f}}
function kindOfFile(f){const t=f.type||'';return t.startsWith('image')?'image':t.startsWith('video')?'video':t.startsWith('audio')?'audio':'document'}
function sendFileMessage(lead,file,{caption='',kind,duration=0}={}){
 kind=kind||kindOfFile(file);
 const local=['image','video','audio','voice'].includes(kind)?URL.createObjectURL(file):'';
 const msg=pushLocal(lead,{role:'assistant',content:caption,attachment:{kind,type:file.type,name:kind==='voice'?'Voice message':file.name,size:file.size,url:local,...(duration?{duration}:{})}});
 let upFile=null;
 msg._retry=async()=>{setMsgStatus(lead,msg,'pending');try{upFile=upFile||(kind==='image'?await shrinkImage(file):file);const d=await uploadFile(lead,upFile,{caption,kind:kind==='voice'?'voice':'',duration});const u=d?.data?.attachments?.[0]?.data_url;if(u&&!local)msg.attachment.url=u;setMsgStatus(lead,msg,null)}catch(e){setMsgStatus(lead,msg,'failed',e.message);toast('Not sent: '+failReason(e.message))}};
 return msg._retry();
}

function pickFiles(accept,camera){closePopovers();if(!current)return;const inp=$('fileInput');inp.value='';inp.accept=accept||'';inp.multiple=!camera;if(camera)inp.setAttribute('capture','environment');else inp.removeAttribute('capture');inp.click()}

 const big=files.filter(f=>f.size>MAX_FILE);if(big.length)toast(`${big.length} file(s) over 40 MB skipped`);

}

function lastCustomerAt(lead){let t=lead.LastCustomerMsgAt||'';const h=hist(lead);for(let i=h.length-1;i>=0;i--){if(isOut(h[i]))continue;const ts=h[i].ts||h[i].timestamp||h[i].created_at;if(ts&&(!t||new Date(ts)>new Date(t)))t=ts;break}return t}
function windowOpen(lead){const t=lastCustomerAt(lead);return !t||isNaN(new Date(t))||Date.now()-new Date(t)<24*3600*1000}
function updateHandoverBar(){const b=$('handoverBar');if(!b||!current)return;b.classList.toggle('hidden',!takenOver(current));renderHeaderCtl()}
// Outside the window WhatsApp drops free text, so the composer is locked to templates (notes
// still work) instead of letting someone type a reply that will never arrive.
function updateWindowBar(){const b=$('windowBar');if(!b||!current)return;const closed=!isIg(current)&&!windowOpen(current);b.classList.toggle('hidden',!closed);applyLock(closed)}
function applyLock(closed){const box=$('msg'),wrap=$('inputWrap');if(!box||!wrap)return;const lock=closed&&composeMode==='reply';box.disabled=lock;wrap.classList.toggle('locked',lock);box.placeholder=lock?'Session expired — send a template to restart the chat':composeMode==='note'?'Add a private note (only your team sees this)':'Type a message';['camBtn','emojiBtn'].forEach(id=>{const x=$(id);if(x&&!isIg(current))x.disabled=lock});document.querySelectorAll('#attachMenu button').forEach(x=>{if(!/Template/.test(x.textContent))x.disabled=lock});const a=$('actionBtn');if(a)a.disabled=lock&&actionState()!=='send'}

const tplBody=t=>tplComp(t,'BODY')?.text||'';
const tplVarNames=txt=>[...new Set((String(txt||'').match(/\{\{\s*\w+\s*\}\}/g)||[]).map(x=>x.replace(/[{}\s]/g,'')))];
const tplButtons=t=>(tplComp(t,'BUTTONS')?.buttons||[]).map(b=>b.text).filter(Boolean);
const tplFill=(txt,vals)=>String(txt||'').replace(/\{\{\s*(\w+)\s*\}\}/g,(m,k)=>vals[k]||m);
async function openTemplates(){

 let ov=$('tplOv');if(!ov){ov=document.createElement('div');ov.id='tplOv';ov.className='overlay tpl-ov';document.body.appendChild(ov)}

 ov.innerHTML=`<div class="bar"><button class="icon-btn" title="Close" onclick="tplBack()">${IC.close}</button><div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Send a template to <b>${esc(who(current)||'contact')}</b></div><button class="icon-btn" title="Reload templates" onclick="loadTemplateList(true)">↻</button></div><div class="tpl-main" id="tplMain"><div class="tpl-list"><div class="search-wrap"><div class="searchbox"><span>⌕</span><input id="tplSearch" placeholder="Search templates" oninput="drawTemplateList()"></div></div><div class="tpl-items" id="tplItems"><div class="tpl-empty"><div class="spinner"></div>Loading approved templates…</div></div></div><div class="tpl-detail" id="tplDetail"><div class="tpl-empty">Choose a template to preview it.</div></div></div>`;

async function loadTemplateList(force){

 try{if(force||!tplCache[key]){const d=await apiJson(WORKER+'/wa/templates'+(key?`?inbox_id=${encodeURIComponent(key)}`:''));tplCache[key]=(d.data||[]).filter(t=>String(t.status||'').toUpperCase()==='APPROVED').sort((a,b)=>String(a.name).localeCompare(String(b.name)))}tplList=tplCache[key];drawTemplateList()}

function drawTemplateList(){
 const el=$('tplItems');if(!el)return;const q=($('tplSearch')?.value||'').trim().toLowerCase();

function pickTemplate(i){

 const t=tplSel,hdr=tplComp(t,'HEADER'),fmt=String(hdr?.format||'').toUpperCase(),vars=tplVarNames(tplBody(t)),hvars=fmt==='TEXT'?tplVarNames(hdr.text):[];

 // {{1}} is almost always the customer's name — prefill it, the rep can overwrite.

function tplValues(){const t=tplSel,o={body:{},head:{}};tplVarNames(tplBody(t)).forEach(v=>o.body[v]=($('tplV_'+v)?.value||'').trim());const h=tplComp(t,'HEADER');if(String(h?.format).toUpperCase()==='TEXT')tplVarNames(h.text).forEach(v=>o.head[v]=($('tplH_'+v)?.value||'').trim());o.media=($('tplMedia')?.value||'').trim();return o}

 const el=$('tplPreview');if(!el||!tplSel)return;const r=tplRendered();
 const media=['IMAGE','VIDEO','DOCUMENT'].includes(r.fmt)?(r.fmt==='IMAGE'&&/^https:\/\/.+/.test(r.v.media)?`<img class="media" src="${esc(r.v.media)}" alt="">`:`<div class="tpl-media-ph">${esc(r.fmt.toLowerCase())} header</div>`):'';
 el.innerHTML=`<div class="bubble out tail">${media}${r.head?`<div class="tpl-hdr">${esc(r.head)}</div>`:''}${fmtText(r.body)}${r.foot?`<div class="tpl-foot">${esc(r.foot)}</div>`:''}<span class="meta">${esc(fmtTime(new Date().toISOString()))}</span>${r.buttons.length?`<div class="tpl-btns">${r.buttons.map(b=>`<div>${esc(b)}</div>`).join('')}</div>`:''}</div>`;

async function sendTemplate(){
 const lead=current,t=tplSel;if(!lead||!t)return;
 const r=tplRendered(),err=$('tplErr');
 if([...Object.values(r.v.body),...Object.values(r.v.head)].some(x=>!x)){err.textContent='Fill in every variable.';return}
 const mediaHeader=['IMAGE','VIDEO','DOCUMENT'].includes(r.fmt);
 if(mediaHeader&&!/^https:\/\/\S+$/.test(r.v.media)){err.textContent='Add an https link for the header '+r.fmt.toLowerCase()+'.';return}
 const phone=String(lead.Phone||'').replace(/[^0-9]/g,''),conv=convId(lead);
 if(!conv&&!phone){err.textContent='This contact has no phone number.';return}
 const content=[r.head?`*${r.head}*`:'',r.body,r.foot?`_${r.foot}_`:''].filter(Boolean).join('\n\n');

 msg._retry=async()=>{setMsgStatus(lead,msg,'pending');try{
  // Chatwoot's template_params only carries positional body values, so named variables, header
  // values and media headers go straight to Meta — the same fallback Leads → Send Template uses.
  if(!conv||named||mediaHeader||Object.keys(r.v.head).length){
   const components=[];

   await apiJson(WORKER+'/wa/send-template',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,template_name:t.name,language:lang,components,inbox_id:lead.InboxId||undefined,lead_id:lead.Id,content,buttons:r.buttons})});
  }else{

   await apiJson(WORKER+'/broadcast/send-template',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conv_id:conv,content,template_name:t.name,category:t.category||'MARKETING',language:lang,processed_params,lead_id:lead.Id,buttons:r.buttons})});
  }

// ── Voice recording ──────────────────────────────────────────────────────────────────────────
// Hold the mic to record and release to send (slide left to cancel), or tap it to lock recording
// hands-free and then pause / preview / delete / send. Browsers record webm (Chrome), mp4 (Safari)
// or ogg/opus (Firefox); WhatsApp only takes ogg/opus, mp3, aac/m4a and amr, so anything that

 const b=$('actionBtn');

 b.onpointermove=e=>{if(!hold)return;const dx=hold.x-e.clientX;const hint=$('recHint');if(hint)hint.style.transform=`translateX(${-Math.max(0,dx)/2}px)`;if(dx>110){hold=null;b.classList.remove('holding');cancelRecording();toast('Recording cancelled')}};

 b.onpointerup=release;b.onpointercancel=release;
 b.onclick=()=>{if(suppressClick){suppressClick=false;return}const s=actionState();if(s==='mic')startRecording();else if(s==='rec')finishRecording();else sendMessage()};
 b.oncontextmenu=e=>e.preventDefault();

function showRecUI(on){$('inputWrap').classList.toggle('hidden',on);$('recRow').classList.toggle('hidden',!on);$('modeRow').classList.toggle('hidden',on);closePopovers();if(on){$('recRow').classList.remove('paused');$('recPause').innerHTML=IC.pause;$('recPause').title='Pause';$('recPlay').classList.add('hidden');showRecHint(!!hold)}updateAction()}

let jspdfLoading=null;
function loadJsPdf(){if(window.jspdf)return Promise.resolve();return jspdfLoading||(jspdfLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='vendor/jspdf/jspdf.umd.min.js';s.onload=res;s.onerror=()=>{jspdfLoading=null;rej(new Error('PDF library unavailable'))};document.head.appendChild(s)}))}
async function exportPdf(){
 toggleMenu(false);const l=current;if(!l)return;
 try{await loadJsPdf()}catch(e){toast(e.message);return}
 const doc=new jspdf.jsPDF({unit:'pt',format:'a4'}),W=doc.internal.pageSize.getWidth()-80,H=doc.internal.pageSize.getHeight();let y=50;
 const line=(t,size=10,color=[17,27,33])=>{doc.setFontSize(size);doc.setTextColor(...color);for(const part of doc.splitTextToSize(t,W)){if(y>H-50){doc.addPage();y=50}doc.text(part,40,y);y+=size+4}};
 line(`Chat with ${who(l)||'contact'}`,15);line(`${l.Phone||''} · exported ${new Date().toLocaleString()}`,9,[102,119,129]);y+=8;
 // jsPDF's built-in fonts are Latin-1 only; other scripts (Malayalam, emoji) are replaced so the file still opens.
 const latin=t=>String(t||'').replace(/[^\x09\x0A\x0D\x20-\xFF]/g,'?');
 for(const m of hist(l)){const t=m.ts?new Date(m.ts).toLocaleString():'';if(m.kind==='event'){line(latin(`— ${m.content} (${t})`),9,[102,119,129]);continue}const who=isOut(m)?(senderOf(m)?.label||'Business'):(l.Name||'Customer');line(latin(`${who} · ${t}`),9,[0,128,105]);const atts=attachmentsOf(m).map(a=>`[${kindLabel(a)}]`).join(' ');line(latin(bodyOf(m)+(atts?' '+atts:'')));y+=4}
 doc.save(`chat-${String(who(l)||l.Id).replace(/[^\w-]+/g,'_')}.pdf`);
}

// ── Advanced filter + saved views ──
const FB_FIELDS={label:['Label',['has','not_has']],assignee:['Assigned to',['eq','neq']],status:['Status',['eq','neq']],handler:['Handled by',['eq']],channel:['Channel',['eq']],priority:['Priority',['gte','eq']],unread:['Unread',['eq']],last_message_age:['Last message (hours ago)',['gt','lt']],waiting_age:['Waiting (minutes)',['gt']]};
const FB_OPS={has:'has',not_has:"doesn't have",eq:'is',neq:'is not',gte:'at least',gt:'more than',lt:'less than'};
let fbRows=[];
function fbValueInput(r,i){const opts=(list)=>`<select onchange="fbRows[${i}].v=this.value">${list.map(([v,n])=>`<option value="${esc(v)}"${String(r.v)===String(v)?' selected':''}>${esc(n)}</option>`).join('')}</select>`;
 if(r.f==='assignee')return opts([['me','Me'],['','Nobody'],...agentsList().map(a=>[a.email,a.name])]);if(r.f==='status')return opts([['open','Open'],['pending','Pending'],['snoozed','Snoozed'],['resolved','Resolved']]);if(r.f==='handler')return opts([['human','👤 Human'],['bot','🤖 Bot']]);if(r.f==='channel')return opts([['whatsapp','WhatsApp'],['instagram','Instagram']]);if(r.f==='priority')return opts(PRIO.map((n,k)=>[k,n]));if(r.f==='unread')return opts([['true','Yes'],['false','No']]);if(r.f==='label')return `<input list="lblOpts2" value="${esc(r.v??'')}" oninput="fbRows[${i}].v=this.value"><datalist id="lblOpts2">${(boot2?.labels||[]).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;return `<input type="number" min="0" value="${esc(r.v??'')}" oninput="fbRows[${i}].v=this.value">`}
function fbDefault(f){return {f,op:FB_FIELDS[f][1][0],v:f==='assignee'?'me':f==='status'?'open':f==='handler'?'human':f==='channel'?'whatsapp':f==='priority'?3:f==='unread'?'true':f==='label'?(boot2?.labels?.[0]||''):2}}
function openFilterBuilder(btn){
 if(!fbRows.length)fbRows=customView&&!customView.id?JSON.parse(JSON.stringify(customView.filter.all)):[fbDefault('label')];
 const draw=()=>fbRows.map((r,i)=>`<div class="fb-row"><select onchange="fbRows[${i}]=fbDefault(this.value);openFilterBuilder(document.getElementById('filterBtn'))">${Object.entries(FB_FIELDS).map(([k,[n]])=>`<option value="${k}"${r.f===k?' selected':''}>${esc(n)}</option>`).join('')}</select><select onchange="fbRows[${i}].op=this.value">${FB_FIELDS[r.f][1].map(o=>`<option value="${o}"${r.op===o?' selected':''}>${FB_OPS[o]}</option>`).join('')}</select>${fbValueInput(r,i)}<button title="Remove" onclick="fbRows.splice(${i},1);openFilterBuilder(document.getElementById('filterBtn'))">✕</button></div>`).join('');
 openDd(btn,`<div class="hint">Show chats where ALL of these are true</div>${draw()}<button onclick="fbRows.push(fbDefault('assignee'));openFilterBuilder(document.getElementById('filterBtn'))">＋ Add condition</button><hr><button onclick="applyFilterRows()">Apply</button><div class="fb-row"><input id="viewName" placeholder="Save as view, e.g. Hot leads Kerala" maxlength="60"><label style="font-size:12px;display:flex;gap:3px;align-items:center"><input type="checkbox" id="viewShared" style="width:auto;height:auto">Team</label><button onclick="saveView()">Save</button></div>${customView?'<button onclick="clearCustomView()">Clear filter</button>':''}`);
 const dd=$('ddMenu');if(dd)dd.style.maxWidth='420px';
}
function fbNormal(){return {all:fbRows.map(r=>({f:r.f,op:r.op,v:['priority','last_message_age','waiting_age'].includes(r.f)?Number(r.v)||0:r.f==='unread'?String(r.v)==='true':r.v}))}}
function applyFilterRows(){customView={id:null,filter:fbNormal()};closeDd();onViewChange()}
function clearCustomView(){customView=null;fbRows=[];closeDd();onViewChange()}
function applyView(id){const v=(boot2?.views||[]).find(x=>x.id===id);if(!v)return;if(customView?.id===id){customView=null}else{customView={id,filter:v.filter};filter='all'}onViewChange()}
async function saveView(){const name=($('viewName')?.value||'').trim();if(!name)return toast('Name the view first');try{await apiJson(WORKER+'/chats/v2/views',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,filter:fbNormal(),shared:!!$('viewShared')?.checked})});closeDd();await loadBootstrap();const v=boot2.views.find(x=>x.name===name);if(v)applyView(v.id);else renderFilters([]);toast('View saved')}catch(e){toast('Could not save view: '+e.message)}}
async function deleteView(id){const v=(boot2?.views||[]).find(x=>x.id===id);if(!v||!confirm(`Delete the view “${v.name}”?`))return;try{await apiJson(WORKER+'/chats/v2/views?id='+id,{method:'DELETE'});if(customView?.id===id)customView=null;await loadBootstrap();onViewChange()}catch(e){toast(e.message)}}
// Same rules as chats-v2.js chatsV2CompileFilter, for rows arriving through live deltas.
function evalFilter(r,f){const now=Date.now();return (f?.all||[]).every(c=>{const v=c.v;switch(c.f){case'label':{const has=String(r.labels_key||'').includes(','+lc(v)+',');return c.op==='has'?has:!has}case'assignee':{const e=v==='me'?meEmail:lc(v);return c.op==='eq'?lc(r.assignee_email)===e:lc(r.assignee_email)!==e}case'status':return c.op==='eq'?r.status===v:r.status!==v;case'handler':return v==='human'?r.handover==='Yes':r.handover!=='Yes';case'channel':return (r.channel||'whatsapp')===v;case'priority':return c.op==='gte'?(r.priority||0)>=Number(v):(r.priority||0)===Number(v);case'unread':return (v===true||v==='true')?r.unread_count>0:!(r.unread_count>0);case'last_message_age':{const age=(now-new Date(r.last_message_at))/3600e3;return c.op==='gt'?age>Number(v):age<Number(v)}case'waiting_age':return !!r.waiting_since&&!['resolved','snoozed'].includes(r.status)&&(now-new Date(r.waiting_since))/60e3>=Number(v);default:return true}})}

let tsHits=[],tsIdx=-1;
function searchThread(q){
 q=String(q||'').trim().toLowerCase();const t=$('thread');if(!t)return;
 t.querySelectorAll('mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));t.normalize();
 tsHits=[];
 t.querySelectorAll('.bubble').forEach(b=>{const hit=!q||b.textContent.toLowerCase().includes(q);b.style.opacity=hit?'1':'.22';if(!q||!hit)return;
  const w=document.createTreeWalker(b,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.meta,.msg-actions,.who')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){const txt=n.nodeValue,low=txt.toLowerCase();let at=low.indexOf(q);if(at<0)continue;const frag=document.createDocumentFragment();let last=0;while(at>=0){frag.append(txt.slice(last,at));const m=document.createElement('mark');m.textContent=txt.slice(at,at+q.length);frag.append(m);tsHits.push(m);last=at+q.length;at=low.indexOf(q,last)}frag.append(txt.slice(last));n.replaceWith(frag)}
 });
 const nav=$('tsCount');if(nav)nav.textContent=q?(tsHits.length?`${Math.max(1,tsIdx+1)}/${tsHits.length}`:'0/0'):'';
 if(q&&tsHits.length){tsIdx=tsIdx<0?tsHits.length-1:Math.min(tsIdx,tsHits.length-1);stepThreadSearch(0)}else tsIdx=-1;
}
function stepThreadSearch(d){if(!tsHits.length)return;tsIdx=(tsIdx+d+tsHits.length)%tsHits.length;tsHits.forEach((m,k)=>m.classList.toggle('cur',k===tsIdx));tsHits[tsIdx].scrollIntoView({block:'center'});const nav=$('tsCount');if(nav)nav.textContent=`${tsIdx+1}/${tsHits.length}`}

window.addEventListener('message',async e=>{
 if(!embedded||e.source!==window.parent||e.data?.source!=='lv-dashboard')return;
 const {channel:ch,leadId}=e.data;
 // m.html: the phone's Back button closes the open chat; Home's tiles open a filtered list.

 if(ch&&ch!==channel)setChannel(ch);
 if(e.data.filter&&e.data.filter!==filter)setFilter(e.data.filter);
 if(!leadId)return;
 // A live-message ping for the conversation already on screen just refreshes it — reopening
 // would throw away the reply target and composer state.
 if(current&&String(current.Id)===String(leadId))return refreshMessages(current);
 if(!leads.some(l=>String(l.Id)===String(leadId)))await loadLeads(false,true);

 if(lead){if(isIg(lead)!==(channel==='instagram'))setChannel(isIg(lead)?'instagram':'whatsapp');openConversation(lead.Id)}
});
