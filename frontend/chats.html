.msg-actions{display:flex;gap:2px;opacity:0;transition:opacity .12s}.bubble-row:hover .msg-actions,.msg-actions:focus-within{opacity:1}.msg-actions button{width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:#54656f;display:grid;place-items:center;padding:0;box-shadow:0 1px 2px rgba(0,0,0,.1)}

async function sendTemplate(){
 const lead=current,t=tplSel;if(!lead||!t)return;

 if([...Object.values(r.v.body),...Object.values(r.v.head)].some(x=>!x)){err.textContent='Fill in every variable.';return}
 const mediaHeader=['IMAGE','VIDEO','DOCUMENT'].includes(r.fmt);

  // Chatwoot's template_params only carries positional body values, so named variables, header

  if(!conv||named||mediaHeader||Object.keys(r.v.head).length){
   const components=[];
   if(Object.keys(r.v.head).length)components.push({type:'header',parameters:Object.values(r.v.head).map(text=>({type:'text',text}))});
   if(mediaHeader){const k=r.fmt.toLowerCase();components.push({type:'header',parameters:[{type:k,[k]:{link:r.v.media}}]})}

  }else{
   const processed_params={};names.forEach(n=>processed_params[n]=r.v.body[n]);

// ── Voice recording ──────────────────────────────────────────────────────────────────────────
// Hold the mic to record and release to send (slide left to cancel), or tap it to lock recording
// hands-free and then pause / preview / delete / send. Browsers record webm (Chrome), mp4 (Safari)
// or ogg/opus (Firefox); WhatsApp only takes ogg/opus, mp3, aac/m4a and amr, so anything that
// isn't already ogg/opus is transcoded to mp3 in the browser before it goes to /quote/send.
let rec=null,hold=null,suppressClick=false;
const MAX_REC_MS=15*60*1000;
function wireActionButton(){
 const b=$('actionBtn');
 b.onpointerdown=e=>{if(actionState()!=='mic'||e.button>0)return;e.preventDefault();hold={x:e.clientX,t:Date.now()};try{b.setPointerCapture(e.pointerId)}catch{}b.classList.add('holding');startRecording()};
 b.onpointermove=e=>{if(!hold)return;const dx=hold.x-e.clientX;const hint=$('recHint');if(hint)hint.style.transform=`translateX(${-Math.max(0,dx)/2}px)`;if(dx>110){hold=null;b.classList.remove('holding');cancelRecording();toast('Recording cancelled')}};

 b.onpointerup=release;b.onpointercancel=release;
 b.onclick=()=>{if(suppressClick){suppressClick=false;return}const s=actionState();if(s==='mic')startRecording();else if(s==='rec')finishRecording();else sendMessage()};
 b.oncontextmenu=e=>e.preventDefault();

function showRecUI(on){$('inputWrap').classList.toggle('hidden',on);$('recRow').classList.toggle('hidden',!on);$('modeRow').classList.toggle('hidden',on);closePopovers();if(on){$('recRow').classList.remove('paused');$('recPause').innerHTML=IC.pause;$('recPause').title='Pause';$('recPlay').classList.add('hidden');showRecHint(!!hold)}updateAction()}

function recElapsed(r=rec){return r?r.acc+(r.paused||!r.since?0:Date.now()-r.since):0}
async function startRecording(){

 if(!convId(current)){toast('No linked WhatsApp conversation');hold=null;$('actionBtn')?.classList.remove('holding');return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Voice recording is not supported in this browser');hold=null;return}

function tickRec(){

function drawWave(levels){const c=$('recWave');if(!c||c.classList.contains('hidden'))return;const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w)return;if(c.width!==w*dpr){c.width=w*dpr;c.height=h*dpr}const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);g.fillStyle='#8696a0';const step=4,n=Math.floor(w/step);const vis=levels.slice(-n);vis.forEach((v,i)=>{const bh=Math.max(2,v*h);g.fillRect(w-(vis.length-i)*step,(h-bh)/2,2.4,bh)})}

let mentionHits=[],mentionSel=0;
function mentionQuery(){const b=$('msg');if(!b||composeMode!=='note')return null;const before=b.value.slice(0,b.selectionStart??b.value.length);const m=before.match(/(^|\s)@([\w.-]{0,30})$/);return m?{q:m[2].toLowerCase(),start:before.length-m[2].length-1}:null}
function checkMention(){
 const p=$('cannedPanel');if(!p)return;const mq=V2?mentionQuery():null;if(!mq){if(composeMode==='note')p.classList.add('hidden');return}
 mentionHits=agentsList().filter(a=>a.email!==meEmail&&(!mq.q||a.name.toLowerCase().includes(mq.q)||a.email.includes(mq.q))).slice(0,6);mentionSel=Math.min(mentionSel,Math.max(0,mentionHits.length-1));
 if(!mentionHits.length){p.classList.add('hidden');return}
 p.innerHTML=mentionHits.map((a,i)=>`<button type="button" class="${i===mentionSel?'sel':''}" onmousedown="event.preventDefault();insertMention(${i})"><b>@${esc(a.name)}</b><small>${esc(a.email)}</small></button>`).join('');p.classList.remove('hidden');
}
function mentionKey(e){const p=$('cannedPanel');if(composeMode!=='note'||!p||p.classList.contains('hidden')||!mentionHits.length)return false;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();mentionSel=(mentionSel+(e.key==='ArrowDown'?1:-1)+mentionHits.length)%mentionHits.length;checkMention();return true}if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();insertMention(mentionSel);return true}if(e.key==='Escape'){p.classList.add('hidden');return true}return false}
function insertMention(i){const a=mentionHits[i],mq=mentionQuery();if(!a||!mq)return;const b=$('msg'),end=b.selectionStart??b.value.length,tag='@'+a.name.replace(/\s+/g,'_')+' ';b.value=b.value.slice(0,mq.start)+tag+b.value.slice(end);b.selectionStart=b.selectionEnd=mq.start+tag.length;$('cannedPanel').classList.add('hidden');b.focus();grow(b)}
function sendMentions(lead,text){if(!V2)return;for(const a of agentsList()){if(a.email===meEmail)continue;const tag='@'+a.name.replace(/\s+/g,'_');if(text.toLowerCase().includes(tag.toLowerCase())||text.toLowerCase().includes('@'+a.email))wsSend({type:'mention',lead_id:lead.Id,to:a.email})}}

const FB_FIELDS={label:['Label',['has','not_has']],assignee:['Assigned to',['eq','neq']],status:['Status',['eq','neq']],handler:['Handled by',['eq']],channel:['Channel',['eq']],priority:['Priority',['gte','eq']],unread:['Unread',['eq']],last_message_age:['Last message (hours ago)',['gt','lt']],waiting_age:['Waiting (minutes)',['gt']]};
const FB_OPS={has:'has',not_has:"doesn't have",eq:'is',neq:'is not',gte:'at least',gt:'more than',lt:'less than'};
let fbRows=[];
function fbValueInput(r,i){const opts=(list)=>`<select onchange="fbRows[${i}].v=this.value">${list.map(([v,n])=>`<option value="${esc(v)}"${String(r.v)===String(v)?' selected':''}>${esc(n)}</option>`).join('')}</select>`;
 if(r.f==='assignee')return opts([['me','Me'],['','Nobody'],...agentsList().map(a=>[a.email,a.name])]);if(r.f==='status')return opts([['open','Open'],['pending','Pending'],['snoozed','Snoozed'],['resolved','Resolved']]);if(r.f==='handler')return opts([['human','👤 Human'],['bot','🤖 Bot']]);if(r.f==='channel')return opts([['whatsapp','WhatsApp'],['instagram','Instagram']]);if(r.f==='priority')return opts(PRIO.map((n,k)=>[k,n]));if(r.f==='unread')return opts([['true','Yes'],['false','No']]);if(r.f==='label')return `<input list="lblOpts2" value="${esc(r.v??'')}" oninput="fbRows[${i}].v=this.value"><datalist id="lblOpts2">${(boot2?.labels||[]).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;return `<input type="number" min="0" value="${esc(r.v??'')}" oninput="fbRows[${i}].v=this.value">`}
function fbDefault(f){return {f,op:FB_FIELDS[f][1][0],v:f==='assignee'?'me':f==='status'?'open':f==='handler'?'human':f==='channel'?'whatsapp':f==='priority'?3:f==='unread'?'true':f==='label'?(boot2?.labels?.[0]||''):2}}
function openFilterBuilder(btn){
 if(!fbRows.length)fbRows=customView&&!customView.id?JSON.parse(JSON.stringify(customView.filter.all)):[fbDefault('label')];
 const draw=()=>fbRows.map((r,i)=>`<div class="fb-row"><select onchange="fbRows[${i}]=fbDefault(this.value);openFilterBuilder(document.getElementById('filterBtn'))">${Object.entries(FB_FIELDS).map(([k,[n]])=>`<option value="${k}"${r.f===k?' selected':''}>${esc(n)}</option>`).join('')}</select><select onchange="fbRows[${i}].op=this.value">${FB_FIELDS[r.f][1].map(o=>`<option value="${o}"${r.op===o?' selected':''}>${FB_OPS[o]}</option>`).join('')}</select>${fbValueInput(r,i)}<button title="Remove" onclick="fbRows.splice(${i},1);openFilterBuilder(document.getElementById('filterBtn'))">✕</button></div>`).join('');
 openDd(btn,`<div class="hint">Show chats where ALL of these are true</div>${draw()}<button onclick="fbRows.push(fbDefault('assignee'));openFilterBuilder(document.getElementById('filterBtn'))">＋ Add condition</button><hr><button onclick="applyFilterRows()">Apply</button><div class="fb-row"><input id="viewName" placeholder="Save as view, e.g. Hot leads Kerala" maxlength="60"><label style="font-size:12px;display:flex;gap:3px;align-items:center"><input type="checkbox" id="viewShared" style="width:auto;height:auto">Team</label><button onclick="saveView()">Save</button></div>${customView?'<button onclick="clearCustomView()">Clear filter</button>':''}`);
 const dd=$('ddMenu');if(dd)dd.style.maxWidth='420px';
}
function fbNormal(){return {all:fbRows.map(r=>({f:r.f,op:r.op,v:['priority','last_message_age','waiting_age'].includes(r.f)?Number(r.v)||0:r.f==='unread'?String(r.v)==='true':r.v}))}}

async function saveView(){const name=($('viewName')?.value||'').trim();if(!name)return toast('Name the view first');try{await apiJson(WORKER+'/chats/v2/views',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,filter:fbNormal(),shared:!!$('viewShared')?.checked})});closeDd();await loadBootstrap();const v=boot2.views.find(x=>x.name===name);if(v)applyView(v.id);else renderFilters([]);toast('View saved')}catch(e){toast('Could not save view: '+e.message)}}

// Same rules as chats-v2.js chatsV2CompileFilter, for rows arriving through live deltas.
function evalFilter(r,f){const now=Date.now();return (f?.all||[]).every(c=>{const v=c.v;switch(c.f){case'label':{const has=String(r.labels_key||'').includes(','+lc(v)+',');return c.op==='has'?has:!has}case'assignee':{const e=v==='me'?meEmail:lc(v);return c.op==='eq'?lc(r.assignee_email)===e:lc(r.assignee_email)!==e}case'status':return c.op==='eq'?r.status===v:r.status!==v;case'handler':return v==='human'?r.handover==='Yes':r.handover!=='Yes';case'channel':return (r.channel||'whatsapp')===v;case'priority':return c.op==='gte'?(r.priority||0)>=Number(v):(r.priority||0)===Number(v);case'unread':return (v===true||v==='true')?r.unread_count>0:!(r.unread_count>0);case'last_message_age':{const age=(now-new Date(r.last_message_at))/3600e3;return c.op==='gt'?age>Number(v):age<Number(v)}case'waiting_age':return !!r.waiting_since&&!['resolved','snoozed'].includes(r.status)&&(now-new Date(r.waiting_since))/60e3>=Number(v);default:return true}})}

function newMacro(btn){
 const steps=macroDraft.map((o,i)=>`<div class="fb-row"><span style="flex:1;font-size:13px">${i+1}. ${esc(macroLabel(o))}</span><button onclick="macroDraft.splice(${i},1);newMacro(document.querySelector('.info-panel .row-btn:last-of-type')||this)">✕</button></div>`).join('');
 openDd(btn,`<input id="macroName" placeholder="Macro name, e.g. Mark as Hot lead" maxlength="60" value="${esc(macroDraft.name||'')}" oninput="macroDraft.name=this.value">${steps||'<div class="hint">Add steps below</div>'}<div class="fb-row"><select id="macroOp"><option value="label_add">Add label</option><option value="assign">Assign to</option><option value="priority">Set priority</option><option value="handler">Take over from bot</option><option value="resolve">Resolve</option><option value="pending">Mark pending</option></select><input id="macroArg" placeholder="label / email / 0-4" list="macroArgs"><datalist id="macroArgs">${[...(boot2?.labels||[]),...agentsList().map(a=>a.email)].map(x=>`<option value="${esc(x)}">`).join('')}</datalist><button onclick="addMacroStep(this)">＋</button></div><hr><button onclick="saveMacro()">Save macro</button>`);
}
function addMacroStep(btn){const op=$('macroOp').value,v=($('macroArg').value||'').trim();const args=op==='label_add'?{label:v}:op==='assign'?{email:v}:op==='priority'?{value:Math.max(0,Math.min(4,Number(v)||0))}:op==='handler'?{mode:'human'}:{};if(op==='label_add'&&!v)return toast('Type the label');macroDraft.push({op,args});newMacro(btn)}
async function saveMacro(){const name=(macroDraft.name||'').trim();if(!name||!macroDraft.length)return toast('Name the macro and add a step');try{await apiJson(WORKER+'/chats/v2/macros',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,ops:macroDraft})});macroDraft=[];closeDd();await loadBootstrap();renderInfo();toast('Macro saved')}catch(e){toast('Could not save: '+e.message)}}
async function setPending(){closeDd();try{await act('pending');toast('Marked as pending')}catch(e){toast('Could not update: '+e.message)}}
function copyPhone(){navigator.clipboard?.writeText(current.Phone||'');toggleMenu(false);toast('Number copied')}
function goLead(){toggleMenu(false);if(embedded){toParent('openLead',{leadId:current.Id});return}location.href=`dashboard.html?client=${encodeURIComponent(clientId)}&token=${encodeURIComponent(sessionToken)}&lead=${encodeURIComponent(current.Id)}`}
function goBack(){if(embedded){toParent('home');return}if(window.opener&&!window.opener.closed){window.opener.focus();window.close();}else if(history.length>1){history.back();}else{location.href='dashboard.html?client='+encodeURIComponent(clientId)+'&token='+encodeURIComponent(sessionToken);}}
let tsHits=[],tsIdx=-1;
function searchThread(q){
 q=String(q||'').trim().toLowerCase();const t=$('thread');if(!t)return;
 t.querySelectorAll('mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));t.normalize();
 tsHits=[];
 t.querySelectorAll('.bubble').forEach(b=>{const hit=!q||b.textContent.toLowerCase().includes(q);b.style.opacity=hit?'1':'.22';if(!q||!hit)return;
  const w=document.createTreeWalker(b,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.meta,.msg-actions,.who')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){const txt=n.nodeValue,low=txt.toLowerCase();let at=low.indexOf(q);if(at<0)continue;const frag=document.createDocumentFragment();let last=0;while(at>=0){frag.append(txt.slice(last,at));const m=document.createElement('mark');m.textContent=txt.slice(at,at+q.length);frag.append(m);tsHits.push(m);last=at+q.length;at=low.indexOf(q,last)}frag.append(txt.slice(last));n.replaceWith(frag)}
 });
 const nav=$('tsCount');if(nav)nav.textContent=q?(tsHits.length?`${Math.max(1,tsIdx+1)}/${tsHits.length}`:'0/0'):'';
 if(q&&tsHits.length){tsIdx=tsIdx<0?tsHits.length-1:Math.min(tsIdx,tsHits.length-1);stepThreadSearch(0)}else tsIdx=-1;
}
function stepThreadSearch(d){if(!tsHits.length)return;tsIdx=(tsIdx+d+tsHits.length)%tsHits.length;tsHits.forEach((m,k)=>m.classList.toggle('cur',k===tsIdx));tsHits[tsIdx].scrollIntoView({block:'center'});const nav=$('tsCount');if(nav)nav.textContent=`${tsIdx+1}/${tsHits.length}`}

// Close popovers/menus on outside click; Esc backs out of whatever is open, innermost first.
document.addEventListener('click',e=>{if(!ddJustOpened&&!e.target.closest('.dd'))closeDd();if(!e.target.closest('.popover,#emojiBtn,#attachBtn'))closePopovers();if(!e.target.closest('.chat-actions'))$('chatMenu')?.classList.add('hidden')});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('tplOv')&&!$('tplOv').classList.contains('hidden'))return tplBack();if(!$('lightbox')?.classList.contains('hidden')&&$('lightbox'))return $('lightbox').classList.add('hidden');if($('previewOv')&&!$('previewOv').classList.contains('hidden'))return closePreview();if(rec)return cancelRecording();if(document.querySelector('.popover:not(.hidden)'))return closePopovers();if(replyTarget)return clearReply();if($('chatMenu')&&!$('chatMenu').classList.contains('hidden'))return toggleMenu(false)});
window.addEventListener('message',async e=>{
 if(!embedded||e.source!==window.parent||e.data?.source!=='lv-dashboard')return;
 const {channel:ch,leadId}=e.data;
 if(ch&&ch!==channel)setChannel(ch);
 if(!leadId)return;
 // A live-message ping for the conversation already on screen just refreshes it — reopening
 // would throw away the reply target and composer state.
 if(current&&String(current.Id)===String(leadId))return refreshMessages(current);
 if(!leads.some(l=>String(l.Id)===String(leadId)))await loadLeads(false,true);
 const lead=leads.find(l=>String(l.Id)===String(leadId));
 if(lead){if(isIg(lead)!==(channel==='instagram'))setChannel(isIg(lead)?'instagram':'whatsapp');openConversation(lead.Id)}
});
window.addEventListener('beforeunload',()=>{if(current&&$('msg'))saveDraft(current.Id,$('msg').value)});

$('list').addEventListener('scroll',()=>requestAnimationFrame(paintList),{passive:true});
$('list').addEventListener('contextmenu',e=>{const row=e.target.closest('.contact');if(!row||!V2)return;e.preventDefault();rowMenu(row.dataset.id,e.clientX,e.clientY)});
{let lp=null;$('list').addEventListener('touchstart',e=>{const row=e.target.closest('.contact');if(!row||!V2)return;const p=e.touches[0];lp=setTimeout(()=>{lp=null;navigator.vibrate?.(15);rowMenu(row.dataset.id,p.clientX,p.clientY)},500)},{passive:true});['touchend','touchmove','touchcancel'].forEach(ev=>$('list').addEventListener(ev,()=>{clearTimeout(lp)},{passive:true}))}
boot();
