<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookings</title>
<style>
  :root{--teal:#0D9C93; --teal-dark:#0a7d75; --navy:#0F2C4C; --ink:#1A2233; --muted:#667085; --bg:#F4F6F8; --border:#E3E7EB; --danger:#D64545; --warn:#E08A2E; --ok:#1E9E5A; --blue:#2D6CDF; --purple:#7A4FDB;}
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:16px;}
  .wrap{max-width:520px; margin:0 auto; padding:20px;}
  .header{text-align:center; padding:20px 0 10px;}
  .header h1{font-size:20px; color:var(--navy); margin:0 0 4px;}
  .header p{color:var(--muted); margin:0;}
  .card{background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px;}
  .section-title{font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; margin:24px 0 10px;}
  .badge{display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; color:#fff;}
  .badge-requested{background:var(--muted);} .badge-scheduled{background:var(--blue);} .badge-en_route{background:var(--warn);}
  .badge-in_progress{background:var(--purple);} .badge-completed{background:var(--ok);} .badge-cancelled{background:var(--danger);}
  .badge-unpaid,.badge-draft{background:var(--muted);} .badge-partial,.badge-overdue{background:var(--warn);} .badge-paid{background:var(--ok);}
  .job-title{font-weight:700; font-size:17px;}
  .muted{color:var(--muted); font-size:14px;}
  .btn{display:inline-block; padding:11px 16px; font-size:15px; font-weight:700; border-radius:9px; border:none; cursor:pointer; margin-top:10px; margin-right:8px;}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-secondary{background:#fff; color:var(--navy); border:1.5px solid var(--navy);}
  input[type=datetime-local]{padding:10px; border:1.5px solid var(--border); border-radius:8px; font-size:15px; width:100%; margin:8px 0;}
  .error{background:#FDEDED; color:var(--danger); padding:12px; border-radius:10px; margin-bottom:14px; font-weight:600;}
  .success{background:#E9F9EF; color:var(--ok); padding:12px; border-radius:10px; margin-bottom:14px; font-weight:600;}
  .empty{text-align:center; color:var(--muted); padding:30px; font-size:15px;}
  .spinner{text-align:center; color:var(--muted); padding:60px 20px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 id="biz-name">My Bookings</h1>
    <p id="biz-sub">Loading…</p>
  </div>
  <div id="content"><div class="spinner">Loading your bookings…</div></div>
</div>

<script>
const API_BASE = window.FIELD_SERVICE_API_BASE || 'https://leadvyne-field-service-api.YOUR_SUBDOMAIN.workers.dev';
const TOKEN = new URLSearchParams(location.search).get('t');

function $(sel){ return document.querySelector(sel); }
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n, cur){ return `${cur || ''} ${Number(n||0).toFixed(2)}`; }
function fmtDate(iso){ return iso ? new Date(iso).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : 'Not scheduled yet'; }

async function api(path, options){
  const res = await fetch(API_BASE + path, { ...options, headers: { 'Content-Type': 'application/json', ...(options && options.headers) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

async function load(){
  if (!TOKEN) { $('#content').innerHTML = '<div class="error">This link is missing its access code. Please use the link your service provider sent you.</div>'; $('#biz-sub').textContent = ''; return; }
  try {
    const data = await api(`/api/portal/${TOKEN}`);
    render(data);
  } catch (e) {
    $('#biz-sub').textContent = '';
    $('#content').innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
  }
}

function render(data){
  $('#biz-name').textContent = data.business.name;
  $('#biz-sub').textContent = `Hi ${data.customer.name}, here are your bookings`;

  const upcoming = data.jobs.filter(j => !['completed','cancelled'].includes(j.status));
  const past = data.jobs.filter(j => ['completed','cancelled'].includes(j.status));

  let html = '';
  html += '<div class="section-title">Upcoming</div>';
  html += upcoming.length ? upcoming.map(j => jobCard(j, data.business.currency)).join('') : '<div class="empty">No upcoming bookings.</div>';

  if (past.length) {
    html += '<div class="section-title">Past</div>';
    html += past.map(j => jobCard(j, data.business.currency)).join('');
  }

  if (data.invoices.length) {
    html += '<div class="section-title">Invoices</div>';
    html += data.invoices.map(inv => `
      <div class="card">
        <div class="job-title">${money(inv.total, inv.currency)}</div>
        <div class="muted">Due ${fmtDate(inv.due_date)}</div>
        <span class="badge badge-${inv.status}">${inv.status}</span>
        ${inv.status !== 'paid' && inv.status !== 'cancelled' ? `<div><button class="btn btn-primary" data-pay="${inv.id}">Pay Now</button></div>` : ''}
      </div>`).join('');
  }

  $('#content').innerHTML = html;

  document.querySelectorAll('[data-reschedule]').forEach(btn => btn.addEventListener('click', () => showRescheduleForm(btn.dataset.reschedule)));
  document.querySelectorAll('[data-cancel]').forEach(btn => btn.addEventListener('click', () => cancelJob(btn.dataset.cancel)));
  document.querySelectorAll('[data-pay]').forEach(btn => btn.addEventListener('click', () => payInvoice(btn.dataset.pay)));
}

function jobCard(j, currency){
  const canManage = ['requested', 'scheduled'].includes(j.status);
  return `
    <div class="card" id="job-${j.id}">
      <div class="job-title">${escapeHtml(j.title)}</div>
      <div class="muted">${fmtDate(j.scheduled_start)}${j.address ? ' · ' + escapeHtml(j.address) : ''}</div>
      <span class="badge badge-${j.status}">${j.status.replace('_',' ')}</span>
      ${j.cancellation_fee_charged ? `<div class="muted">Cancellation fee: ${money(j.cancellation_fee_charged, currency)}</div>` : ''}
      ${canManage ? `<div><button class="btn btn-secondary" data-reschedule="${j.id}">Reschedule</button><button class="btn btn-danger" data-cancel="${j.id}">Cancel</button></div>` : ''}
      <div id="job-extra-${j.id}"></div>
    </div>`;
}

function showRescheduleForm(jobId){
  $('#job-extra-' + jobId).innerHTML = `
    <input type="datetime-local" id="resched-${jobId}">
    <button class="btn btn-primary" id="resched-save-${jobId}">Confirm New Time</button>
  `;
  $('#resched-save-' + jobId).addEventListener('click', async () => {
    const val = $('#resched-' + jobId).value;
    if (!val) return;
    try {
      await api(`/api/portal/${TOKEN}/jobs/${jobId}/reschedule`, { method: 'POST', body: JSON.stringify({ scheduled_start: new Date(val).toISOString() }) });
      $('#job-extra-' + jobId).innerHTML = '<div class="success">Reschedule requested — the business will confirm.</div>';
      setTimeout(load, 1200);
    } catch (e) {
      $('#job-extra-' + jobId).innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
    }
  });
}

async function cancelJob(jobId){
  if (!confirm('Cancel this booking? A cancellation fee may apply if it is close to the scheduled time.')) return;
  try {
    const r = await api(`/api/portal/${TOKEN}/jobs/${jobId}/cancel`, { method: 'POST' });
    $('#job-extra-' + jobId).innerHTML = `<div class="success">Booking cancelled.${r.cancellation_fee_charged ? ' Fee: ' + r.cancellation_fee_charged : ''}</div>`;
    setTimeout(load, 1200);
  } catch (e) {
    $('#job-extra-' + jobId).innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
  }
}

async function payInvoice(invoiceId){
  try {
    const r = await api(`/api/portal/${TOKEN}/invoices/${invoiceId}/pay-intent`, { method: 'POST' });
    alert(r.message || 'Online payment is not available yet.');
  } catch (e) {
    alert(e.message);
  }
}

load();
</script>
</body>
</html>
