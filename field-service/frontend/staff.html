<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Jobs</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D9C93">
<style>
  :root{
    --teal:#0D9C93; --teal-dark:#0a7d75; --navy:#0F2C4C; --ink:#111; --muted:#667085;
    --bg:#F4F6F8; --card:#ffffff; --border:#E3E7EB; --danger:#D64545; --warn:#E08A2E;
    --ok:#1E9E5A; --blue:#2D6CDF; --purple:#7A4FDB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:18px; -webkit-tap-highlight-color:transparent;
  }
  .screen{display:none; min-height:100vh; flex-direction:column;}
  .screen.active{display:flex;}
  .topbar{
    background:var(--navy); color:#fff; padding:18px 20px; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:5;
  }
  .topbar h1{font-size:20px; margin:0; font-weight:700;}
  .topbar button{background:none; border:none; color:#fff; font-size:16px; padding:8px;}
  .content{flex:1; padding:16px; padding-bottom:40px;}
  .btn{
    display:block; width:100%; padding:18px 16px; font-size:20px; font-weight:700;
    border-radius:14px; border:none; text-align:center; cursor:pointer; margin-bottom:12px;
    min-height:60px;
  }
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:active{background:var(--teal-dark);}
  .btn-secondary{background:#fff; color:var(--navy); border:2px solid var(--navy);}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-block{margin-top:8px;}
  .btn:disabled{opacity:.5;}
  input[type=email],input[type=password],input[type=number],input[type=text],select,textarea{
    width:100%; padding:16px; font-size:18px; border:2px solid var(--border); border-radius:12px;
    margin-bottom:14px; background:#fff; color:var(--ink); font-family:inherit;
  }
  label{display:block; font-weight:600; margin-bottom:6px; color:var(--navy);}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px;
    margin-bottom:14px; box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .job-card{display:block; text-decoration:none; color:inherit;}
  .job-time{font-size:22px; font-weight:800; color:var(--navy);}
  .job-title{font-size:19px; font-weight:700; margin:4px 0 2px;}
  .job-customer{color:var(--muted); font-size:16px;}
  .badge{
    display:inline-block; padding:5px 12px; border-radius:999px; font-size:14px; font-weight:700;
    color:#fff; margin-top:8px;
  }
  .badge-requested{background:var(--muted);}
  .badge-scheduled{background:var(--blue);}
  .badge-en_route{background:var(--warn);}
  .badge-in_progress{background:var(--purple);}
  .badge-completed{background:var(--ok);}
  .badge-cancelled{background:var(--danger);}
  .empty{text-align:center; color:var(--muted); padding:60px 20px; font-size:18px;}
  .error{background:#FDEDED; color:var(--danger); padding:14px; border-radius:10px; margin-bottom:14px; font-weight:600;}
  .success{background:#E9F9EF; color:var(--ok); padding:14px; border-radius:10px; margin-bottom:14px; font-weight:600;}
  .row{display:flex; gap:10px;}
  .row .btn{flex:1;}
  .detail-line{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); align-items:flex-start;}
  .detail-line:last-child{border-bottom:none;}
  .detail-icon{font-size:22px; width:28px; text-align:center;}
  .detail-text a{color:var(--navy); font-weight:700; text-decoration:none;}
  .section-title{font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; margin:22px 0 10px;}
  .spinner{text-align:center; padding:40px; color:var(--muted); font-size:18px;}
  .logo{font-size:30px; font-weight:900; color:var(--navy); text-align:center; margin:40px 0 10px;}
  .tagline{text-align:center; color:var(--muted); margin-bottom:30px;}
</style>
</head>
<body>

<!-- ═══ LOGIN SCREEN ═══ -->
<div id="screen-login" class="screen active">
  <div class="content">
    <div class="logo">🔧 Field Service</div>
    <div class="tagline">Staff sign in</div>
    <div id="login-error"></div>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" autocomplete="username" placeholder="you@example.com">
    <label for="login-password">Password</label>
    <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn btn-primary" id="login-btn">Log In</button>
  </div>
</div>

<!-- ═══ JOB LIST SCREEN ═══ -->
<div id="screen-jobs" class="screen">
  <div class="topbar">
    <h1 id="jobs-greeting">My Jobs</h1>
    <button id="logout-btn">Log Out</button>
  </div>
  <div class="content">
    <div id="jobs-list"><div class="spinner">Loading your jobs…</div></div>
  </div>
</div>

<!-- ═══ JOB DETAIL SCREEN ═══ -->
<div id="screen-job" class="screen">
  <div class="topbar">
    <button id="job-back-btn">← Back</button>
    <h1>Job Details</h1>
    <span style="width:60px"></span>
  </div>
  <div class="content" id="job-detail-content">
    <div class="spinner">Loading…</div>
  </div>
</div>

<script>
// ─────────────────────────── config ───────────────────────────
// Point this at your deployed Worker (see ../README.md "Quick start").
const API_BASE = window.FIELD_SERVICE_API_BASE || 'https://leadvyne-field-service-api.YOUR_SUBDOMAIN.workers.dev';
const AUTH_KEY = 'fs_staff_auth';

const STATUS_LABELS = {
  requested: 'Requested', scheduled: 'Scheduled', en_route: 'On the way',
  in_progress: 'In progress', completed: 'Completed', cancelled: 'Cancelled',
};

// ─────────────────────────── tiny helpers ───────────────────────────
function $(sel){ return document.querySelector(sel); }
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#' + id).classList.add('active');
}
function getAuth(){
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch { return null; }
}
function setAuth(auth){ localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }
function clearAuth(){ localStorage.removeItem(AUTH_KEY); }

async function api(path, options){
  const auth = getAuth();
  const headers = { 'Content-Type': 'application/json', ...(options && options.headers) };
  if (auth && auth.token) headers.Authorization = `Bearer ${auth.token}`;
  const res = await fetch(API_BASE + path, { ...options, headers });
  if (res.status === 401) { clearAuth(); showScreen('screen-login'); throw new Error('Session expired — please log in again'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function fmtTime(iso){
  if (!iso) return 'No time set';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

// ─────────────────────────── login ───────────────────────────
$('#login-btn').addEventListener('click', async () => {
  const email = $('#login-email').value.trim();
  const password = $('#login-password').value;
  const errBox = $('#login-error');
  errBox.innerHTML = '';
  if (!email || !password) { errBox.innerHTML = '<div class="error">Please enter your email and password.</div>'; return; }
  const btn = $('#login-btn'); btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const res = await fetch(API_BASE + '/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    setAuth({ token: data.token, user: data.user });
    goToJobsList();
  } catch (e) {
    errBox.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Log In';
  }
});

$('#logout-btn').addEventListener('click', () => { clearAuth(); showScreen('screen-login'); });

// ─────────────────────────── job list ───────────────────────────
let currentJobId = null;

async function goToJobsList(){
  const auth = getAuth();
  $('#jobs-greeting').textContent = auth && auth.user ? `Hi, ${auth.user.name.split(' ')[0]}` : 'My Jobs';
  showScreen('screen-jobs');
  $('#jobs-list').innerHTML = '<div class="spinner">Loading your jobs…</div>';
  try {
    const jobs = await api('/api/jobs/mine');
    renderJobList(jobs);
  } catch (e) {
    $('#jobs-list').innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
  }
}

function renderJobList(jobs){
  if (!jobs.length) {
    $('#jobs-list').innerHTML = '<div class="empty">🎉 No jobs assigned right now.<br>Pull down or come back later.</div>';
    return;
  }
  $('#jobs-list').innerHTML = jobs.map(j => `
    <a class="card job-card" href="#" data-job-id="${j.id}">
      <div class="job-time">${fmtTime(j.scheduled_start)}</div>
      <div class="job-title">${escapeHtml(j.title)}</div>
      <div class="job-customer">${escapeHtml(j.customer_name)} • ${escapeHtml(j.customer_address || 'No address')}</div>
      <span class="badge badge-${j.status}">${STATUS_LABELS[j.status] || j.status}</span>
    </a>
  `).join('');
  $('#jobs-list').querySelectorAll('.job-card').forEach(el => {
    el.addEventListener('click', (e) => { e.preventDefault(); openJob(el.dataset.jobId); });
  });
}

$('#job-back-btn').addEventListener('click', goToJobsList);

// ─────────────────────────── job detail ───────────────────────────
async function openJob(jobId){
  currentJobId = jobId;
  showScreen('screen-job');
  $('#job-detail-content').innerHTML = '<div class="spinner">Loading…</div>';
  try {
    const job = await api(`/api/jobs/${jobId}`);
    renderJobDetail(job);
  } catch (e) {
    $('#job-detail-content').innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
  }
}

function renderJobDetail(job){
  const phoneDigits = (job.customer_phone || '').replace(/[^\d+]/g, '');
  const mapsQuery = encodeURIComponent(job.customer_address || job.address || '');
  const alreadyCheckedIn = (job.checkins || []).some(c => c.type === 'check_in');
  const alreadyCheckedOut = (job.checkins || []).some(c => c.type === 'check_out');

  let actionButtons = '';
  if (job.status === 'cancelled') {
    actionButtons = `<div class="error">This job was cancelled${job.cancelled_reason ? ': ' + escapeHtml(job.cancelled_reason) : '.'}</div>`;
  } else if (job.status === 'completed') {
    actionButtons = `<div class="success">✅ Job completed.</div>`;
  } else {
    actionButtons = `
      ${job.status !== 'en_route' && job.status !== 'in_progress' ? `<button class="btn btn-secondary" id="btn-enroute">🚗 I'm On My Way</button>` : ''}
      ${!alreadyCheckedIn ? `<button class="btn btn-primary" id="btn-checkin">📍 Check In (Start Job)</button>` : ''}
      ${alreadyCheckedIn && !alreadyCheckedOut ? `<button class="btn btn-primary" id="btn-checkout">✅ Check Out (Mark Complete)</button>` : ''}
      <button class="btn btn-secondary" id="btn-parts">🧰 Log Parts Used</button>
    `;
  }

  $('#job-detail-content').innerHTML = `
    <div id="job-action-msg"></div>
    <div class="card">
      <div class="job-title" style="font-size:22px">${escapeHtml(job.title)}</div>
      <span class="badge badge-${job.status}">${STATUS_LABELS[job.status] || job.status}</span>
      <div class="detail-line">
        <div class="detail-icon">🕒</div>
        <div class="detail-text">${fmtTime(job.scheduled_start)}</div>
      </div>
      <div class="detail-line">
        <div class="detail-icon">👤</div>
        <div class="detail-text">${escapeHtml(job.customer_name)}</div>
      </div>
      ${job.customer_phone ? `
      <div class="detail-line">
        <div class="detail-icon">📞</div>
        <div class="detail-text"><a href="tel:${escapeHtml(phoneDigits)}">${escapeHtml(job.customer_phone)}</a></div>
      </div>` : ''}
      <div class="detail-line">
        <div class="detail-icon">📍</div>
        <div class="detail-text"><a href="https://maps.google.com/?q=${mapsQuery}" target="_blank" rel="noopener">${escapeHtml(job.customer_address || job.address || 'No address on file')}</a></div>
      </div>
      ${job.description ? `
      <div class="detail-line">
        <div class="detail-icon">📝</div>
        <div class="detail-text">${escapeHtml(job.description)}</div>
      </div>` : ''}
    </div>
    <div class="section-title">Actions</div>
    ${actionButtons}
  `;

  $('#btn-enroute') && $('#btn-enroute').addEventListener('click', () => setStatus('en_route'));
  $('#btn-checkin') && $('#btn-checkin').addEventListener('click', () => doGpsAction('checkin'));
  $('#btn-checkout') && $('#btn-checkout').addEventListener('click', () => doGpsAction('checkout'));
  $('#btn-parts') && $('#btn-parts').addEventListener('click', () => openPartsPicker());
}

function jobMsg(html){ $('#job-action-msg').innerHTML = html; }

async function setStatus(status){
  jobMsg('<div class="spinner">Updating…</div>');
  try {
    await api(`/api/jobs/${currentJobId}`, { method: 'PATCH', body: JSON.stringify({ status }) });
    openJob(currentJobId);
  } catch (e) {
    jobMsg(`<div class="error">${escapeHtml(e.message)}</div>`);
  }
}

function getLocation(){
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error('Location is not available on this device/browser.')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve(pos.coords),
      err => reject(new Error(err.code === 1
        ? 'Location permission denied. Please allow location access and try again.'
        : 'Could not get your location. Move outdoors or check GPS is on.')),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  });
}

async function doGpsAction(kind){
  jobMsg('<div class="spinner">Getting your location…</div>');
  try {
    const coords = await getLocation();
    await api(`/api/jobs/${currentJobId}/${kind}`, {
      method: 'POST',
      body: JSON.stringify({ lat: coords.latitude, lng: coords.longitude, accuracy_m: coords.accuracy }),
    });
    if (kind === 'checkout') await api(`/api/jobs/${currentJobId}`, { method: 'PATCH', body: JSON.stringify({ status: 'completed' }) });
    openJob(currentJobId);
  } catch (e) {
    jobMsg(`<div class="error">${escapeHtml(e.message)}</div>`);
  }
}

// ─────────────────────────── parts picker ───────────────────────────
async function openPartsPicker(){
  jobMsg('<div class="spinner">Loading parts list…</div>');
  try {
    const parts = await api('/api/parts');
    if (!parts.length) { jobMsg('<div class="error">No parts set up yet. Ask your manager to add inventory.</div>'); return; }
    jobMsg(`
      <div class="card">
        <label for="part-select">Part used</label>
        <select id="part-select">${parts.map(p => `<option value="${p.id}">${escapeHtml(p.name)} (${p.qty_on_hand} in stock)</option>`).join('')}</select>
        <label for="part-qty">Quantity</label>
        <input id="part-qty" type="number" min="1" step="1" value="1">
        <button class="btn btn-primary" id="part-save-btn">Save</button>
      </div>
    `);
    $('#part-save-btn').addEventListener('click', async () => {
      const partId = $('#part-select').value;
      const qty = Number($('#part-qty').value) || 1;
      jobMsg('<div class="spinner">Saving…</div>');
      try {
        await api(`/api/jobs/${currentJobId}/parts`, { method: 'POST', body: JSON.stringify({ part_id: partId, qty }) });
        jobMsg('<div class="success">Parts logged ✅</div>');
      } catch (e) {
        jobMsg(`<div class="error">${escapeHtml(e.message)}</div>`);
      }
    });
  } catch (e) {
    jobMsg(`<div class="error">${escapeHtml(e.message)}</div>`);
  }
}

// ─────────────────────────── boot ───────────────────────────
if (getAuth()) goToJobsList(); else showScreen('screen-login');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
