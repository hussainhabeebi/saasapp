name: Fix Gemini reply model
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update retired Gemini model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/worker.js')
          s=p.read_text()
          old="const ENGINE_GEMINI_MODEL='gemini-2.0-flash';"
          new="const ENGINE_GEMINI_MODEL='gemini-3.6-flash';"
          if old not in s:
              raise SystemExit('Expected retired Gemini model constant not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/worker.js
          git commit -m "fix(ai): migrate reply model from retired Gemini 2.0"
          git push origin HEAD:main
