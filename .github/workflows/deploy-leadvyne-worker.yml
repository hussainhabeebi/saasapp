name: Deploy Leadvyne Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-leadvyne-worker.yml'
  workflow_dispatch:

concurrency:
  group: leadvyne-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy leadvyne-api-proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify native POOMAS entry
        run: |
          node --check cloudflare-worker/worker.js
          node --check cloudflare-worker/worker-entry.js
          node --check cloudflare-worker/live-travel-poomas-native.js

      - name: Verify Cloudflare account
        working-directory: cloudflare-worker
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        working-directory: cloudflare-worker
        run: npx wrangler d1 migrations apply leadvyne-d1 --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy leadvyne-api-proxy
        working-directory: cloudflare-worker
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirm Cloudflare deployment
        working-directory: cloudflare-worker
        run: npx wrangler deployments list --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
